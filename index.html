  荆:'荊',庄:'莊',莱:'萊',虚:'虛',蝉:'蟬',谣:'謠',贬:'貶',邹:'鄒',陈:'陳',陆:'陸',
  韩:'韓',颀:'頎',枫:'楓',军:'軍',湾:'灣',卖:'賣',鹅:'鵝',浑:'渾',渐:'漸',凉:'涼',
  湾:'灣',咸:'咸',
  参:'參',员:'員',岛:'島',广:'廣',几:'幾',济:'濟',涣:'渙',临:'臨',隐:'隱',颢:'顥',
  龄:'齡',闺:'閨',关:'關',补:'補',访:'訪',试:'試',贫:'貧',贼:'賊',宾:'賓',
  迹:'蹟',踪:'蹤',卢:'盧',结:'結',绅:'紳',狱:'獄',仆:'僕',堂:'堂'
};
const TANG_T2S = {};
for (const k in TANG_S2T) TANG_T2S[TANG_S2T[k]] = k;
/* 同字异体写法（数据集用字） */
TANG_T2S['幹'] = '干'; TANG_T2S['乾'] = '干';
TANG_T2S['嶽'] = '岳'; TANG_T2S['臺'] = '台'; TANG_T2S['裏'] = '里';
TANG_T2S['樑'] = '梁'; TANG_T2S['徵'] = '征'; TANG_T2S['爲'] = '为';
TANG_T2S['閒'] = '闲'; TANG_T2S['閑'] = '闲'; TANG_T2S['著'] = '着';
function tangFold(s){
  let out = '';
  for (const ch of String(s)) out += TANG_T2S[ch] || ch;
  return out.replace(/\s+/g, '');
}
const TANG_FOLD = TANG300.map(p => tangFold(p.t + p.a + (p.s || '')));
let poemFavs = store.get('poem.favs', []);
if (!Array.isArray(poemFavs)) poemFavs = [];
let poemFavMode = false;
let poemCur = 0;
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function openPoem(i){
  if (i < 0 || i >= TANG300.length) return;
  poemCur = i;
  const p = TANG300[i];
  $('#poemLobby').classList.add('hidden');
  $('#poemView').classList.remove('hidden');
  $('#poemTitle').textContent = p.t;
  $('#poemMeta').innerHTML = '<span>'+escHtml(p.c)+'</span><span>'+escHtml(p.a)+'</span>'
    + (p.s && p.s !== p.t ? '<span>· '+escHtml(p.s)+'</span>' : '');
  const body = $('#poemBody');
  body.innerHTML = p.p.map(l => '<p>'+escHtml(l)+'</p>').join('');
  body.classList.toggle('long-poem', p.p.length > 10);
  syncPoemFav();
  window.scrollTo(0, 0);
}
function syncPoemFav(){
  const on = poemFavs.includes(poemCur);
  const b = $('#poemFavToggle');
  b.textContent = on ? '★ 已收藏' : '☆ 收藏';
  b.className = 'px-btn ' + (on ? 'yellow' : 'ghost');
}
function syncPoemFavBtn(){
  const b = $('#poemFavBtn');
  b.textContent = poemFavMode ? ('★ 收藏中(' + poemFavs.length + ')') : ('☆ 收藏夹(' + poemFavs.length + ')');
  b.className = 'px-btn ' + (poemFavMode ? 'yellow' : 'ghost');
}
function renderPoems(){
  const q = ($('#poemSearch').value || '').trim().replace(/\s+/g, '');
  let idx = TANG300.map((p, i) => i);
  if (poemFavMode) idx = idx.filter(i => poemFavs.includes(i));
  if (q){
    const fq = tangFold(q);
    idx = idx.filter(i => TANG_FOLD[i].includes(fq)
      || (TANG300[i].t + TANG300[i].a + (TANG300[i].s || '')).replace(/\s+/g, '').includes(q));
  }
  const grid = $('#poemGrid');
  grid.innerHTML = idx.length ? idx.map(i => {
    const p = TANG300[i];
    const star = poemFavs.includes(i) ? '<span class="poem-star">★</span>' : '';
    const alt = (p.s && p.s !== p.t) ? '<br><small>（'+escHtml(p.s)+'）</small>' : '';
    return '<button class="game-card poem-card" data-pi="'+i+'" type="button">'
      + '<span class="card-icon" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 32 32">'
      + '<rect x="6" y="4" width="20" height="24" rx="1" fill="#2c2d5c"/>'
      + '<rect x="9" y="8" width="2" height="15" fill="#ff8ac2"/>'
      + '<rect x="13" y="8" width="2" height="15" fill="#9aa0d8"/>'
      + '<rect x="17" y="8" width="2" height="11" fill="#9aa0d8"/>'
      + '<rect x="10" y="25" width="14" height="1.6" fill="#0b0c18"/>'
      + '</svg></span>'
      + '<span class="card-name">'+escHtml(p.t)+alt+'</span>'
      + '<span class="card-desc">'+escHtml(p.a)+' · '+escHtml(p.p[0]||'')+'</span>'
      + star + '</button>';
  }).join('') : '';
  $('#poemEmptyTip').style.display = idx.length ? 'none' : 'block';
  $$('#poemGrid .poem-card').forEach(c => c.addEventListener('click', () => { openPoem(+c.dataset.pi); sfx.click(); }));
  $('#poemCount').textContent = TANG300.length;
  initPager('#poemPager', '#poemGrid .poem-card', 16);
}
function copyPoemText(){
  const p = TANG300[poemCur];
  if (!p) return;
  const text = p.t + '\n' + p.a + '\n\n' + p.p.join('\n');
  const done = () => sfx.point();
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => copyFallback(text, done));
  } else copyFallback(text, done);
}
function copyFallback(text, done){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    done();
  }catch(e){ sfx.bonk(); }
}
$('#poemSearch').addEventListener('input', () => renderPoems());
$('#poemRnd').addEventListener('click', () => {
  if (!TANG300.length) return;
  let i;
  do { i = Math.floor(Math.random() * TANG300.length); } while (TANG300.length > 1 && i === poemCur);
  openPoem(i); sfx.pop();
});
$('#poemDaily').addEventListener('click', () => {
  const d = new Date();
  const seed = d.getFullYear() * 372 + (d.getMonth() + 1) * 31 + d.getDate();
  $('#poemSearch').value = '';
  poemFavMode = false; syncPoemFavBtn();
  openPoem(seed % TANG300.length); sfx.point();
});
$('#poemFavBtn').addEventListener('click', () => { poemFavMode = !poemFavMode; syncPoemFavBtn(); renderPoems(); sfx.click(); });
$('#poemBack').addEventListener('click', () => {
  $('#poemView').classList.add('hidden');
  $('#poemLobby').classList.remove('hidden');
  renderPoems(); sfx.click();
});
$('#poemPrevB').addEventListener('click', () => { openPoem(poemCur - 1); sfx.click(); });
$('#poemNextB').addEventListener('click', () => { openPoem(poemCur + 1); sfx.click(); });
$('#poemFavToggle').addEventListener('click', () => {
  const k = poemFavs.indexOf(poemCur);
  if (k >= 0){ poemFavs.splice(k, 1); sfx.bonk(); } else { poemFavs.push(poemCur); sfx.point(); }
  store.set('poem.favs', poemFavs);
  syncPoemFav(); syncPoemFavBtn();
});
$('#poemCopy').addEventListener('click', copyPoemText);
syncPoemFavBtn();
renderPoems();

/* ---------- 启动 ---------- */
window.__audioReady = false;
document.addEventListener('pointerdown', () => { window.__audioReady = true; }, { once:true });
$$('#gameLobby .game-card').forEach(c => c.addEventListener('click', () => mountGame(c.dataset.game)));
$$('#toyLobby .game-card').forEach(c => c.addEventListener('click', () => mountToy(c.dataset.toy)));

/* ---------- 大厅分页 ---------- */
function initPager(pagerSel, cardSel, perPage){
  const old = $(pagerSel);
  const pager = old.cloneNode(false);
  old.replaceWith(pager);
  const cards = $$(cardSel);
  if (!cards.length) return;
  let page = 0;
  const pages = Math.max(1, Math.ceil(cards.length / perPage));
  const show = () => {
    cards.forEach((c, i) => { c.style.display = Math.floor(i / perPage) === page ? '' : 'none'; });
    if (pages > 1) {
      pager.innerHTML = ''
        + '<button class="px-btn ghost pg-btn" data-pg="prev" type="button"' + (page === 0 ? ' disabled' : '') + '>◀</button>'
        + '<span class="pg-info">' + (page + 1) + ' / ' + pages + '</span>'
        + '<button class="px-btn ghost pg-btn" data-pg="next" type="button"' + (page === pages - 1 ? ' disabled' : '') + '>▶</button>';
    } else {
      pager.innerHTML = '';
    }
  };
  pager.addEventListener('click', e => {
    const b = e.target.closest('[data-pg]');
    if (!b) return;
    if (b.dataset.pg === 'prev' && page > 0) { page--; show(); sfx.click(); }
    if (b.dataset.pg === 'next' && page < pages - 1) { page++; show(); sfx.click(); }
  });
  show();
}
initPager('#gamePager', '#gameLobby .game-card', 16);
initPager('#toyPager', '#toyLobby .game-card', 16);
syncHeader();
const initialHash = (location.hash || '').replace('#', '');
if(VIEWS[initialHash]) setTab(initialHash);
renderRandom();
</script>
