  if(!S.over){
    if(S.frames%34===0&&S.foes.length<14){
      const fromLeft=Math.random()<0.5;
      const r=Math.random();
      let size;
      if(r<0.72) size=5+Math.random()*(S.size*1.0);
      else size=S.size*(1.08+Math.random()*0.5);
      if(size<5) size=5;
      S.foes.push({x:fromLeft?-30:510, y:24+Math.random()*310, size, vx:(fromLeft?1:-1)*(0.9+Math.random()*1.4), col:Math.floor(Math.random()*4), wob:Math.random()*6, gold:Math.random()<0.06});
    }
    for(let i=S.foes.length-1;i>=0;i--){
      const f=S.foes[i];
      f.x+=f.vx;
      if(f.x<-60||f.x>540){ S.foes.splice(i,1); continue; }
      const dist=Math.hypot(f.x-P.x,f.y-P.y), danger=f.size>=S.size*1.02;
      if(dist<S.size*0.7+f.size*0.6){
        if(danger){
          S.foes.splice(i,1); S.lives--; S.size=Math.max(13,S.size-3); updateFishyHud(S); sfx.lose();
          for(let k=0;k<6;k++) S.sparks.push({x:P.x,y:P.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:1,col:'#ff8ac2'});
          if(S.lives<=0){
            S.over=true;
            if(S.score>S.best){ S.best=S.score; store.set('fishy.best',S.best); }
            updateFishyHud(S);
            stageOverlay(S.mount,'被吃掉了！','得分 '+S.score+' · 身长 '+Math.round(S.size)+' · 最高 '+S.best,'重整旗鼓',()=>startFishy(S));
            return;
          }
        } else {
          S.foes.splice(i,1);
          const pts=f.gold?Math.ceil(f.size*3):Math.ceil(f.size);
          S.score+=pts; S.size+=f.gold?1.2:0.5;
          updateFishyHud(S); sfx.eat();
          for(let k=0;k<4;k++) S.sparks.push({x:f.x,y:f.y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:1,col:f.gold?'#ffe95c':'#3ddc84'});
        }
      }
    }
  }
  for(let i=S.sparks.length-1;i>=0;i--){ const p=S.sparks[i]; p.x+=p.vx; p.y+=p.vy; p.life-=0.05; if(p.life<=0) S.sparks.splice(i,1); }
  drawFishy(S);
}
function drawFishy(S){
  const {ctx}=S;
  ctx.fillStyle='#0d2240'; ctx.fillRect(0,0,480,360);
  ctx.fillStyle='rgba(77,166,255,.12)';
  for(let i=0;i<5;i++) ctx.fillRect(0,60+i*60+Math.sin(S.frames/48+i)*3,480,10);
  const drawFish=function(x,y,size,col,dir,face,gold){
    ctx.save(); ctx.translate(x,y); ctx.scale(dir,1);
    ctx.fillStyle=gold?'#ffe95c':['#ff3d5a','#ffc53d','#4da6ff','#b18cff'][col]||'#b18cff';
    ctx.beginPath(); ctx.ellipse(0,0,size,size*0.64,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-size*0.85,0); ctx.lineTo(-size*1.5,-size*0.5); ctx.lineTo(-size*1.5,size*0.5); ctx.fill();
    ctx.fillStyle='#eef0ff'; ctx.beginPath(); ctx.arc(size*0.45,-size*0.16,size*0.18,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0b0c18'; ctx.beginPath(); ctx.arc(size*0.5,-size*0.16,size*0.09,0,Math.PI*2); ctx.fill();
    ctx.restore();
    if(face){ ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1; }
  };
  for(const f of S.foes){
    drawFish(f.x, f.y+Math.sin(S.frames/16+f.wob)*3, f.size, f.col, Math.sign(f.vx)||1, false, f.gold);
  }
  const P=S.player, dir=S? (S.tx>=P.x?1:-1):1;
  drawFish(P.x,P.y,S.size,0,dir,true,false);
  ctx.fillStyle='#3ddc84';
  for(let i=0;i<S.lives;i++) ctx.fillRect(8+i*14,8,8,8);
  for(const p of S.sparks){ ctx.fillStyle=p.col; ctx.globalAlpha=Math.max(0,p.life); ctx.fillRect(p.x-2,p.y-2,4,4); }
  ctx.globalAlpha=1;
}
function updateFishyHud(S){
  $('#fshS').textContent=S.score;
  $('#fshL').textContent='❤'.repeat(Math.max(0,S.lives))+'·'.repeat(Math.max(0,3-S.lives));
  $('#fshZ').textContent=Math.round(S.size);
  $('#fshB').textContent=S.best;
}

function stepRhythm(S){

    if(S.marker<32){ S.marker=32; S.dir=1; }

  ctx.beginPath(); ctx.moveTo(S.marker,146); ctx.lineTo(S.marker+9,158); ctx.lineTo(S.marker,170); ctx.lineTo(S.marker-9,158); ctx.fill();

function lunarTerrain(S){
  const pts=[];
  let y=140+Math.random()*160;
  for(let i=0;i<=20;i++){ pts.push(y); y=Math.max(70,Math.min(320,y+(Math.random()-0.5)*54)); }
  const pad=Math.floor(2+Math.random()*16);
  const padY=Math.max(95,Math.min(300,90+Math.random()*160));
  pts[pad]=padY; pts[pad+1]=padY;
  S.terrain={pts,pad,padX1:pad*24,padX2:(pad+1)*24};
}
function startLunar(S){
  if(!S) return;
  S.mount.querySelectorAll('.overlay').forEach(o=>o.remove());

}
function stepLunar(S){
  S.frames++;
  if(!S.over){
    const sp=S.ship;
    if(S.kU&&S.fuel>0){ sp.vy-=0.085; S.fuel=Math.max(0,S.fuel-0.4); }
    if(S.kL&&S.fuel>0){ sp.vx-=0.05; S.fuel=Math.max(0,S.fuel-0.12); }
    if(S.kR&&S.fuel>0){ sp.vx+=0.05; S.fuel=Math.max(0,S.fuel-0.12); }
    sp.vy+=0.026; sp.vx*=0.999;
    sp.x+=sp.vx; sp.y+=sp.vy;
    if(sp.x<12){ sp.x=12; sp.vx=Math.abs(sp.vx)*0.5; }
    if(sp.x>468){ sp.x=468; sp.vx=-Math.abs(sp.vx)*0.5; }
    if(sp.y<14){ sp.y=14; sp.vy=0; }
    const j=Math.max(0,Math.min(19,Math.floor(sp.x/24)));
    const gy=S.terrain.pts[j];
    if(sp.y+11>=gy){
      const onPad=sp.x>=S.terrain.padX1&&sp.x<=S.terrain.padX2;
      const gentle=Math.abs(sp.vx)<=0.55&&sp.vy<=0.95;
      const px=sp.x,py=sp.y+11;
      if(onPad&&gentle){

      } else {

        for(let k=0;k<16;k++) S.parts.push({x:px,y:py,vx:(Math.random()-.5)*6,vy:-Math.random()*5,life:1,col:k%2?'#ff8ac2':'#ffc53d'});

      }

    }

  }
  for(let i=S.parts.length-1;i>=0;i--){ const p=S.parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life-=0.03; if(p.life<=0) S.parts.splice(i,1); }
  drawLunar(S);

function drawLunar(S){

  ctx.fillStyle='#0e1030'; ctx.fillRect(0,0,480,360);

  const t=S.terrain;

function updateHbrHud(S){
  $('#hbrM').textContent=S.money+'元';
  $('#hbrT').textContent=Math.ceil(Math.max(0,1800-S.frames)/60)+'s';
  $('#hbrB').textContent=S.best+'元';
}
function stepHbr(S){
  S.frames++;
  if(S.started&&!S.over){
    if(S.frames>=1800){ hbrEnd(S); }
    else {
      if(S.frames>=S.spawnAt){
        const prog=S.frames/1800;
        S.spawnAt=S.frames+Math.max(7,Math.round(24-14*prog));
        if(Math.random()<(0.10+0.10*prog)){
          S.items.push({x:30+Math.random()*420,y:-24,r:14+Math.random()*5,vy:1.5+Math.random()*1.5+prog,ph:Math.random()*6,boom:true});
        } else {
          const r=10+Math.random()*9, tier=Math.random();
          let value;
          if(r<12) value=tier<0.8?1:2;
          else if(r<15) value=tier<0.6?2:5;
          else if(r<17.5) value=tier<0.5?5:10;
          else value=20;
          S.items.push({x:30+Math.random()*420,y:-24,r,vy:1.3+Math.random()*1.5+prog*1.2,ph:Math.random()*6,boom:false,value});
        }
      }
      S.items.forEach(it=>{ it.y+=it.vy; it.x+=Math.sin(S.frames/28+it.ph)*0.7; });
      S.items=S.items.filter(it=>it.y<392);
      if(S.frames%10===0) $('#hbrT').textContent=Math.ceil(Math.max(0,1800-S.frames)/60)+'s';
    }
  }
  if(S.shake>0) S.shake=Math.max(0,S.shake-2);
  for(let i=S.pops.length-1;i>=0;i--){ const p=S.pops[i]; p.y-=0.8; p.t--; if(p.t<=0) S.pops.splice(i,1); }
  for(let i=S.sparks.length-1;i>=0;i--){ const p=S.sparks[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=0.07; if(p.life<=0) S.sparks.splice(i,1); }
  drawHbr(S);
}
function drawHbr(S){
  const {ctx}=S;
  ctx.fillStyle='#180d13'; ctx.fillRect(0,0,480,360);
  for(const g of S.goldDust){
    g.y+=g.sp; if(g.y>370) g.y=-8;
    ctx.fillStyle='rgba(255,233,92,'+(0.12+0.18*Math.abs(Math.sin(S.frames/40+g.ph)))+')';
    ctx.fillRect(g.x,g.y,2,2);
  }
  ctx.save();
  if(S.shake>0) ctx.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake);
  for(const it of S.items){
    if(it.boom){
      ctx.fillStyle='#20222c'; ctx.beginPath(); ctx.arc(it.x,it.y,it.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#3a3d4e'; ctx.beginPath(); ctx.arc(it.x-3,it.y-3,it.r*0.35,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ff8ac2'; ctx.fillRect(it.x-1.5,it.y-it.r-7,3,7);
    } else {
      const w=it.r*1.6, h=it.r*2.2;
      ctx.fillStyle='#e12d45'; ctx.fillRect(it.x-w/2,it.y-h/2,w,h);
      ctx.fillStyle='#b81f35'; ctx.fillRect(it.x-w/2,it.y-h/2,w,3);
      ctx.fillStyle='#ffe95c'; ctx.fillRect(it.x-w*0.28,it.y-h*0.18,w*0.56,w*0.42);
      ctx.fillStyle='#8a5a33'; ctx.fillRect(it.x-w*0.2,it.y-h*0.06,w*0.4,2);
    }
  }
  ctx.fillStyle='#ffe95c'; ctx.font='13px DotGothic16,monospace'; ctx.textAlign='center';
  for(const p of S.pops) ctx.fillText(p.txt,p.x,p.y);
  ctx.textAlign='left';
  for(const p of S.sparks){ ctx.fillStyle=p.col; ctx.globalAlpha=Math.max(0,p.life); ctx.fillRect(p.x-2,p.y-2,4,4); }
  ctx.globalAlpha=1;
  ctx.restore();
}

/* ---------------- 弹珠机 ---------------- */
const PIN_MULT=[5,2,1,1,1,2,5];
const PIN_TOP=44, PIN_FLOOR=440;
let pinG = null;
GAMES.pin = {
  title:'弹珠机',
  mount(mountEl, statsEl){
    mountEl.classList.add('stage');
    const S = pinG = { mount:mountEl, raf:0, frames:0, score:0, used:0, best:store.get('pin.best',0), balls:[], texts:[], glow:new Map(), shake:0, cd:0 };
    S.pegs=[];
    for(let row=0;row<6;row++){
      const y=150+row*44, n=(row%2===0)?7:6;
      for(let i=0;i<n;i++) S.pegs.push({x:(row%2===0)?46+i*55:74+i*55,y,b:0});
    }
    statsEl.innerHTML='<div class="stat">得分<b id="pinS">0</b></div><div class="stat">用珠<b id="pinN">0</b></div><div class="stat">最高<b id="pinB">'+S.best+'</b></div>';
    const { cv, ctx } = makeCanvas(420,480);
    cv.className='pix-canvas'; mountEl.appendChild(cv);
    S.cv=cv; S.ctx=ctx;
    cv.addEventListener('pointerdown', e=>{
      const r=cv.getBoundingClientRect();
      pinDrop(S,Math.max(34,Math.min(386,(e.clientX-r.left)/r.width*420)));
    });
    stageOverlay(mountEl,'弹珠机','点击上方投珠，看珠子叮叮当当弹进槽里。两边的 ×5 是 JACKPOT！','开始',()=>{S.mount.querySelectorAll('.overlay').forEach(o=>o.remove()); sfx.point();});
    S.loop=()=>{ stepPin(S); S.raf=requestAnimationFrame(S.loop); };
    S.raf=requestAnimationFrame(S.loop);
  },
  onKey(e){ return e.key.startsWith('Arrow'); },
  destroy(){ if(pinG){ cancelAnimationFrame(pinG.raf); pinG=null; } }
};
function pinDrop(S,x){
  if(S.balls.length>=3) return;
  S.balls.push({x,y:52,vx:(Math.random()-.5)*1.6,vy:1.5});
  S.used++; $('#pinN').textContent=S.used; sfx.click();
}
function pinHud(S){ $('#pinS').textContent=S.score; $('#pinB').textContent=S.best; }
function pinTone(S){
  if(S.cd>0) return;
  S.cd=4; tone(360+Math.random()*260,0.03,'square',0.025);
}
function stepPin(S){
  S.frames++;
  if(S.cd>0) S.cd--;
  if(S.shake>0) S.shake--;
  for(let i=S.balls.length-1;i>=0;i--){
    const b=S.balls[i];
    b.vy+=0.16; b.x+=b.vx; b.y+=b.vy;
    if(b.x<10){ b.x=10; b.vx=Math.abs(b.vx)*0.7; pinTone(S); }
    if(b.x>410){ b.x=410; b.vx=-Math.abs(b.vx)*0.7; pinTone(S); }
    if(b.y<PIN_TOP+10){ b.y=PIN_TOP+10; b.vy=Math.abs(b.vy)*0.5; }
    for(const p of S.pegs){
      const dx=b.x-p.x, dy=b.y-p.y, d=Math.hypot(dx,dy)||1;
      if(d<14){
        b.x=p.x+dx/d*14; b.y=p.y+dy/d*14;
        const nx=dx/d, ny=dy/d, dot=b.vx*nx+b.vy*ny;
        if(dot<0){ b.vx-=1.9*dot*nx; b.vy-=1.9*dot*ny; }
        b.vx+=(Math.random()-.5)*0.5;
        if(p.b<=0){ p.b=8; pinTone(S); }
      }
    }
    if(b.y>360){
      for(let f=1;f<7;f++){
        const fx=f*60;
        if(Math.abs(b.x-fx)<8 && b.y>366){
          b.x=b.x<fx?fx-8:fx+8;
          b.vx=(b.x<fx?-1:1)*Math.abs(b.vx)*0.8;
        }
      }
    }
    if(b.y>=PIN_FLOOR-6){
      const slot=Math.max(0,Math.min(6,Math.floor(b.x/60)));
      const gain=PIN_MULT[slot]*10;
      S.score+=gain;
      if(S.score>S.best){ S.best=S.score; store.set('pin.best',S.best); }
      S.glow.set(slot,30);
      S.texts.push({x:slot*60+30,y:PIN_FLOOR-16,t:30,txt:'+'+gain});
      if(PIN_MULT[slot]>=5){
        S.shake=10; sfx.win();
        S.texts.push({x:210,y:200,t:60,txt:'JACKPOT ×5!'});
        tone(523,0.09,'square',0.06); setTimeout(()=>tone(659,0.09,'square',0.06),90); setTimeout(()=>tone(784,0.16,'square',0.06),180);
      } else tone(300+PIN_MULT[slot]*120,0.08,'square',0.05);
      S.balls.splice(i,1);
      pinHud(S);
    }
  }
  S.glow.forEach((v,k)=>{ if(v<=1) S.glow.delete(k); else S.glow.set(k,v-1); });
  drawPin(S);
}
function drawPin(S){
  const {ctx}=S;
  ctx.fillStyle='rgba(16,6,22,0.30)'; ctx.fillRect(0,0,420,480);
  ctx.save();
  if(S.shake>0) ctx.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake);
  ctx.fillStyle='#241536'; ctx.fillRect(0,0,420,PIN_TOP);
  ctx.fillStyle='#241536'; ctx.fillRect(0,0,6,480); ctx.fillRect(414,0,6,480);
  ctx.fillStyle='#4a2a5e'; ctx.fillRect(0,PIN_TOP-4,420,4);
  for(let p of S.pegs){
    if(p.b>0) p.b--;
    ctx.fillStyle=p.b>0?'#eef0ff':'#7a6fa8';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.b>0?5:4,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='#5b4a7e';
  for(let f=1;f<7;f++) ctx.fillRect(f*60-4,366,8,PIN_FLOOR-366);
  ctx.fillStyle='#171025'; ctx.fillRect(0,PIN_FLOOR,420,40);
  ctx.font='13px DotGothic16,monospace'; ctx.textAlign='center';
  for(let i=0;i<7;i++){
    const lit=S.glow.has(i);
    ctx.fillStyle=lit?'#3ddc84':(PIN_MULT[i]>=5?'#5a2038':(PIN_MULT[i]>=2?'#33244d':'#221838'));
    ctx.fillRect(i*60+4,PIN_FLOOR+2,52,26);
    ctx.fillStyle=lit?'#0b0c18':'rgba(238,240,255,.65)';
    ctx.fillText('×'+PIN_MULT[i],i*60+30,PIN_FLOOR+20);
  }
  for(const b of S.balls){
    ctx.fillStyle='#ffb74d'; ctx.beginPath(); ctx.arc(b.x,b.y,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffffff'; ctx.fillRect(b.x-2,b.y-2,2,2);
  }
  ctx.fillStyle='#ffe95c';
  for(const t of S.texts){ t.y-=0.7; t.t--; ctx.globalAlpha=Math.min(1,t.t/10); ctx.fillText(t.txt,t.x,t.y); }
  ctx.globalAlpha=1; ctx.textAlign='left';
  S.texts=S.texts.filter(t=>t.t>0);
  ctx.restore();
  if(S.used===0&&!S.balls.length){
    ctx.fillStyle='rgba(154,160,216,.8)'; ctx.font='12px DotGothic16,monospace'; ctx.textAlign='center';
    ctx.fillText('点击上面空白处投珠 →',210,120); ctx.textAlign='left';
  }
}

    };

function renderDoodle(D){
  const { ctx, cv, size, scale, pixels } = D;
  ctx.fillStyle = '#101120';
  ctx.fillRect(0, 0, cv.width, cv.height);
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    const c = pixels[y][x];
    if(c){ ctx.fillStyle = c; ctx.fillRect(x*scale, y*scale, scale, scale); }
  }
  ctx.strokeStyle = 'rgba(255,255,255,.06)';
  ctx.lineWidth = 1;
  for(let i=0;i<=size;i++){
    ctx.beginPath(); ctx.moveTo(i*scale + .5, 0); ctx.lineTo(i*scale + .5, cv.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*scale + .5); ctx.lineTo(cv.width, i*scale + .5); ctx.stroke();
  }
}
function paintDoodle(D, p){
  if(!p || p.x<0 || p.y<0 || p.x>=D.size || p.y>=D.size) return;
  D.pixels[p.y][p.x] = D.color;
  renderDoodle(D);
}
function clearDoodle(D){
  D.pixels = D.pixels.map(r => r.map(() => null));

    sfx.point();

}

  });

function stepBounce(B){
  const w = B.box.clientWidth, h = B.box.clientHeight;
  for(let i=B.balls.length-1;i>=0;i--){
    const b = B.balls[i];
    b.vy += b.g;
    b.x += b.vx; b.y += b.vy;
    if(b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx) * b.damp; }
    if(b.x + b.r > w){ b.x = w - b.r; b.vx = -Math.abs(b.vx) * b.damp; }
    if(b.y < b.r){ b.y = b.r; b.vy = Math.abs(b.vy) * b.damp; }
    if(b.y + b.r > h){ b.y = h - b.r; b.vy = -Math.abs(b.vy) * b.damp; }
    if(Math.abs(b.vx) < .08 && Math.abs(b.vy) < .08 && b.y + b.r >= h - .5){ b.vx = 0; b.vy = 0; }
    b.el.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px)';
  }
}

function slimeRowsFor(state){
  const rows = SLIME_ROWS.slice();
  if(state === 'blink' || state === 'sad'){
    rows[5] = EYE_CLOSED;
    rows[6] = EYE_CLOSED;
  }
  if(state === 'sad') rows[8] = MOUTH_SAD;
  if(state === 'happy') rows[8] = MOUTH_HAPPY;
  if(state === 'eat'){
    rows[8] = MOUTH_HAPPY;
    rows[9] = MOUTH_HAPPY;
  }
  return rows;
}
function slimeState(P, t){
  if(P.eatUntil && t < P.eatUntil) return 'eat';
  if(P.blinkUntil && t < P.blinkUntil) return 'blink';
  if(t - P.lastBlink > 3200 + Math.random()*1200){ P.lastBlink = t; P.blinkUntil = t + 190; return 'blink'; }
  if(P.hunger < 25) return 'sad';
  if(P.happyUntil && t < P.happyUntil) return 'happy';
  return 'idle';
}
function petFrame(P, t){
  const ctx = P.ctx;
  if(!ctx) return;
  const W = P.canvas.width, H = P.canvas.height;
  ctx.clearRect(0, 0, W, H);
  // 地面阴影
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(W/2 - 46, 140, 92, 10);
  // 呼吸晃动
  const wob = P.reduced ? 1 : 1 + 0.03 * Math.sin(t/260);
  ctx.save();
  ctx.translate(W/2, 42);
  ctx.scale(wob, 1);
  ctx.translate(-W/2, -42);
  const state = slimeState(P, t);
  const rows = slimeRowsFor(state);
  const scale = 8, ox = (W - 16*scale)/2, oy = 34;
  for(let y=0;y<rows.length;y++){
    for(let x=0;x<16;x++){
      const ch = rows[y][x];
      if(ch === '.') continue;
      ctx.fillStyle = SLIME_COLORS[ch] || '#3ddc84';
      ctx.fillRect(ox + x*scale, oy + y*scale, scale, scale);
    }
  }
  ctx.restore();
  // 状态与数值（每 15 帧刷新一次）
  P.frameN++;
  if(P.frameN % 15 === 0){
    P.hunger = Math.max(0, P.hunger - 1);
    P.mood = Math.max(0, P.mood - 1);
    updatePetUI(P);
  }
}
function updatePetUI(P){
  const h = $('#petHunger'), m = $('#petMood');
  if(h) h.style.width = P.hunger + '%';
  if(m) m.style.width = P.mood + '%';
  if(!P.status) return;
  if(P.hunger >= 100) P.status.textContent = '吃撑了，动不了';
  else if(P.hunger <= 20) P.status.textContent = '好饿……求投喂';
  else if(P.mood >= 75) P.status.textContent = '开心得冒泡泡';
  else if(P.mood <= 20) P.status.textContent = '有点低落，摸摸我';
  else P.status.textContent = '状态不错';
}
function feedPet(){
  const P = pet; if(!P) return;
  if(P.hunger >= 100){ P.status.textContent = '吃撑了！再喂要吐了'; sfx.bonk(); return; }
  P.hunger = Math.min(100, P.hunger + 25);
  P.mood = Math.min(100, P.mood + 5);
  P.eatUntil = performance.now() + 1400;
  sfx.eat();
  updatePetUI(P);
}
function patPet(P, stage){
  if(!P) return;
  P.mood = Math.min(100, P.mood + 15);
  P.happyUntil = performance.now() + 1600;
  sfx.point();
  spawnHearts(stage);
  updatePetUI(P);
}
function spawnHearts(stage){

    const h = document.createElement('div');

const PIANO_KEYS = [
  ['C4', 261.63], ['D4', 293.66], ['E4', 329.63], ['F4', 349.23],
  ['G4', 392.00], ['A4', 440.00], ['B4', 493.88], ['C5', 523.25]

  title:'像素钢琴',

  if(el) el.textContent = name;

let fireworks = null;
TOYS.fireworks = {
  title:'像素烟花',
  mount(mountEl, statsEl){
    mountEl.classList.add('stage');
    const F = fireworks = { rockets:[], parts:[], raf:0, n:0, auto:false };
    statsEl.innerHTML =
      '<div class="stat">绽放<b id="fwCount">0</b></div>' +
      '<button class="px-btn purple" id="fwAuto" type="button">自动 开</button>' +
      '<button class="px-btn ghost" id="fwClear" type="button">清空</button>';
    const { cv, ctx } = makeCanvas(480, 320);
    cv.className = 'pix-canvas';
    mountEl.appendChild(cv);
    F.cv = cv; F.ctx = ctx;
    cv.addEventListener('click', e => {
      const r = cv.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width * 480;
      const y = (e.clientY - r.top) / r.height * 320;
      launchRocket(F, x, y);
    });
    $('#fwAuto').addEventListener('click', () => { F.auto = !F.auto; $('#fwAuto').textContent = F.auto ? '自动 关' : '自动 开'; sfx.click(); });
    $('#fwClear').addEventListener('click', () => { F.rockets = []; F.parts = []; sfx.click(); });
    let last = 0;
    F.loop = t => {
      stepFireworks(F);
      if(F.auto && t - last > 900){ last = t; launchRocket(F, 60 + Math.random()*360, 70 + Math.random()*160); }
      F.raf = requestAnimationFrame(F.loop);
    };
    F.raf = requestAnimationFrame(F.loop);
  },
  destroy(){
    if(fireworks){ cancelAnimationFrame(fireworks.raf); fireworks = null; }
  }
};
function launchRocket(F, x, y){
  F.rockets.push({ x:240, y:320, vx:(x-240)/55, vy:-((320-y)/55), targetY:y });
}
function burstFireworks(F, x, y){
  const cols = ['#ff3d5a','#ffc53d','#3ddc84','#4da6ff','#b18cff','#ff8ac2'];
  const col = cols[Math.floor(Math.random()*cols.length)];
  const n = 38 + Math.floor(Math.random()*20);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 1 + Math.random()*2.4;
    F.parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, col, size:2 + (Math.random()<.4?2:0) });
  }
  F.n++;
  $('#fwCount').textContent = F.n;
  sfx.pop();
}
function stepFireworks(F){
  const { ctx, cv } = F;
  ctx.fillStyle = 'rgba(12,13,26,.24)';
  ctx.fillRect(0, 0, 480, 320);
  for(let i=F.rockets.length-1;i>=0;i--){
    const r = F.rockets[i];
    r.x += r.vx; r.y += r.vy;
    ctx.fillStyle = '#ffc53d';
    ctx.fillRect(r.x - 1, r.y - 1, 3, 6);
    if(r.y <= r.targetY || r.y <= 28){ burstFireworks(F, r.x, r.y); F.rockets.splice(i, 1); }
  }
  for(let i=F.parts.length-1;i>=0;i--){
    const p = F.parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.vx *= 0.985; p.vy *= 0.985; p.life -= 0.012;
    if(p.life <= 0){ F.parts.splice(i, 1); continue; }
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

      F.fish.push({ x:40 + Math.random()*400, y:60 + Math.random()*190, vx:(Math.random()<.5?-1:1)*(0.6+Math.random()*0.8), size:8 + Math.random()*6, col:colors[i], startled:0 });
    }

      F.bubbles.push({ x, y, vy:-1, life:1 });
      F.fish.forEach(f => { f.vx = Math.sign(f.x - x || 1) * (Math.abs(f.vx) + 2.4); f.startled = 30; });
      sfx.pop();
    });
    $('#ftFeed').addEventListener('click', () => {
      F.bubbles.push({ x:60 + Math.random()*360, y:290, vy:-1, life:1 });

      sfx.eat();
    });
    $('#ftStartle').addEventListener('click', () => {
      F.fish.forEach(f => { f.vx = -f.vx + (Math.random()<.5?-1.5:1.5); f.startled = 40; });
      sfx.bonk();
    });
    F.loop = () => { stepFish(F); F.raf = requestAnimationFrame(F.loop); };
    F.raf = requestAnimationFrame(F.loop);

  }
};
function stepFish(F){
  const { ctx, cv } = F;
  ctx.fillStyle = '#10182e';
  ctx.fillRect(0, 0, 480, 300);
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.fillRect(0, 270, 480, 30);
  for(let i=F.bubbles.length-1;i>=0;i--){
    const b = F.bubbles[i];
    b.y += b.vy; b.life -= 0.02;
    ctx.fillStyle = 'rgba(180,200,255,' + Math.max(0, b.life) + ')';
    ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
    if(b.life <= 0 || b.y < 0) F.bubbles.splice(i, 1);
  }
  for(const f of F.fish){
    f.x += f.vx;
    if(f.x < 12){ f.x = 12; f.vx = Math.abs(f.vx); }
    if(f.x > 480 - 12){ f.x = 480 - 12; f.vx = -Math.abs(f.vx); }
    if(f.startled > 0) f.startled--;
    const dir = f.vx > 0 ? 1 : -1;
    ctx.fillStyle = f.col;
    ctx.fillRect(f.x - f.size, f.y - f.size/2, f.size*2, f.size);
    ctx.fillRect(f.x - dir*f.size, f.y - f.size/2 - 2, 3, f.size + 4);
    ctx.fillStyle = '#0b0c18';
    ctx.fillRect(f.x + dir*f.size*0.6, f.y - 2, 2, 2);
  }
}

    }
    $('#sgCount').textContent = S.flakes.length;

function shakeSnow(S){
  S.shaking = 40;
  S.flakes.forEach(f => { f.vx = (Math.random()-.5)*3; f.vy = 1 + Math.random()*2; });
  sfx.pop();
}
function stepSnow(S){
  const { ctx, cv } = S;
  ctx.fillStyle = '#171826';
  ctx.fillRect(0, 0, 320, 320);
  ctx.fillStyle = '#20304a';
  ctx.beginPath(); ctx.arc(160, 150, 138, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#0b0c18'; ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = '#2c2d5c';
  ctx.fillRect(112, 282, 96, 34);
  if(S.shaking > 0) S.shaking--;
  for(const f of S.flakes){
    f.x += f.vx; f.y += f.vy;
    const dx = f.x - 160, dy = f.y - 150;
    if(dx*dx + dy*dy > (130 - f.size) * (130 - f.size)){
      if(f.x < 160) f.x += (160 - f.x) * 0.02; else f.x -= (f.x - 160) * 0.02;
      if(f.y < 150) f.y += (150 - f.y) * 0.02; else f.y -= (f.y - 150) * 0.02;
    }
    if(f.y > 295){ f.y = 150; f.x = 100 + Math.random()*120; f.vy = 0.4 + Math.random()*0.8; }
    ctx.fillStyle = '#eef0ff';
    ctx.fillRect(f.x - f.size/2, f.y - f.size/2, f.size, f.size);
  }
}

function pourSand(S,p){
  if(S.grains.length>2000) return;
  for(let i=0;i<8;i++){ S.grains.push({x:p.x+(Math.random()-.5)*6, y:p.y, col:S.color}); }
  $('#sdC').textContent=Math.min(2000,S.grains.length);
}
function stepSand(S){
  const {ctx,cv}=S;
  ctx.fillStyle='#1a1b30'; ctx.fillRect(0,0,360,320);
  const cell=3, gx=Math.floor(360/cell), gy=Math.floor(320/cell);
  const occ=Array.from({length:gy},()=>Array(gx).fill(false));
  for(const g of S.grains){
    let xx=Math.max(0,Math.min(gx-1,Math.floor(g.x/cell)));
    let yy=Math.max(0,Math.min(gy-1,Math.floor(g.y/cell)));
    while(yy+1<gy && !occ[yy+1][xx]){ yy++; }
    if(yy+1<gy){
      if(xx>0 && !occ[yy+1][xx-1] && !occ[yy][xx-1]){ occ[yy+1][xx-1]=true; ctx.fillStyle=g.col; ctx.fillRect((xx-1)*cell,(yy+1)*cell,cell,cell); }
      else if(xx<gx-1 && !occ[yy+1][xx+1] && !occ[yy][xx+1]){ occ[yy+1][xx+1]=true; ctx.fillStyle=g.col; ctx.fillRect((xx+1)*cell,(yy+1)*cell,cell,cell); }
      else { occ[yy][xx]=true; ctx.fillStyle=g.col; ctx.fillRect(xx*cell,yy*cell,cell,cell); }
    } else { occ[yy][xx]=true; ctx.fillStyle=g.col; ctx.fillRect(xx*cell,yy*cell,cell,cell); }
  }
}

  destroy(){ if(kaleidoT){ cancelAnimationFrame(kaleidoT.raf); kaleidoT=null; } }
};
function kaleidoSeed(K,reseed){
  K.speckles=[];
  const n=7+Math.floor(Math.random()*4);
  for(let i=0;i<n;i++){
    K.speckles.push({
      a:Math.random()*Math.PI*2,
      r:25+Math.random()*130,
      spd:(Math.random()<0.5?-1:1)*(0.2+Math.random()*0.5),
      sz:3+Math.random()*5,
      col:Math.floor(Math.random()*K.PAL[K.palette].length)
    });
  }
  if(reseed){
    K.palette=(K.palette+1)%K.PAL.length;
    $('#kalP').textContent=['霓虹','糖果','神秘'][K.palette];
    sfx.pop();
  }
  K.ctx.fillStyle='#0e0f1d'; K.ctx.fillRect(0,0,480,360);
}
function stepKaleido(K){
  K.frames++; K.rot+=0.0012;
  const {ctx}=K;
  ctx.fillStyle='rgba(14,15,29,0.055)'; ctx.fillRect(0,0,480,360);
  ctx.save(); ctx.translate(240,180); ctx.rotate(K.rot);
  const cols=K.PAL[K.palette];
  for(let s=0;s<K.spokes;s++){
    ctx.save(); ctx.rotate(s*Math.PI*2/K.spokes);
    for(const sp of K.speckles){
      sp.a+=sp.spd*0.014;
      const rr=Math.sin(K.frames/210+sp.r)*0.15+1;
      const rad=sp.r*rr;
      for(const m of [sp.a,-sp.a]){
        const x=Math.cos(m)*rad, y=Math.sin(m)*rad;
        ctx.fillStyle=cols[sp.col];
        ctx.fillRect(x-sp.sz/2,y-sp.sz/2,sp.sz,sp.sz);
        ctx.fillStyle='rgba(238,240,255,.35)';
        ctx.fillRect(x-sp.sz/2,y-sp.sz/2,sp.sz/2,sp.sz/2);
      }
    }
    ctx.restore();
  }
  ctx.restore();
}

};
function stepSlime(SL){
  SL.frames++;
  const tgt = SL.mouse.live? SL.mouse : {x:240+Math.sin(SL.frames/90)*60, y:160+Math.sin(SL.frames/63)*36};
  if(SL.blink>0) SL.blink--;
  if(SL.frames>SL.blinkAt){ SL.blink=6; SL.blinkAt=SL.frames+140+Math.random()*180; }
  for(const p of SL.pts){
    p.vx*=SL.d; p.vy*=SL.d;
    p.vy+=0.28;
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<16){ p.x=16; p.vx=Math.abs(p.vx)*0.6; } if(p.x>464){ p.x=464; p.vx=-Math.abs(p.vx)*0.6; }
    if(p.y<16){ p.y=16; p.vy=Math.abs(p.vy)*0.5; } if(p.y>304){ p.y=304; p.vy=-Math.abs(p.vy)*0.5; }
  }
  const N=SL.pts.length, cx=tgt.x, cy=tgt.y;
  for(let i=0;i<N;i++){
    const p=SL.pts[i];
    const ringA=i/N*Math.PI*2;
    const tx=cx+Math.cos(ringA)*62, ty=cy+Math.sin(ringA)*54;
    p.vx+=(tx-p.x)*SL.k; p.vy+=(ty-p.y)*SL.k*0.85;
    const nb=SL.pts[(i+1)%N], pb=SL.pts[(i-1+N)%N];
    for(const q of [nb,pb]){
      const dx=q.x-p.x, dy=q.y-p.y, dist=Math.hypot(dx,dy)||1;
      const rest=52;
      const f=(dist-rest)/dist*0.06;
      p.vx+=dx*f; p.vy+=dy*f; q.vx-=dx*f; q.vy-=dy*f;
    }
  }
  drawSlime(SL);
}
function drawSlime(SL){
  const {ctx}=SL;
  ctx.fillStyle='#0e0f1d'; ctx.fillRect(0,0,480,320);
  ctx.fillStyle='#23244a';
  ctx.beginPath(); ctx.ellipse(240,286,130,10,0,0,Math.PI*2); ctx.fill();
  const ps=SL.pts;
  ctx.beginPath();
  const mx=(a,b)=>(a.x+b.x)/2, my=(a,b)=>(a.y+b.y)/2;
  ctx.moveTo(mx(ps[N0()],ps[next(0)]), my(ps[N0()],ps[next(0)]));
  for(let i=0;i<ps.length;i++){
    const cur=ps[i], nx=ps[next(i)];
    ctx.quadraticCurveTo(cur.x,cur.y,mx(cur,nx),my(cur,nx));
  }
  ctx.closePath();
  ctx.fillStyle='#3ddc84'; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle='#0b0c18'; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.3)';
  ctx.beginPath(); ctx.ellipse(210,120,26,14,-0.5,0,Math.PI*2); ctx.fill();
  const c={x:0,y:0};
  for(const p of ps){ c.x+=p.x/ps.length; c.y+=p.y/ps.length; }
  const blink=SL.blink>0;
  ctx.fillStyle='#0b0c18';
  ctx.fillRect(c.x-26,c.y-6,9,blink?2:12);
  ctx.fillRect(c.x+17,c.y-6,9,blink?2:12);
  const sq=SL.frames%14<7?0:2;
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.fillRect(208+sq,130,4,4);
}
function N0(){ return 0; }
function next(i){ return (i+1)%18; }

const WAV_LAYERS=[[180,'#2b4f8a',9,1.1],[214,'#3a6ea8',12,0.8],[248,'#2b3f74',15,0.6],[282,'#20304a',18,0.42]];
function stepWaves(W){
  W.frames++;
  const {ctx}=W;
  const grad=ctx.createLinearGradient(0,0,0,320);
  grad.addColorStop(0,'#0b1030'); grad.addColorStop(1,'#14203e');
  ctx.fillStyle=grad; ctx.fillRect(0,0,480,320);
  for(const st of W.stars){
    ctx.fillStyle='rgba(230,235,255,'+(0.3+0.5*Math.abs(Math.sin(W.frames/50+st.tw)))+')';
    ctx.fillRect(st.x,st.y,st.s,st.s);
  }
  ctx.fillStyle='#ffe95c'; ctx.beginPath(); ctx.arc(390,64,26,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#14203e'; ctx.beginPath(); ctx.arc(381,58,22,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,233,92,.25)'; ctx.beginPath(); ctx.arc(390,64,34,0,Math.PI*2); ctx.fill();
  const t=W.frames;
  for(const [base,col,amp,spd] of WAV_LAYERS){
    ctx.beginPath(); ctx.moveTo(0,320);
    for(let x=0;x<=480;x+=8){
      const y=base + Math.sin(x*0.022 + t*0.02*spd + W.tilt*(1.2-spd)*2)*amp * Math.cos(x*0.004 + W.tilt*0.8);
      ctx.lineTo(x,y);
    }
    ctx.lineTo(480,320); ctx.closePath();
    ctx.fillStyle=col; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=2;
    ctx.beginPath();
    for(let x=0;x<=480;x+=8){
      const y=base + Math.sin(x*0.022 + t*0.02*spd + W.tilt*(1.2-spd)*2)*amp*Math.cos(x*0.004 + W.tilt*0.8);
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  for(let i=W.ripples.length-1;i>=0;i--){
    const r=W.ripples[i];
    r.r+=0.9; r.a-=0.012;
    if(r.a<=0){ W.ripples.splice(i,1); continue; }
    ctx.strokeStyle='rgba(180,210,255,'+r.a+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(r.x,r.y,r.r,r.r*0.34,0,0,Math.PI*2); ctx.stroke();
  }
}

const TREE_SEASONS=[
  ['#ff8ac2','#ffb3cf','#eef0ff'],
  ['#3ddc84','#2fa86b','#5eead4'],
  ['#ffc53d','#ff9f43','#ff8ac2'],
  ['#b18cff','#4da6ff','#eef0ff']

function treeGrow(T){
  T.mount.querySelectorAll('.overlay').forEach(o=>o.remove());
  T.segs=[]; T.growTo=0; T.leaves=[]; T.drops=[];
  T.season=Math.floor(Math.random()*4);
  $('#treL').textContent=['春樱','夏荫','秋实','冬梦'][T.season];
  $('#treC').textContent=++T.trees;
  T.count++;
  const cols=TREE_SEASONS[T.season];
  const build=(x,y,ang,len,depth)=>{
    const nx=x+Math.cos(ang)*len, ny=y+Math.sin(ang)*len;
    T.segs.push({x1:x,y1:y,x2:nx,y2:ny,d:depth});
    if(depth>=9||len<7){ T.leaves.push({x:nx,y:ny,col:cols[Math.floor(Math.random()*3)],s:2+Math.random()*3}); return; }
    const n=2+(Math.random()<0.25?1:0);
    for(let i=0;i<n;i++){
      const spread=0.38+Math.random()*0.45;
      const na=ang+(n===2?(i===0?spread:-spread):[-spread,0,spread][i]);
      build(nx,ny,na+(Math.random()-0.5)*0.18,len*(0.68+Math.random()*0.14),depth+1);
    }
  };
  build(240,345,-Math.PI/2+(Math.random()-0.5)*0.2,64+Math.random()*26,0);
  T.maxDepth=Math.max.apply(null,T.segs.map(s=>s.d));
  sfx.pop();
}
function stepTree(T){
  T.frames++;
  if(T.growTo<T.maxDepth){ T.growTo=Math.min(T.maxDepth,T.growTo+0.08); }
  if(T.growTo>=T.maxDepth&&T.frames%5===0&&T.leaves.length){
    const l=T.leaves[Math.floor(Math.random()*T.leaves.length)];
    T.drops.push({x:l.x,y:l.y,vy:0.4+Math.random()*0.6,sw:Math.random()*6,col:l.col,s:l.s});
    if(T.drops.length>90) T.drops.shift();
  }
  const {ctx}=T;
  ctx.fillStyle='#12132a'; ctx.fillRect(0,0,480,360);
  ctx.fillStyle='#1c1e3a'; ctx.fillRect(0,340,480,20);
  for(let d=0;d<=Math.floor(T.growTo);d++){
    const dd=d;
    for(const s of T.segs){
      if(s.d!==dd) continue;
      ctx.strokeStyle='#8a5a33';
      ctx.lineWidth=Math.max(1.4,5.2-dd*0.5);
      ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
    }
  }
  if(T.growTo>=T.maxDepth){
    for(const l of T.leaves){
      ctx.fillStyle=l.col;
      ctx.fillRect(l.x-l.s/2,l.y-l.s/2,l.s,l.s);
    }
  }
  for(let i=T.drops.length-1;i>=0;i--){
    const d=T.drops[i];
    d.y+=d.vy; d.x+=Math.sin(T.frames/22+d.sw)*0.5;
    if(d.y>356){ T.drops.splice(i,1); continue; }
    ctx.fillStyle=d.col;
    ctx.fillRect(d.x,d.y,d.s,d.s);
  }
}

function stepBreath(B,now){
  const {ctx}=B;
  let t=now-B.t0;
  const total=B.PHASES.reduce((s,p)=>s+p.d,0);
  const cyc=Math.floor(t/total);
  if(cyc>B.cycle){ B.cycle=cyc; $('#brtC').textContent=cyc+1; sfx.point(); }
  let tt=t%total, ph=B.PHASES[0], acc=0;
  acc=0; for(const p of B.PHASES){ if(tt<acc+p.d){ ph=p; break; } acc+=p.d; }
  const pt=tt-acc-0, prog=Math.min(1,Math.max(0,pt/ph.d));
  let scale;
  if(ph.mode==='in'){ scale=0.4+0.6*Math.sin(prog*Math.PI/2); }
  else if(ph.mode==='hold'){ scale=1+Math.sin(now/300)*0.03; }
  else { scale=1-0.6*Math.sin(prog*Math.PI/2); }
  scale=Math.max(0.35,Math.min(1.05,scale));
  ctx.fillStyle='#0e0f1d'; ctx.fillRect(0,0,480,320);
  ctx.fillStyle=ph.col+'26';
  ctx.beginPath(); ctx.arc(240,160,86*scale+26,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=ph.col;
  ctx.globalAlpha=0.32;
  ctx.beginPath(); ctx.arc(240,160,86*scale,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=0.85;
  ctx.beginPath(); ctx.arc(240,160,64*scale,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle='#eef0ff';
  ctx.font='20px "Press Start 2P",DotGothic16,monospace'; ctx.textAlign='center';
  ctx.fillText(ph.name,240,154);
  ctx.font='13px DotGothic16,monospace';
  ctx.fillText(Math.ceil((ph.d-pt)/1000)+' 秒',240,182);
  ctx.fillStyle='#9aa0d8';
  ctx.fillText(ph.mode==='in'?'用鼻子慢慢吸~~':ph.mode==='hold'?'轻轻停住不要动':'用嘴巴慢慢呼出~',240,262);
  ctx.textAlign='left';
}

    cv.addEventListener('pointerup', end);

function stepGlow(G){
  G.frames++;
  const {ctx}=G;
  ctx.fillStyle='rgba(10,11,22,0.16)'; ctx.fillRect(0,0,480,320);
  const drawStroke=(st,glow)=>{
    const pts=st.pts;
    if(pts.length<2) return;
    const alpha=st.done?Math.max(0,1-st.age*0.02):1;
    if(alpha<=0) return;
    ctx.lineCap='round';
    if(glow){ ctx.strokeStyle='hsla('+st.hue+',95%,60%,'+(alpha*0.22)+')'; ctx.lineWidth=9; }
    else { ctx.strokeStyle='hsla('+st.hue+',95%,'+(58+Math.sin(G.frames/9)*6)+'%,'+alpha+')'; ctx.lineWidth=2.5; }
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
    ctx.stroke();
  };
  for(const st of G.strokes){
    if(st.done) st.age=(st.age||0)+1;
  }
  G.strokes=G.strokes.filter(st=>!st.done||(st.age||0)<70);
  for(const st of G.strokes) drawStroke(st,true);
  if(G.cur) drawStroke(G.cur,true);
  for(const st of G.strokes) drawStroke(st,false);
  if(G.cur) drawStroke(G.cur,false);
}

  ctx.fillStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(228,200-d,14,0,Math.PI*2); ctx.fill();

  ctx.fillStyle='#9aa0d8'; ctx.font='12px DotGothic16,monospace';

  if(S.toastT>0){
    ctx.font='13px DotGothic16,monospace';
    const w=ctx.measureText(S.toast).width+26;
    ctx.fillStyle='rgba(11,12,24,.8)'; ctx.fillRect(240-w/2,48,w,24);
    ctx.fillStyle='#ffe95c'; ctx.fillText(S.toast,240,64);
  }

/* ---------------- 指尖陀螺 ---------------- */
let spdT = null;
TOYS.spd = {
  title:'指尖陀螺',
  mount(mountEl, statsEl){
    mountEl.classList.add('stage');
    const S = spdT = { raf:0, frames:0, ang:0.6, vel:0, down:false, lastA:null, smooth:0, trail:[], sparks:[], hue:190, cd:0, band:-1, spinAt:0, spin:0, best:+(store.get('spd.best',0)) };
    statsEl.innerHTML='<div class="stat">转速<b id="spdR">0</b></div><div class="stat">最久<b id="spdB">'+S.best.toFixed(1)+'s</b></div>';
    const { cv, ctx } = makeCanvas(480,320);
    cv.className='pix-canvas'; mountEl.appendChild(cv);
    S.cv=cv; S.ctx=ctx;
    const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*480,y:(e.clientY-r.top)/r.height*320}; };
    cv.addEventListener('pointerdown', e=>{ S.down=true; S.lastA=null; spdDrag(S,pos(e)); });
    cv.addEventListener('pointermove', e=>{ if(S.down) spdDrag(S,pos(e)); });
    const up=()=>{ S.down=false; };
    cv.addEventListener('pointerup',up); cv.addEventListener('pointerleave',up);
    S.loop=()=>{ stepSpin(S); S.raf=requestAnimationFrame(S.loop); };
    S.raf=requestAnimationFrame(S.loop);
  },
  destroy(){ if(spdT){ cancelAnimationFrame(spdT.raf); spdT=null; } }
};
function spdDrag(S,p){
  const dx=p.x-240, dy=p.y-150, d=Math.hypot(dx,dy);
  const a=Math.atan2(dy,dx);
  if(S.lastA===null){ S.lastA=a; return; }
  if(d>30&&d<150){
    let da=a-S.lastA;
    while(da>Math.PI) da-=Math.PI*2;
    while(da<-Math.PI) da+=Math.PI*2;
    S.smooth=S.smooth*0.65+da*0.35;
    S.ang+=da*0.9;
    S.vel=Math.max(-0.85,Math.min(0.85,S.smooth*0.9));
  }
  S.lastA=a;
}
function stepSpin(S){
  S.frames++;
  const rpm=Math.abs(S.vel)*573;
  if(!S.down){
    S.ang+=S.vel;
    if(Math.abs(S.vel)>0.003) S.vel*=0.994;
  }
  if(!S.down&&rpm>50){
    if(S.spin===0) S.spinAt=S.frames;
    S.spin=S.frames-S.spinAt;
  } else if(S.spin>0){
    const secs=+(S.spin/60).toFixed(1);
    if(secs>S.best){ S.best=secs; store.set('spd.best',S.best); $('#spdB').textContent=S.best.toFixed(1)+'s'; }
    S.spin=0;
  }
  S.hue=(S.hue+0.5+Math.abs(S.vel)*9)%360;
  S.trail.push({a:S.ang}); if(S.trail.length>14) S.trail.shift();
  if(Math.abs(S.vel)>0.4&&S.frames%3===0){
    const k=Math.floor(Math.random()*3), aa=S.ang+k*Math.PI*2/3;
    S.sparks.push({x:240+Math.cos(aa)*54,y:150+Math.sin(aa)*54,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,life:1});
  }
  for(let i=S.sparks.length-1;i>=0;i--){ const p=S.sparks[i]; p.x+=p.vx; p.y+=p.vy; p.life-=0.05; if(p.life<=0) S.sparks.splice(i,1); }
  if(S.cd>0) S.cd--;
  const band=Math.floor(rpm/240);
  if(band!==S.band&&S.cd<=0&&rpm>60){ tone(260+rpm*0.8,0.05,'triangle',0.03); S.cd=6; }
  S.band=band;
  $('#spdR').textContent=Math.round(rpm);
  drawSpin(S,rpm);
}
function drawSpin(S,rpm){
  const {ctx}=S, cx=240, cy=150;
  ctx.fillStyle='#0e0f1d'; ctx.fillRect(0,0,480,320);
  ctx.fillStyle='#181932'; ctx.beginPath(); ctx.ellipse(cx,cy+92,150,22,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#23244a'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.arc(cx,cy,104,Math.PI*0.72,Math.PI*2.28); ctx.stroke();
  if(rpm>2){
    ctx.strokeStyle='hsl('+S.hue+',90%,62%)';
    ctx.beginPath(); ctx.arc(cx,cy,104,Math.PI*0.72,Math.PI*0.72+Math.min(1,rpm/1300)*Math.PI*1.56); ctx.stroke();
  }
  const sp=Math.abs(S.vel)||0.001;
  if(sp>0.06){
    for(let i=0;i<S.trail.length;i++){
      ctx.globalAlpha=(i/S.trail.length)*Math.min(0.3,sp*0.4);
      ctx.fillStyle='hsl('+S.hue+',90%,65%)';
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(S.trail[i].a);
      for(let k=0;k<3;k++){
        ctx.save(); ctx.rotate(k*Math.PI*2/3); ctx.translate(54,0);
        ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }
  for(const p of S.sparks){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle='hsl('+S.hue+',95%,70%)'; ctx.fillRect(p.x-2,p.y-2,4,4); }
  ctx.globalAlpha=1;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(S.ang);
  for(let k=0;k<3;k++){
    ctx.save(); ctx.rotate(k*Math.PI*2/3); ctx.translate(54,0);
    ctx.fillStyle='#e6e9ff'; ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#0b0c18'; ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle='hsl('+S.hue+',85%,'+(42+Math.min(38,sp*130))+'%)';
    ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#0b0c18'; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle='#eef0ff'; ctx.beginPath(); ctx.arc(0,0,13,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#0b0c18'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='#9aa0d8'; ctx.fillRect(-2,-2,4,4);
  ctx.restore();
  ctx.textAlign='center';
  ctx.fillStyle=rpm>1?'#ffe95c':'#9aa0d8'; ctx.font='18px DotGothic16,monospace';
  ctx.fillText(Math.round(rpm)+' R/M',240,244);
  ctx.fillStyle='#9aa0d8'; ctx.font='12px DotGothic16,monospace';
  ctx.fillText(S.spin>0?'已转 '+(S.spin/60).toFixed(1)+' 秒，别让它停！':'按住拖动甩圈，把陀螺转起来',240,272);
  ctx.textAlign='left';
}

:"赠别·其二","a":"杜牧","p":["多情却似总无情，唯觉樽前笑不成。","蜡烛有心还惜别，替人垂泪到天明。"],"s":"赠别二首·其二"},{"c":"七言绝句","t":"金谷园","a":"杜牧","p":["繁华事散逐香尘，流水无情草自春。","日暮东风怨啼鸟，落花犹似坠楼人。"]},{"c":"七言绝句","t":"寄扬州韩绰判官","a":"杜牧","p":["青山隐隐水迢迢，秋尽江南草未凋。","二十四桥明月夜，玉人何处教吹箫？"]},{"c":"七言绝句","t":"遣怀","a":"杜牧","p":["落魄江南载酒行，楚腰纤细掌中轻。(江南 一作：江湖；纤细 一作：肠断)","十年一觉扬州梦，赢得青楼薄幸名。"]},{"c":"七言绝句","t":"秋夕","a":"杜牧","p":["银烛秋光冷画屏，轻罗小扇扑流萤。","天阶夜色凉如水，卧看牵牛织女星。"]},{"c":"七言绝句","t":"将赴吴兴登乐游原一绝","a":"杜牧","p":["清时有味是无能，闲爱孤云静爱僧。","欲把一麾江海去，乐游原上望昭陵。"]},{"c":"七言绝句","t":"赤壁","a":"杜牧","p":["折戟沉沙铁未销，自将磨洗认前朝。","东风不与周郎便，铜雀春深锁二乔。"]},{"c":"七言绝句","t":"泊秦淮","a":"杜牧","p":["烟笼寒水月笼沙，夜泊秦淮近酒家。","商女不知亡国恨，隔江犹唱后庭花。"]},{"c":"七言绝句","t":"征人怨","a":"柳中庸","p":["岁岁金河复玉关，朝朝马策与刀环。","三春白雪归青冢，万里黄河绕黑山。"],"s":"征人怨 / 征怨"},{"c":"七言绝句","t":"金陵图","a":"韦庄","p":["谁谓伤心画不成，画人心逐世人情。","君看六幅南朝事，老木寒云满故城。"]},{"c":"七言绝句","t":"滁州西涧","a":"韦应物","p":["独怜幽草涧边生，上有黄鹂深树鸣。","春潮带雨晚来急，野渡无人舟自横。"]},{"c":"七言绝句","t":"桃花溪","a":"张旭","p":["隐隐飞桥隔野烟，石矶西畔问渔船。","桃花尽日随流水，洞在清溪何处边。"]},{"c":"七言绝句","t":"寄人","a":"张泌","p":["别梦依依到谢家，小廊回合曲阑斜。","多情只有春庭月，犹为离人照落花。"]},{"c":"七言绝句","t":"题金陵渡","a":"张祜","p":["金陵津渡小山楼，一宿行人自可愁。","潮落夜江斜月里，两三星火是瓜州。"]},{"c":"七言绝句","t":"赠内人","a":"张祜","p":["禁门宫树月痕过，媚眼惟看宿鹭窠。","斜拔玉钗灯影畔，剔开红焰救飞蛾。"]},{"c":"七言绝句","t":"集灵台·其一","a":"张祜","p":["日光斜照集灵台，红树花迎晓露开。","昨夜上皇新授箓，太真含笑入帘来。"]},{"c":"七言绝句","t":"集灵台·其二","a":"张祜","p":["虢国夫人承主恩，平明骑马入宫门。","却嫌脂粉污颜色，淡扫蛾眉朝至尊。"]},{"c":"七言绝句","t":"枫桥夜泊","a":"张继","p":["月落乌啼霜满天，江枫渔火对愁眠。","姑苏城外寒山寺，夜半钟声到客船。"]},{"c":"七言绝句","t":"陇西行","a":"陈陶","p":["誓扫匈奴不顾身，五千貂锦丧胡尘。","可怜无定河边骨，犹是春闺梦里人！(春闺 一作：深闺)"],"s":"陇西行四首·其二"},{"c":"七言绝句","t":"杂诗","a":"佚名","p":["近寒食雨草萋萋，著麦苗风柳映堤。","等是有家归未得，杜鹃休向耳边啼。"]},{"c":"七言绝句","t":"回乡偶书·其一","a":"贺知章","p":["少小离家老大回，乡音无改鬓毛衰。","儿童相见不相识，笑问客从何处来。"],"s":"回乡偶书二首·其一"},{"c":"七言绝句","t":"瑶瑟怨","a":"温庭筠","p":["冰簟银床梦不成，碧天如水夜云轻。","雁声远过潇湘去，十二楼中月自明。"]},{"c":"七言绝句","t":"月夜","a":"刘方平","p":["更深月色半人家，北斗阑干南斗斜。","今夜偏知春气暖，虫声新透绿窗纱。"],"s":"月夜 / 夜月"},{"c":"七言绝句","t":"春怨","a":"刘方平","p":["纱窗日落渐黄昏，金屋无人见泪痕。","寂寞空庭春欲晚，梨花满地不开门。"]},{"c":"七言绝句","t":"乌衣巷","a":"刘禹锡","p":["朱雀桥边野草花，乌衣巷口夕阳斜。","旧时王谢堂前燕，飞入寻常百姓家。"]},{"c":"七言绝句","t":"春词","a":"刘禹锡","p":["新妆宜面下朱楼，深锁春光一院愁。","行到中庭数花朵，蜻蜓飞上玉搔头。"],"s":"和乐天春词"},{"c":"七言绝句","t":"马嵬坡","a":"郑畋","p":["玄宗回马杨妃死，云雨虽亡日月新。","终是圣明天子事，景阳宫井又何人。"]},{"c":"七言绝句","t":"寒食","a":"韩翃","p":["春城无处不飞花，寒食东风御柳斜。","日暮汉宫传蜡烛，轻烟散入五侯家。"]},{"c":"七言绝句","t":"已凉","a":"韩偓","p":["碧阑干外绣帘垂，猩血屏风画折枝。","八尺龙须方锦褥，已凉天气未寒时。"]},{"c":"七言绝句","t":"宫词","a":"顾况","p":["长乐宫连上苑春，玉楼金殿艳歌新。","君门一入无由出，唯有宫莺得见人。"]},{"c":"五言律诗","t":"送杜少府之任蜀州","a":"王勃","p":["城阙辅三秦，风烟望五津。","与君离别意，同是宦游人。","海内存知己，天涯若比邻。","无为在歧路，儿女共沾巾。"],"s":"送杜少府之任蜀州 / 送杜少府之任蜀川"},{"c":"五言律诗","t":"送梓州李使君","a":"王维","p":["万壑树参天，千山响杜鹃。","山中一夜雨，树杪百重泉。","汉女输橦布，巴人讼芋田。","文翁翻教授，不敢倚先贤。"]},{"c":"五言律诗","t":"汉江临眺","a":"王维","p":["楚塞三湘接，荆门九派通。","江流天地外，山色有无中。","郡邑浮前浦，波澜动远空。","襄阳好风日，留醉与山翁。"],"s":"汉江临泛 / 汉江临眺"},{"c":"五言律诗","t":"终南别业","a":"王维","p":["中岁颇好道，晚家南山陲。","兴来每独往，胜事空自知。","行到水穷处，坐看云起时。","偶然值林叟，谈笑无还期。"]},{"c":"五言律诗","t":"终南山","a":"王维","p":["太乙近天都，连山接海隅。","白云回望合，青霭入看无。","分野中峰变，阴晴众壑殊。","欲投人处宿，隔水问樵夫。"]},{"c":"五言律诗","t":"酬张少府","a":"王维","p":["晚年唯好静，万事不关心。自顾无长策，空知返旧林。","松风吹解带，山月照弹琴。君问穷通理，渔歌入浦深。"]},{"c":"五言律诗","t":"过香积寺","a":"王维","p":["不知香积寺，数里入云峰。","古木无人径，深山何处钟。","泉声咽危石，日色冷青松。","薄暮空潭曲，安禅制毒龙。"]},{"c":"五言律诗","t":"辋川闲居赠裴秀才迪","a":"王维","p":["寒山转苍翠，秋水日潺湲。","倚杖柴门外，临风听暮蝉。","渡头余落日，墟里上孤烟。","复值接舆醉，狂歌五柳前。"]},{"c":"五言律诗","t":"山居秋暝","a":"王维","p":["空山新雨后，天气晚来秋。","明月松间照，清泉石上流。","竹喧归浣女，莲动下渔舟。","随意春芳歇，王孙自可留。"]},{"c":"五言律诗","t":"归嵩山作","a":"王维","p":["清川带长薄，车马去闲闲。","流水如有意，暮禽相与还。","荒城临古渡，落日满秋山。","迢递嵩高下，归来且闭关。"]},{"c":"五言律诗","t":"次北固山下","a":"王湾","p":["客路青山外，行舟绿水前。(青山外 一作：青山下)","潮平两岸阔，风正一帆悬。","海日生残夜，江春入旧年。","乡书何处达？归雁洛阳边。"]},{"c":"五言律诗","t":"云阳馆与韩绅宿别","a":"司空曙","p":["故人江海别，几度隔山川。","乍见翻疑梦，相悲各问年。","孤灯寒照雨，深竹暗浮烟。","更有明朝恨，离杯惜共传。"]},{"c":"五言律诗","t":"喜外弟卢纶见宿","a":"司空曙","p":["静夜四无邻，荒居旧业贫。","雨中黄叶树，灯下白头人。","以我独沉久，愧君相见频。","平生自有分，况是蔡家亲。"]},{"c":"五言律诗","t":"贼平后送人北归","a":"司空曙","p":["世乱同南去，时清独北还。","他乡生白发，旧国见青山。","晓月过残垒，繁星宿故关。","寒禽与衰草，处处伴愁颜。"]},{"c":"五言律诗","t":"赋得古原草送别","a":"白居易","p":["离离原上草，一岁一枯荣。","野火烧不尽，春风吹又生。","远芳侵古道，晴翠接荒城。","又送王孙去，萋萋满别情。"],"s":"草 / 赋得古原草送别"},{"c":"五言律诗","t":"题大庾岭北驿","a":"宋之问","p":["阳月南飞雁，传闻至此回。","我行殊未已，何日复归来。","江静潮初落，林昏瘴不开。","明朝望乡处，应见陇头梅。"]},{"c":"五言律诗","t":"寄左省杜拾遗","a":"岑参","p":["联步趋丹陛，分曹限紫微。","晓随天仗入，暮惹御香归。","白发悲花落，青云羡鸟飞。","圣朝无阙事，自觉谏书稀。"]},{"c":"五言律诗","t":"听蜀僧浚弹琴","a":"李白","p":["蜀僧抱绿绮，西下峨眉峰。","为我一挥手，如听万壑松。","客心洗流水，余响入霜钟。","不觉碧山暮，秋云暗几重。"],"s":"听蜀僧濬弹琴 / 听蜀僧浚弹琴"},{"c":"五言律诗","t":"夜泊牛渚怀古","a":"李白","p":["牛渚西江夜，青天无片云。","登舟望秋月，空忆谢将军。","余亦能高咏，斯人不可闻。","明朝挂帆席，枫叶落纷纷。(挂帆","一作：去)"]},{"c":"五言律诗","t":"赠孟浩然","a":"李白","p":["吾爱孟夫子，风流天下闻。","红颜弃轩冕，白首卧松云。","醉月频中圣，迷花不事君。","高山安可仰，徒此揖清芬。"]},{"c":"五言律诗","t":"渡荆门送别","a":"李白","p":["渡远荆门外，来从楚国游。","山随平野尽，江入大荒流。","月下飞天镜，云生结海楼。","仍怜故乡水，万里送行舟。"]},{"c":"五言律诗","t":"送友人","a":"李白","p":["青山横北郭，白水绕东城。","此地一为别，孤蓬万里征。","浮云游子意，落日故人情。","挥手自兹去，萧萧班马鸣。"]},{"c":"五言律诗","t":"喜见外弟又言别","a":"李益","p":["十年离乱后，长大一相逢。","问姓惊初见，称名忆旧容。","别来沧海事，语罢暮天钟。","明日巴陵道，秋山又几重。"]},{"c":"五言律诗","t":"凉思","a":"李商隐","p":["客去波平槛，蝉休露满枝。永怀当此节，倚立自移时。","北斗兼春远，南陵寓使迟。天涯占梦数，疑误有新知。"]},{"c":"五言律诗","t":"北青萝","a":"李商隐","p":["残阳西入崦，茅屋访孤僧。落叶人何在，寒云路几层。","独敲初夜磬，闲倚一枝藤。世界微尘里，吾宁爱与憎。"]},{"c":"五言律诗","t":"蝉","a":"李商隐","p":["本以高难饱，徒劳恨费声。","五更疏欲断，一树碧无情。","薄宦梗犹泛，故园芜已平。","烦君最相警，我亦举家清。"]},{"c":"五言律诗","t":"风雨","a":"李商隐","p":["凄凉宝剑篇，羁泊欲穷年。","黄叶仍风雨，青楼自管弦。","新知遭薄俗，旧好隔良缘。","心断新丰酒，销愁斗几千。"]},{"c":"五言律诗","t":"落花","a":"李商隐","p":["高阁客竟去，小园花乱飞。参差连曲陌，迢递送斜晖。","肠断未忍扫，眼穿仍欲归。芳心向春尽，所得是沾衣。"]},{"c":"五言律诗","t":"登岳阳楼","a":"杜甫","p":["昔闻洞庭水，今上岳阳楼。","吴楚东南坼，干坤日夜浮。","亲朋无一字，老病有孤舟。","戎马关山北，凭轩涕泗流。"]},{"c":"五言律诗","t":"奉济驿重送严公四韵","a":"杜甫","p":["远送从此别，青山空复情。几时杯重把，昨夜月同行。","列郡讴歌惜，三朝出入荣。江村独归处，寂寞养残生。"]},{"c":"五言律诗","t":"别房太尉墓","a":"杜甫","p":["他乡复行役，驻马别孤坟。","近泪无干土，低空有断云。","对棋陪谢傅，把剑觅徐君。","唯见林花落，莺啼送客闻。"]},{"c":"五言律诗","t":"旅夜书怀","a":"杜甫","p":["细草微风岸，危樯独夜舟。","星垂平野阔，月涌大江流。","名岂文章著，官应老病休。","飘飘何所似，天地一沙鸥。"]},{"c":"五言律诗","t":"至德二载甫自京金光门","a":"杜甫","p":["此道昔归顺，西郊胡正繁。","至今残破胆，应有未招魂。","近得归京邑，移官岂至尊。","无才日衰老，驻马望千门。"],"s":"至德二载甫自京金光门出间道归凤翔干元初…有悲往事"},{"c":"五言律诗","t":"月夜忆舍弟","a":"杜甫","p":["戍鼓断人行，边秋一雁声。(边秋 一作:秋边)","露从今夜白，月是故乡明。","有弟皆分散，无家问死生。","寄书长不达，况乃未休兵。"]},{"c":"五言律诗","t":"天末怀李白","a":"杜甫","p":["凉风起天末，君子意如何。","鸿雁几时到，江湖秋水多。","文章憎命达，魑魅喜人过。","应共冤魂语，投诗赠汨罗。"]},{"c":"五言律诗","t":"月夜","a":"杜甫","p":["今夜鄜州月，闺中只独看。遥怜小儿女，未解忆长安。","香雾云鬟湿，清辉玉臂寒。何时倚虚幌，双照泪痕干。"]},{"c":"五言律诗","t":"春望","a":"杜甫","p":["国破山河在，城春草木深。","感时花溅泪，恨别鸟惊心。","烽火连三月，家书抵万金。","白头搔更短，浑欲不胜簪。"]},{"c":"五言律诗","t":"春宿左省","a":"杜甫","p":["花隐掖垣暮，啾啾栖鸟过。","星临万户动，月傍九霄多。","不寝听金钥，因风想玉珂。","明朝有封事，数问夜如何。"]},{"c":"五言律诗","t":"旅宿","a":"杜牧","p":["旅馆无良伴，凝情自悄然。","寒灯思旧事，断雁警愁眠。","远梦归侵晓，家书到隔年。","沧江好烟月，门系钓鱼船。"]},{"c":"五言律诗","t":"春宫怨","a":"杜荀鹤","p":["早被婵娟误，欲妆临镜慵。承恩不在貌，教妾若为容。","风暖鸟声碎，日高花影重。年年越溪女，相忆采芙蓉。"]},{"c":"五言律诗","t":"和晋陵陆丞早春游望","a":"杜审言","p":["独有宦游人，偏惊物候新。","云霞出海曙，梅柳渡江春。","淑气催黄鸟，晴光转绿苹。","忽闻歌古调，归思欲沾巾。"]},{"c":"五言律诗","t":"杂诗三首·其三","a":"沈佺期","p":["闻道黄龙戍，频年不解兵。","可怜闺里月，长在汉家营。","少妇今春意，良人昨夜情。","谁能将旗鼓，一为取龙城。"]},{"c":"五言律诗","t":"宿桐庐江寄广陵旧游","a":"孟浩然","p":["山暝闻猿愁，沧江急夜流。(闻 一作：听)","风鸣两岸叶，月照一孤舟。","建德非吾土，维扬忆旧游。","还将两行泪，遥寄海西头。"]},{"c":"五言律诗","t":"留别王维","a":"孟浩然","p":["寂寂竟何待，朝朝空自归。欲寻芳草去，惜与故人违。","当路谁相假，知音世所稀。只应守寂寞，还掩故园扉。"],"s":"留别王侍御维 / 留别王维"},{"c":"五言律诗","t":"早寒有怀","a":"孟浩然","p":["木落雁南度，北风江上寒。","我家襄水曲，遥隔楚云端。","乡泪客中尽，孤帆天际看。(孤帆 一作：归帆)","迷津欲有问，平海夕漫漫。"],"s":"早寒江上有怀 / 早寒有怀"},{"c":"五言律诗","t":"岁暮归南山","a":"孟浩然","p":["北阙休上书，南山归敝庐。不才明主弃，多病故人疏。","白发催年老，青阳逼岁除。永怀愁不寐，松月夜窗虚。"],"s":"岁暮归南山 / 归故园作 / 归终南山"},{"c":"五言律诗","t":"过故人庄","a":"孟浩然","p":["故人具鸡黍，邀我至田家。","绿树村边合，青山郭外斜。","开轩面场圃，把酒话桑麻。","待到重阳日，还来就菊花。"]},{"c":"五言律诗","t":"秦中寄远上人","a":"孟浩然","p":["一丘常欲卧，三径苦无资。","北土非吾愿，东林怀我师。","黄金燃桂尽，壮志逐年衰。","日夕凉风至，闻蝉但益悲。"],"s":"秦中感秋寄远上人 / 秦中寄远上人"},{"c":"五言律诗","t":"望洞庭湖赠张丞相","a":"孟浩然","p":["八月湖水平，涵虚混太清。","气蒸云梦泽，波撼岳阳城。","欲济无舟楫，端居耻圣明。","坐观垂钓者，徒有羡鱼情。"],"s":"望洞庭湖赠张丞相 / 临洞庭湖赠张丞相"},{"c":"五言律诗","t":"与诸子登岘山","a":"孟浩然","p":["人事有代谢，往来成古今。","江山留胜迹，我辈复登临。","水落鱼梁浅，天寒梦泽深。","羊公碑尚在，读罢泪沾襟。(尚在 一作：字在)"]},{"c":"五言律诗","t":"宴梅道士山房","a":"孟浩然","p":["林卧愁春尽，开轩览物华。","忽逢青鸟使，邀入赤松家。","金灶初开火，仙桃正发花。","童颜若可驻，何惜醉流霞。"],"s":"清明日宴梅道士房"},{"c":"五言律诗","t":"章台夜思","a":"韦庄","p":["清瑟怨遥夜，绕弦风雨哀。孤灯闻楚角，残月下章台。","芳草已云暮，故人殊未来。乡书不可寄，秋雁又南回。"]},{"c":"五言律诗","t":"淮上喜会梁州故人","a":"韦应物","p":["江汉曾为客，相逢每醉还。","浮云一别后，流水十年间。","欢笑情如旧，萧疏鬓已斑。","何因不归去？淮上有秋山。"],"s":"淮上喜会梁川故人 / 淮上喜会梁州故人"},{"c":"五言律诗","t":"赋得暮雨送李曹","a":"韦应物","p":["楚江微雨里，建业暮钟时。","漠漠帆来重，冥冥鸟去迟。","海门深不见，浦树远含滋。","相送情无限，沾襟比散丝。"],"s":"赋得暮雨送李胄 / 赋得暮雨送李曹"},{"c":"五言律诗","t":"经邹鲁祭孔子而叹之","a":"李隆基","p":["夫子何为者，栖栖一代中。","地犹鄹氏邑，宅即鲁王宫。","叹凤嗟身否，伤麟怨道穷。","今看两楹奠，当与梦时同。"]},{"c":"五言律诗","t":"灞上秋居","a":"马戴","p":["灞原风雨定，晚见雁行频。","落叶他乡树，寒灯独夜人。","空园白露滴，孤壁野僧邻。","寄卧郊扉久，何年致此身。"]},{"c":"五言律诗","t":"楚江怀古三首·其一","a":"马戴","p":["露气寒光集，微阳下楚丘。猿啼洞庭树，人在木兰舟。","广泽生明月，苍山夹乱流。云中君不见，竟夕自悲秋。"]},{"c":"五言律诗","t":"除夜有怀","a":"崔涂","p":["迢递三巴路，羁危万里身。","乱山残雪夜，孤烛异乡人。","渐与骨肉远，转于僮仆亲。","那堪正飘泊，明日岁华新。"],"s":"除夜 / 巴山道中除夜书怀"},{"c":"五言律诗","t":"孤雁","a":"崔涂","p":["几行归塞尽，念尔独何之。","暮雨相呼失，寒塘欲下迟。","渚云低暗度，关月冷相随。","未必逢矰缴，孤飞自可疑。"],"s":"孤雁二首·其二"},{"c":"五言律诗","t":"题破山寺后禅院","a":"常建","p":["清晨入古寺，初日照高林。","曲径通幽处，禅房花木深。","山光悦鸟性，潭影空人心。","万籁此俱寂，唯闻钟磬音。"]},{"c":"五言律诗","t":"望月怀远","a":"张九龄","p":["海上生明月，天涯共此时。","情人怨遥夜，竟夕起相思。","灭烛怜光满，披衣觉露滋。","不堪盈手赠，还寝梦佳期。"],"s":"望月怀远 / 望月怀古"},{"c":"五言律诗","t":"书边事","a":"张乔","p":["调角断清秋，征人倚戍楼。春风对青冢，白日落梁州。","大汉无兵阻，穷边有客游。蕃情似此水，长愿向南流。"]},{"c":"五言律诗","t":"没蕃故人","a":"张籍","p":["前年伐月支，城下没全师。","蕃汉断消息，死生长别离。","无人收废帐，归马识残旗。","欲祭疑君在，天涯哭此时。"]},{"c":"五言律诗","t":"秋日赴阙题潼关驿楼","a":"许浑","p":["红叶晚萧萧，长亭酒一瓢。","残云归太华，疏雨过中条。","树色随山迥，河声入海遥。","帝乡明日到，犹自梦渔樵。"],"s":"秋日赴阙题潼关驿楼 / 行次潼关逢魏扶东归"},{"c":"五言律诗","t":"早秋","a":"许浑","p":["遥夜泛清瑟，西风生翠萝。","残萤委玉露，早雁拂金河。","高树晓还密，远山晴更多。","淮南一叶下，自觉洞庭波。"],"s":"早秋三首·其一"},{"c":"五言律诗","t":"送人东游","a":"温庭筠","p":["荒戍落黄叶，浩然离故关。","高风汉阳渡，初日郢门山。","江上几人在，天涯孤棹还。","何当重相见，樽酒慰离颜。"]},{"c":"五言律诗","t":"寻陆鸿渐不遇","a":"皎然","p":["移家虽带郭，野径入桑麻。近种篱边菊，秋来未著花。","扣门无犬吠，欲去问西家。报道山中去，归时每日斜。"]},{"c":"五言律诗","t":"寻南溪常道士","a":"刘长卿","p":["一路经行处，莓苔见履痕。","白云依静渚，春草闭闲门。","过雨看松色，随山到水源。","溪花与禅意，相对亦忘言。"],"s":"寻南溪常山道人隐居 / 寻南溪常道士"},{"c":"五言律诗","t":"新年作","a":"刘长卿","p":["乡心新岁切，天畔独潸然。","老至居人下，春归在客先。","岭猿同旦暮，江柳共风烟。","已似长沙傅，从今又几年。"]},{"c":"五言律诗","t":"秋日登吴公台上寺远眺","a":"刘长卿","p":["古台摇落后，秋日望乡心。","野寺来人少，云峰隔水深。","夕阳依旧垒，寒磬满空林。","惆怅南朝事，长江独至今。"]},{"c":"五言律诗","t":"送李中丞归汉阳别业","a":"刘长卿","p":["流落征南将，曾驱十万师。","罢归无旧业，老去恋明时。","独立三边静，轻生一剑知。","茫茫江汉上，日暮欲何之。"],"s":"送李中丞之襄州 / 送李中丞归汉阳别业"},{"c":"五言律诗","t":"饯别王十一南游","a":"刘长卿","p":["望君烟水阔，挥手泪沾巾。","飞鸟没何处，青山空向人。","长江一帆远，落日五湖春。","谁见汀洲上，相思愁白苹。"]},{"c":"五言律诗","t":"蜀先主庙","a":"刘禹锡","p":["天地英雄气，千秋尚凛然。势分三足鼎，业复五铢钱。","得相能开国，生儿不象贤。凄凉蜀故妓，来舞魏宫前。"]},{"c":"五言律诗","t":"阙题","a":"刘昚虚","p":["道由白云尽，春与青溪长。","时有落花至，远随流水香。","闲门向山路，深柳读书堂。","幽映每白日，清辉照衣裳。"]},{"c":"五言律诗","t":"送李端","a":"卢纶","p":["故关衰草遍，离别自堪悲。","路出寒云外，人归暮雪时。","少孤为客早，多难识君迟。","掩泪空相向，风尘何处期。"],"s":"李端公 / 送李端"},{"c":"五言律诗","t":"送僧归日本","a":"钱起","p":["上国随缘住，来途若梦行。","浮天沧海远，去世法舟轻。","水月通禅寂，鱼龙听梵声。","惟怜一灯影，万里眼中明。"]},{"c":"五言律诗","t":"谷口书斋寄杨补阙","a":"钱起","p":["泉壑带茅茨，云霞生薜帷。","竹怜新雨后，山爱夕阳时。","闲鹭栖常早，秋花落更迟。","家僮扫萝径，昨与故人期。"]},{"c":"五言律诗","t":"在狱咏蝉","a":"骆宾王","p":["西陆蝉声唱，南冠客思深。(客思深 一作：客思侵)","不堪玄鬓影，来对白头吟。(不堪 一作：那堪)","露重飞难进，风多响易沉。","无人信高洁，谁为表予心？"],"s":"咏蝉 / 在狱咏蝉"},{"c":"五言律诗","t":"江乡故人偶集客舍","a":"戴叔伦","p":["天秋月又满，城阙夜千重。","还作江南会，翻疑梦里逢。","风枝惊暗鹊，露草覆寒蛩。","羁旅长堪醉，相留畏晓钟。"],"s":"客夜与故人偶集 / 江乡故人偶集客舍"},{"c":"五言律诗","t":"酬程延秋夜即事见赠","a":"韩翃","p":["长簟迎风早，空城澹月华。","星河秋一雁，砧杵夜千家。","节候看应晚，心期卧亦赊。","向来吟秀句，不觉已鸣鸦。"]},{"c":"七言律诗","t":"遣悲怀三首·其一","a":"元稹","p":["谢公最小偏怜女，自嫁黔娄百事乖。","顾我无衣搜荩箧，泥他沽酒拔金钗。(荩箧 一作：画箧)","野蔬充膳甘长藿，落叶添薪仰古槐。","今日俸钱过十万，与君营奠复营斋。"]},{"c":"七言律诗","t":"遣悲怀三首·其二","a":"元稹","p":["昔日戏言身后事，今朝都到眼前来。","衣裳已施行看尽，针线犹存未忍开。","尚想旧情怜婢仆，也曾因梦送钱财。","诚知此恨人人有，贫贱夫妻百事哀。"]},{"c":"七言律诗","t":"遣悲怀三首·其三","a":"元稹","p":["闲坐悲君亦自悲，百年都是几多时。","邓攸无子寻知命，潘岳悼亡犹费词。","同穴窅冥何所望，他生缘会更难期。","惟将终夜常开眼，报答平生未展眉。"]},{"c":"七言律诗","t":"赠郭给事","a":"王维","p":["洞门高阁霭余辉，桃李阴阴柳絮飞。","禁里疏钟官舍晚，省中啼鸟吏人稀。","晨摇玉佩趋金殿，夕奉天书拜琐闱。","强欲从君无那老，将因卧病解朝衣。"],"s":"酬郭给事"},{"c":"七言律诗","t":"和贾至舍人早朝大明宫","a":"王维","p":["绛帻鸡人送晓筹，尚衣方进翠云裘。","九天阊阖开宫殿，万国衣冠拜冕旒。","日色才临仙掌动，香烟欲傍衮龙浮。","朝罢须裁五色诏，佩声归向凤池头。"],"s":"和贾舍人早朝大明宫之作"},{"c":"七言律诗","t":"奉和圣制从蓬莱向兴庆阁道","a":"王维","p":["渭水自萦秦塞曲，黄山旧绕汉宫斜。","銮舆迥出千门柳，阁道回看上苑花。","云里帝城双凤阙，雨中春树万人家。","为乘阳气行时令，不是宸游玩物华。(玩 一作：重)"],"s":"奉和圣制从蓬莱向兴庆阁道中留春雨中春望之作应制"},{"c":"七言律诗","t":"积雨辋川庄作","a":"王维","p":["积雨空林烟火迟，蒸藜炊黍饷东菑。","漠漠水田飞白鹭，阴阴夏木啭黄鹂。","山中习静观朝槿，松下清斋折露葵。","野老与人争席罢，海鸥何事更相疑。"],"s":"积雨辋川庄作 / 秋归辋川庄作"},{"c":"七言律诗","t":"望月有感","a":"白居易","p":["时难年荒世业空，弟兄羁旅各西东。","田园寥落干戈后，骨肉流离道路中。","吊影分为千里雁，辞根散作九秋蓬。","共看明月应垂泪，一夜乡心五处同。"]},{"c":"七言律诗","t":"奉和中书舍人贾至早朝","a":"岑参","p":["鸡鸣紫陌曙光寒，莺啭皇州春色阑。","金阙晓钟开万户，玉阶仙仗拥千官。","花迎剑珮星初落，柳拂旌旗露未干。","独有凤凰池上客，阳春一曲和皆难。"],"s":"奉和中书舍人贾至早朝大明宫"},{"c":"七言律诗","t":"登金陵凤凰台","a":"李白","p":["凤凰台上凤凰游，凤去台空江自流。","吴宫花草埋幽径，晋代衣冠成古丘。","三山半落青天外，二水中分白鹭洲。(二水 一作：一水)","总为浮云能蔽日，长安不见使人愁。"]},{"c":"七言律诗","t":"无题·重帏深下莫愁堂","a":"李商隐","p":["重帏深下莫愁堂，卧后清宵细细长。","神女生涯原是梦，小姑居处本无郎。","风波不信菱枝弱，月露谁教桂叶香。","直道相思了无益，未妨惆怅是清狂。"]},{"c":"七言律诗","t":"无题·凤尾香罗薄几重","a":"李商隐","p":["凤尾香罗薄几重，碧文圆顶夜深缝。","扇裁月魄羞难掩，车走雷声语未通。","曾是寂寥金烬暗，断无消息石榴红。","斑骓只系垂杨岸，何处西南任好风。(任 一作：待)"]},{"c":"七言律诗","t":"无题·相见时难别亦难","a":"李商隐","p":["相见时难别亦难，东风无力百花残。","春蚕到死丝方尽，蜡炬成灰泪始干。","晓镜但愁云鬓改，夜吟应觉月光寒。","蓬山此去无多路，青鸟殷勤为探看。(蓬山 一作：蓬莱)"]},{"c":"七言律诗","t":"无题·来是空言去绝踪","a":"李商隐","p":["来是空言去绝踪，月斜楼上五更钟。","梦为远别啼难唤，书被催成墨未浓。","蜡照半笼金翡翠，麝薰微度绣芙蓉。","刘郎已恨蓬山远，更隔蓬山一万重！"]},{"c":"七言律诗","t":"无题·飒飒东风细雨来","a":"李商隐","p":["飒飒东风细雨来，芙蓉塘外有轻雷。","金蟾啮锁烧香入，玉虎牵丝汲井回。","贾氏窥帘韩掾少，宓妃留枕魏王才。","春心莫共花争发，一寸相思一寸灰！"]},{"c":"七言律诗","t":"无题·昨夜星辰昨夜风","a":"李商隐","p":["昨夜星辰昨夜风，画楼西畔桂堂东。","身无彩凤双飞翼，心有灵犀一点通。","隔座送钩春酒暖，分曹射覆蜡灯红。","嗟余听鼓应官去，走马兰台类转蓬。"]},{"c":"七言律诗","t":"春雨","a":"李商隐","p":["怅卧新春白夹衣，白门寥落意多违。","红楼隔雨相望冷，珠箔飘灯独自归。","远路应悲春晼晚，残霄犹得梦依稀。","玉珰缄札何由达，万里云罗一雁飞。"]},{"c":"七言律诗","t":"筹笔驿","a":"李商隐","p":["猿鸟犹疑畏简书，风云常为护储胥。","徒令上将挥神笔，终见降王走传车。","管乐有才原不忝，关张无命欲何如？","他年锦里经祠庙，梁父吟成恨有余。"]},{"c":"七言律诗","t":"锦瑟","a":"李商隐","p":["锦瑟无端五十弦，一弦一柱思华年。","庄生晓梦迷蝴蝶，望帝春心托杜鹃。","沧海月明珠有泪，蓝田日暖玉生烟。","此情可待成追忆，只是当时已惘然。"]},{"c":"七言律诗","t":"隋宫","a":"李商隐","p":["紫泉宫殿锁烟霞，欲取芜城作帝家。","玉玺不缘归日角，锦帆应是到天涯。","于今腐草无萤火，终古垂杨有暮鸦。","地下若逢陈后主，岂宜重问后庭花。"]},{"c":"七言律诗","t":"送魏万之京","a":"李颀","p":["朝闻游子唱离歌，昨夜微霜初渡河。","鸿雁不堪愁里听，云山况是客中过。","关城树色催寒近，御苑砧声向晚多。(","色 一作：曙)","莫见长安行乐处，空令岁月易蹉跎。"]},{"c":"七言律诗","t":"咏怀古迹·其一","a":"杜甫","p":["支离东北风尘际，漂泊西南天地间。","三峡楼台淹日月，五溪衣服共云山。","羯胡事主终无赖，词客哀时且未还。","庾信平生最萧瑟，暮年诗赋动江关。"],"s":"咏怀古迹五首·其一"},{"c":"七言律诗","t":"咏怀古迹·其二","a":"杜甫","p":["摇落深知宋玉悲，风流儒雅亦吾师。","怅望千秋一洒泪，萧条异代不同时。","江山故宅空文藻，云雨荒台岂梦思。","最是楚宫俱泯灭，舟人指点到今疑。"],"s":"咏怀古迹五首·其二"},{"c":"七言律诗","t":"咏怀古迹·其三","a":"杜甫","p":["群山万壑赴荆门，生长明妃尚有村。","一去紫台连朔漠，独留青冢向黄昏。","画图省识春风面，环佩空归夜月魂。(夜月 一作：月夜 环","一作：环",")","千载琵琶作胡语，分明怨恨曲中论。"],"s":"咏怀古迹五首·其三"},{"c":"七言律诗","t":"咏怀古迹·其四","a":"杜甫","p":["蜀主窥吴幸三峡，崩年亦在永安宫。","翠华想像空山里，玉殿虚无野寺中。","古庙杉松巢水鹤，岁时伏腊走村翁。","武侯祠堂常邻近，一体君臣祭祀同。"],"s":"咏怀古迹五首·其四"},{"c":"七言律诗","t":"咏怀古迹·其五","a":"杜甫","p":["诸葛大名垂宇宙，宗臣遗像肃清高。","三分割据纡筹策，万古云霄一羽毛。","伯仲之间见伊吕，指挥若定失萧曹。","运移汉祚终难复，志决身歼军务劳。"],"s":"咏怀古迹五首·其五"},{"c":"七言律诗","t":"宿府","a":"杜甫","p":["清秋幕府井梧寒，独宿江城蜡炬残。","永夜角声悲自语，中天月色好谁看。","风尘荏苒音书绝，关塞萧条行路难。","已忍伶俜十年事，强移栖息一枝安。"]},{"c":"七言律诗","t":"阁夜","a":"杜甫","p":["岁暮阴阳催短景，天涯霜雪霁寒宵。","五更鼓角声悲壮，三峡星河影动摇。","野哭几家闻战伐，夷歌数处起渔樵。","卧龙跃马终黄土，人事依依漫寂寥。"]},{"c":"七言律诗","t":"闻官军收河南河北","a":"杜甫","p":["剑外忽传收蓟北，初闻涕泪满衣裳。","却看妻子愁何在，漫卷诗书喜欲狂。","白日放歌须纵酒，青春作伴好还乡。","即从巴峡穿巫峡，便下襄阳向洛阳。"]},{"c":"七言律诗","t":"登高","a":"杜甫","p":["风急天高猿啸哀，渚清沙白鸟飞回。","无边落木萧萧下，不尽长江滚滚来。","万里悲秋常作客，百年多病独登台。","艰难苦恨繁霜鬓，潦倒新停浊酒杯。"]},{"c":"七言律诗","t":"登楼","a":"杜甫","p":["花近高楼伤客心，万方多难此登临。","锦江春色来天地，玉垒浮云变古今。","北极朝廷终不改，西山寇盗莫相侵。","可怜后主还祠庙，日暮聊为梁甫吟。(梁甫 一作：梁父)"]},{"c":"七言律诗","t":"蜀相","a":"杜甫","p":["丞相祠堂何处寻，锦官城外柏森森。","映阶碧草自春色，隔叶黄鹂空好音。","三顾频烦天下计，两朝开济老臣心。(频烦 一作：频繁)","出师未捷身先死，长使英雄泪满襟。"]},{"c":"七言律诗","t":"客至","a":"杜甫","p":["舍南舍北皆春水，但见群鸥日日来。","花径不曾缘客扫，蓬门今始为君开。","盘飧市远无兼味，樽酒家贫只旧醅。","肯与邻翁相对饮，隔篱呼取尽余杯。(余 通：余)"]},{"c":"七言律诗","t":"野望","a":"杜甫","p":["西山白雪三城戍，南浦清江万里桥。","海内风尘诸弟隔，天涯涕泪一身遥。","惟将迟暮供多病，未有涓埃答圣朝。(惟 通：唯)","跨马出郊时极目，不堪人事日萧条。"]},{"c":"七言律诗","t":"登柳州城楼寄漳汀封连四州","a":"柳宗元","p":["城上高楼接大荒，海天愁思正茫茫。","惊风乱飐芙蓉水，密雨斜侵薜荔墙。","岭树重遮千里目，江流曲似九回肠。","共来百越文身地，犹自音书滞一乡。"]},{"c":"七言律诗","t":"春思","a":"皇甫冉","p":["莺啼燕语报新年，马邑龙堆路几千。","家住层城临汉苑，心随明月到胡天。(层城 一作：秦城)","机中锦字论长恨，楼上花枝笑独眠。","为问元戎窦车骑，何时返旆勒燕然。"]},{"c":"七言律诗","t":"寄李儋元锡","a":"韦应物","p":["去年花里逢君别，今日花开又一年。","世事茫茫难自料，春愁黯黯独成眠。","身多疾病思田里，邑有流亡愧俸钱。","闻道欲来相问讯，西楼望月几回圆。"]},{"c":"七言律诗","t":"望蓟门","a":"祖咏","p":["燕台一望客心惊，笳鼓喧喧汉将营。(笳鼓 一作：箫鼓)","万里寒光生积雪，三边曙色动危旌。","沙场烽火侵胡月，海畔云山拥蓟城。","少小虽非投笔吏，论功还欲请长缨。"]},{"c":"七言律诗","t":"贫女","a":"秦韬玉","p":["蓬门未识绮罗香，拟托良媒益自伤。","谁爱风流高格调，共怜时世俭梳妆。","敢将十指夸针巧，不把双眉斗画长。","苦恨年年压金线，为他人作嫁衣裳。"]},{"c":"七言律诗","t":"送李少府贬峡中王少府贬","a":"高适","p":["嗟君此别意何如，驻马衔杯问谪居。","巫峡啼猿数行泪，衡阳归雁几封书。","青枫江上秋帆远，白帝城边古木疏。","圣代即今多雨露，暂时分手莫踌躇。"],"s":"送李少府贬峡中王少府贬长沙"},{"c":"七言律诗","t":"九日登望仙台呈刘明府","a":"崔曙","p":["汉文皇帝有高台，此日登临曙色开。","三晋云山皆北向，二陵风雨自东来。","关门令尹谁能识，河上仙翁去不回。","且欲近寻彭泽宰，陶然共醉菊花杯。"],"s":"九日登望仙台呈刘明府容"},{"c":"七言律诗","t":"登黄鹤楼","a":"崔颢","p":["昔人已乘黄鹤去，此地空余黄鹤楼。","黄鹤一去不复返，白云千载空悠悠。","晴川历历汉阳树，芳草萋萋鹦鹉洲。","日暮乡关何处是？烟波江上使人愁。"],"s":"黄鹤楼 / 登黄鹤楼"},{"c":"七言律诗","t":"行经华阴","a":"崔颢","p":["岧峣太华俯咸京，天外三峰削不成。","武帝祠前云欲散，仙人掌上雨初晴。","河山北枕秦关险，驿树西连汉畤平。","借问路傍名利客，无如此处学长生。"]},{"c":"七言律诗","t":"利州南渡","a":"温庭筠","p":["澹然空水对斜晖，曲岛苍茫接翠微。","波上马嘶看棹去，柳边人歇待船归。","数丛沙草群鸥散，万顷江田一鹭飞。","谁解乘舟寻范蠡，五湖烟水独忘机。"]},{"c":"七言律诗","t":"苏武庙","a":"温庭筠","p":["苏武魂销汉使前，古祠高树两茫然。","云边雁断胡天月，陇上羊归塞草烟。","回日楼台非甲帐，去时冠剑是丁年。","茂陵不见封侯印，空向秋波哭逝川。"]},{"c":"七言律诗","t":"江州重别薛六柳","a":"刘长卿","p":["生涯岂料承优诏，世事空知学醉歌。","江上月明胡雁过，淮南木落楚山多。","寄身且喜沧洲近，顾影无如白发何。","今日龙钟人共弃，愧君犹遣慎风波。"],"s":"江州重别薛六柳八二员外"},{"c":"七言律诗","t":"长沙过贾谊宅","a":"刘长卿","p":["三年谪宦此栖迟，万古惟留楚客悲。","秋草独寻人去后，寒林空见日斜时。","汉文有道恩犹薄，湘水无情吊岂知。","寂寂江山摇落处，怜君何事到天涯。"]},{"c":"七言律诗","t":"自夏口至鹦鹉洲夕望岳阳","a":"刘长卿","p":["汀洲无浪复无烟，楚客相思益渺然。","汉口夕阳斜渡鸟，洞庭秋水远连天。","孤城背岭寒吹角，独树临江夜泊船。(独树 一作：独戍)","贾谊上书忧汉室，长沙谪去古今怜。"],"s":"自夏口至鹦鹉洲夕望岳阳寄源中丞"},{"c":"七言律诗","t":"西塞山怀古","a":"刘禹锡","p":["王濬楼船下益州，金陵王气黯然收。","千寻铁锁沉江底，一片降幡出石头。","人世几回伤往事，山形依旧枕寒流。","今逢四海为家日，故垒萧萧芦荻秋。"]},{"c":"七言律诗","t":"晚次鄂州","a":"卢纶","p":["云开远见汉阳城，犹是孤帆一日程。","估客昼眠知浪静，舟人夜语觉潮生。","三湘愁鬓逢秋色，万里归心对月明。","旧业已随征战尽，更堪江上鼓鼙声。"]},{"c":"七言律诗","t":"赠阙下裴舍人","a":"钱起","p":["二月黄莺飞上林，春城紫禁晓阴阴。","长乐钟声花外尽，龙池柳色雨中深。","阳和不散穷途恨，霄汉长怀捧日心。","献赋十年犹未遇，羞将白发对华簪。"]},{"c":"七言律诗","t":"宫词","a":"薛逢","p":["十二楼中尽晓妆，望仙楼上望君王。","锁衔金兽连环冷，水滴铜龙昼漏长。","云髻罢梳还对镜，罗衣欲换更添香。","遥窥正殿帘开处，袍袴宫人扫御床。"]},{"c":"七言律诗","t":"同题仙游观","a":"韩翃","p":["仙台初见五城楼，风物凄凄宿雨收。","山色遥连秦树晚，砧声近报汉宫秋。","疏松影落空坛静，细草香闲小洞幽。","何用别寻方外去，人间亦自有丹丘。"]},{"c":"五言古诗","t":"贼退示官吏","a":"元结","p":["昔岁逢太平，山林二十年。","泉源在庭户，洞壑当门前。","井税有常期，日晏犹得眠。","忽然遭世变，数岁亲戎旃。","今来典斯郡，山夷又纷然。","城小贼不屠，人贫伤可怜。","是以陷邻境，此州独见全。","使臣将王命，岂不如贼焉？","今彼征敛者，迫之如火煎。","谁能绝人命，以作时世贤！","思欲委符节，引竿自刺船。","将家就鱼麦，归老江湖边。"]},{"c":"五言古诗","t":"同从弟销南斋玩月忆山阴","a":"王昌龄","p":["高卧南斋时，开帷月初吐。","清辉澹水木，演漾在窗户。","冉冉几盈虚，澄澄变今古。","美人清江畔，是夜越吟苦。","千里共如何，微风吹兰杜。"],"s":"同从弟南斋玩月忆山阴崔少府"},{"c":"五言古诗","t":"渭川田家","a":"王维","p":["斜阳照墟落，穷巷牛羊归。(斜阳 一作：斜光)","野老念牧童，倚杖候荆扉。","雉雊麦苗秀，蚕眠桑叶稀。","田夫荷锄至，相见语依依。","即此羡闲逸，怅然吟式微。"]},{"c":"五言古诗","t":"西施咏","a":"王维","p":["艳色天下重，西施宁久微。","朝为越溪女，暮作吴宫妃。","贱日岂殊众，贵来方悟稀。","邀人傅香粉，不自著罗衣。","君宠益娇态，君怜无是非。","当时浣纱伴，莫得同车归。","持谢邻家子，效颦安可希。"]},{"c":"五言古诗","t":"送别","a":"王维","p":["下马饮君酒，问君何所之？","君言不得意，归卧南山陲。","但去莫复问，白云无尽时。"]},{"c":"五言古诗","t":"送綦毋潜落第还乡","a":"王维","p":["圣代无隐者，英灵尽来归。","遂令东山客，不得顾采薇。","既至金门远，孰云吾道非。","江淮度寒食，京洛缝春衣。","置酒长安道，同心与我违。","行当浮桂棹，未几拂荆扉。","远树带行客，孤城当落晖。","吾谋适不用，勿谓知音稀。"]},{"c":"五言古诗","t":"青溪","a":"王维","p":["言入黄花川，每逐清溪水。","随山将万转，趣途无百里。","声喧乱石中，色静深松里。","漾漾泛菱荇，澄澄映葭苇。","我心素已闲，清川澹如此。","请留磐石上，垂钓将已矣。(磐石 一作：盘石)"],"s":"青溪 / 过青溪水作"},{"c":"五言古诗","t":"与高适薛据同登慈恩寺","a":"岑参","p":["塔势如涌出，孤高耸天宫。","登临出世界，磴道盘虚空。","突兀压神州，峥嵘如鬼工。","四角碍白日，七层摩苍穹。","下窥指高鸟，俯听闻惊风。","连山若波涛，奔凑似朝东。(凑 一作：走；似 一作：如)","青槐夹驰道，宫馆何玲珑。(馆 一作：观)","秋色从西来，苍然满关中。","五陵北原上，万古青蒙蒙。","净理了可悟，胜因夙所宗。","誓将挂冠去，觉道资无穷。"],"s":"与高适薛据同登慈恩寺浮图"},{"c":"五言古诗","t":"下终南山过斛斯山人宿置酒","a":"李白","p":["暮从碧山下，山月随人归。","却顾所来径，苍苍横翠微。","相携及田家，童稚开荆扉。","绿竹入幽径，青萝拂行衣。","欢言得所憩，美酒聊共挥。","长歌吟松风，曲尽河星稀。","我醉君复乐，陶然共忘机。"]},{"c":"五言古诗","t":"月下独酌四首·其一","a":"李白","p":["花间一壶酒，独酌无相亲。","举杯邀明月，对影成三人。","月既不解饮，影徒随我身。","暂伴月将影，行乐须及春。","我歌月徘徊，我舞影零乱。","醒时同交欢，醉后各分散。(同交欢 一作：相交欢)","永结无情游，相期邈云汉。"]},{"c":"五言古诗","t":"春思","a":"李白","p":["燕草如碧丝，秦桑低绿枝。","当君怀归日，是妾断肠时。","春风不相识，何事入罗帏。"]},{"c":"五言古诗","t":"梦李白·其一","a":"杜甫","p":["死别已吞声，生别常恻恻。江南瘴疠地，逐客无消息。","故人入我梦，明我长相忆。恐非平生魂，路远不可测。","魂来枫叶青，魂返关塞黑。君今在罗网，何以有羽翼。","落月满屋梁，犹疑照颜色。水深波浪阔，无使蛟龙得。"],"s":"梦李白二首·其一"},{"c":"五言古诗","t":"梦李白·其二","a":"杜甫","p":["浮云终日行，游子久不至。","三夜频梦君，情亲见君意。","告归常局促，苦道来不易。","江湖多风波，舟楫恐失坠。","出门搔白首，若负平生志。","冠盖满京华，斯人独憔悴。","孰云网恢恢，将老身反累。","千秋万岁名，寂寞身后事。"],"s":"梦李白二首·其二"},{"c":"五言古诗","t":"望岳","a":"杜甫","p":["岱宗夫如何？齐鲁青未了。","造化钟神秀，阴阳割昏晓。","荡胸生曾云，决眦入归鸟。( 曾 通：层)","会当凌绝顶，一览众山小。"]},{"c":"五言古诗","t":"赠卫八处士","a":"杜甫","p":["人生不相见，动如参与商。","今夕复何夕，共此灯烛光！","少壮能几时？鬓发各已苍！","访旧半为鬼，惊呼热中肠。"]},{"c":"五言古诗","t":"佳人","a":"杜甫","p":["绝代有佳人，幽居在空谷。","自云良家女，零落依草木。","关中昔丧乱，兄弟遭杀戮。","官高何足论，不得收骨肉。","世情恶衰歇，万事随转烛。","夫婿轻薄儿，新人美如玉。","合昏尚知时，鸳鸯不独宿。","但见新人笑，那闻旧人哭。","在山泉水清，出山泉水浊。","侍婢卖珠回，牵萝补茅屋。","摘花不插发，采柏动盈掬。","天寒翠袖薄，日暮倚修竹。"]},{"c":"五言古诗","t":"秋登兰山寄张五","a":"孟浩然","p":["北山白云里，隐者自怡悦。","相望试登高，心随雁飞灭。(试 一作 始)","愁因薄暮起，兴是清秋发。","时见归村人，沙行渡头歇。","天边树若荠，江畔洲如月。","何当载酒来，共醉重阳节。"],"s":"秋登兰山寄张五 / 九月九日岘山寄张子容"},{"c":"五言古诗","t":"夏日南亭怀辛大","a":"孟浩然","p":["山光忽西落，池月渐东上。","散发乘夕凉，开轩卧闲敞。","荷风送香气，竹露滴清响。","欲取鸣琴弹，恨无知音赏。","感此怀故人，中宵劳梦想。(","宵 一作：终)"]},{"c":"五言古诗","t":"宿业师山房待丁大不至","a":"孟浩然","p":["夕阳度西岭，群壑倏已暝。","松月生夜凉，风泉满清听。","樵人归欲尽，烟鸟栖初定。","之子期宿来，孤琴候萝径。"],"s":"宿业师山房期丁大不至 / 宿业师山房待丁大不至"},{"c":"五言古诗","t":"寻西山隐者不遇","a":"丘为","p":["绝顶一茅茨，直上三十里。","扣关无僮仆，窥室唯案几。","若非巾柴车，应是钓秋水。","差池不相见，黾勉空仰止。","草色新雨中，松声晚窗里。","及兹契幽绝，自足荡心耳。","虽无宾主意，颇得清净理。","兴尽方下山，何必待之子。"]},{"c":"五言古诗","t":"晨诣超师院读禅经","a":"柳宗元","p":["汲井漱寒齿，清心拂尘服。","闲持贝叶书，步出东斋读。","真源了无取，妄迹世所逐。","遗言冀可冥，缮性何由熟。","道人庭宇静，苔色连深竹。","日出雾露余，青松如膏沐。","澹然离言说，悟悦心自足。"]},{"c":"五言古诗","t":"溪居","a":"柳宗元","p":["久为簪组累，幸此南夷谪。","闲依农圃邻，偶似山林客。","晓耕翻露草，夜榜响溪石。","来往不逢人，长歌楚天碧。"]},{"c":"五言古诗","t":"送杨氏女","a":"韦应物","p":["永日方戚戚，出行复悠悠。","女子今有行，大江溯轻舟。","尔辈苦无恃，抚念益慈柔。","幼为长所育，两别泣不休。","对此结中肠，义往难复留。","自小阙内训，事姑贻我忧。","赖兹托令门，任恤庶无尤。","贫俭诚所尚，资从岂待周。","孝恭遵妇道，容止顺其猷。","别离在今晨，见尔当何秋。","居闲始自遣，临感忽难收。","归来视幼女，零泪缘缨流。"]},{"c":"五言古诗","t":"长安遇冯著","a":"韦应物","p":["客从东方来，衣上灞陵雨。","问客何为来，采山因买斧。","冥冥花正开，飏飏燕新乳。","昨别今已春，鬓丝生几缕。"]},{"c":"五言古诗","t":"夕次盱眙县","a":"韦应物","p":["落帆逗淮镇，停舫临孤驿。浩浩风起波，冥冥日沉夕。","人归山郭暗，雁下芦洲白。独夜忆秦关，听钟未眠客。"]},{"c":"五言古诗","t":"东郊","a":"韦应物","p":["吏舍跼终年，出郊旷清曙。","杨柳散和风，青山澹吾虑。","依丛适自憩，缘涧还复去。","微雨霭芳原，春鸠鸣何处。","乐幽心屡止，遵事迹犹遽。","终罢斯结庐，慕陶直可庶。"]},{"c":"五言古诗","t":"郡斋雨中与诸文士燕集","a":"韦应物","p":["兵卫森画戟，宴寝凝清香。","海上风雨至，逍遥池阁凉。","烦疴近消散，嘉宾复满堂。","自惭居处崇，未睹斯民康。","理会是非遣，性达形迹忘。","鲜肥属时禁，蔬果幸见尝。","俯饮一杯酒，仰聆金玉章。","神欢体自轻，意欲凌风翔。","吴中盛文史，群彦今汪洋。","方知大藩地，岂曰财赋强。"]},{"c":"五言古诗","t":"初发扬子寄元大校书","a":"韦应物","p":["凄凄去亲爱，泛泛入烟雾。","归棹洛阳人，残钟广陵树。","今朝此为别，何处还相遇。","世事波上舟，沿洄安得住。"]},{"c":"五言古诗","t":"寄全椒山中道士","a":"韦应物","p":["今朝郡斋冷，忽念山中客。","涧底束荆薪，归来煮白石。","欲持一瓢酒，远慰风雨夕。","落叶满空山，何处寻行迹。"]},{"c":"五言古诗","t":"宿王昌龄隐居","a":"常建","p":["清溪深不测，隐处唯孤云。","松际露微月，清光犹为君。","茅亭宿花影，药院滋苔纹。","余亦谢时去，西山鸾鹤群。"]},{"c":"五言古诗","t":"感遇·孤鸿海上来","a":"张九龄","p":["孤鸿海上来，池潢不敢顾。","侧见双翠鸟，巢在三珠树。","矫矫珍木巅，得无金丸惧？","美服患人指，高明逼神恶。","今我游冥冥，弋者何所慕！"],"s":"感遇十二首·其四"},{"c":"五言古诗","t":"感遇·兰叶春葳蕤","a":"张九龄","p":["兰叶春葳蕤，桂华秋皎洁。","欣欣此生意，自尔为佳节。","谁知林栖者，闻风坐相悦。","草木有本心，何求美人折！"],"s":"感遇十二首·其一"},{"c":"五言古诗","t":"感遇·幽人归独卧","a":"张九龄","p":["幽人归独卧，滞虑洗孤清。","持此谢高鸟，因之传远情。","日夕怀空意，人谁感至精？","飞沈理自隔，何所慰吾诚?"],"s":"感遇十二首·其二"},{"c":"五言古诗","t":"感遇·江南有丹橘","a":"张九龄","p":["江南有丹橘，经冬犹绿林。","岂伊地气暖？自有岁寒心。","可以荐嘉客，奈何阻重深。","运命惟所遇，循环不可寻。","徒言树桃李，此木岂无阴？"]},{"c":"五言古诗","t":"春泛若耶溪","a":"綦毋潜","p":["幽意无断绝，此去随所偶。","晚风吹行舟，花路入溪口。","际夜转西壑，隔山望南斗。","潭烟飞溶溶，林月低向后。","生事且弥漫，愿为持竿叟。"]},{"c":"七言古诗","t":"石鱼湖上醉歌","a":"元结","p":["石鱼湖，似洞庭，夏水欲满君山青。","山为樽，水为沼，酒徒历历坐洲岛。","长风连日作大浪，不能废人运酒舫。","我持长瓢坐巴丘，酌饮四坐以散愁。"]},{"c":"七言古诗","t":"长恨歌","a":"白居易","p":["汉皇重色思倾国，御宇多年求不得。杨家有女初长成，养在深闺人未识。","天生丽质难自弃，一朝选在君王侧。回眸一笑百媚生，六宫粉黛无颜色。","春寒赐浴华清池，温泉水滑洗凝脂。侍儿扶起娇无力，始是新承恩泽时。","云鬓花颜金步摇，芙蓉帐暖度春宵。春宵苦短日高起，从此君王不早朝。","承欢侍宴无闲暇，春从春游夜专夜。后宫佳丽三千人，三千宠爱在一身。","金屋妆成娇侍夜，玉楼宴罢醉和春。姊妹弟兄皆列土，可怜光彩生门户。","遂令天下父母心，不重生男重生女。骊宫高处入青云，仙乐风飘处处闻。","缓歌慢舞凝丝竹，尽日君王看不足。渔阳鼙鼓动地来，惊破霓裳羽衣曲。","九重城阙烟尘生，千乘万骑西南行。翠华摇摇行复止，西出都门百余里。","六军不发无奈何，宛转蛾眉马前死。花钿委地无人收，翠翘金雀玉搔头。","君王掩面救不得，回看血泪相和流。黄埃散漫风萧索，云栈萦纡登剑阁。","峨嵋山下少人行，旌旗无光日色薄。蜀江水碧蜀山青，圣主朝朝暮暮情。","行宫见月伤心色，夜雨闻铃肠断声。天旋地转回龙驭，到此踌躇不能去。","马嵬坡下泥土中，不见玉颜空死处。君臣相顾尽沾衣，东望都门信马归。","归来池苑皆依旧，太液芙蓉未央柳。芙蓉如面柳如眉，对此如何不泪垂。","春风桃李花开日，秋雨梧桐叶落时。西宫南内多秋草，落叶满阶红不扫。(花开日 一作：花开夜；南内 一作：南苑)","梨园弟子白发新，椒房阿监青娥老。夕殿萤飞思悄然，孤灯挑尽未成眠。","迟迟钟鼓初长夜，耿耿星河欲曙天。鸳鸯瓦冷霜华重，翡翠衾寒谁与共。","悠悠生死别经年，魂魄不曾来入梦。临邛道士鸿都客，能以精诚致魂魄。","为感君王辗转思，遂教方士殷勤觅。排空驭气奔如电，升天入地求之遍。","上穷碧落下黄泉，两处茫茫皆不见。忽闻海上有仙山，山在虚无缥渺间。","楼阁玲珑五云起，其中绰约多仙子。中有一人字太真，雪肤花貌参差是。","金阙西厢叩玉扃，转教小玉报双成。闻道汉家天子使，九华帐里梦魂惊。","揽衣推枕起徘徊，珠箔银屏迤逦开。云鬓半偏新睡觉，花冠不整下堂来。","风吹仙袂飘飘举，犹似霓裳羽衣舞。玉容寂寞泪阑干，梨花一枝春带雨。(阑 通：栏；飘飘 一作：飘飖)","含情凝睇谢君王，一别音容两渺茫。昭阳殿里恩爱绝，蓬莱宫中日月长。","回头下望人寰处，不见长安见尘雾。惟将旧物表深情，钿合金钗寄将去。","钗留一股合一扇，钗擘黄金合分钿。但教心似金钿坚，天上人间会相见。","临别殷勤重寄词，词中有誓两心知。七月七日长生殿，夜半无人私语时。","在天愿作比翼鸟，在地愿为连理枝。天长地久有时尽，此恨绵绵无绝期。"]},{"c":"七言古诗","t":"琵琶行","a":"白居易","p":["浔阳江头夜送客，枫叶荻花秋瑟瑟。","主人下马客在船，举酒欲饮无管弦。","醉不成欢惨将别，别时茫茫江浸月。","忽闻水上琵琶声，主人忘归客不发。","寻声暗问弹者谁？琵琶声停欲语迟。","移船相近邀相见，添酒回灯重开宴。","千呼万唤始出来，犹抱琵琶半遮面。","转轴拨弦三两声，未成曲调先有情。","弦弦掩抑声声思，似诉平生不得志。（不得志 一作：意）","低眉信手续续弹，说尽心中无限事。","轻拢慢捻抹复挑，初为《霓裳》后《六幺》（六幺 一作：绿腰）。","大弦嘈嘈如急雨，小弦切切如私语。","嘈嘈切切错杂弹，大珠小珠落玉盘。","间关莺语花底滑，幽咽泉流冰下难。","冰泉冷涩弦凝绝，凝绝不通声暂歇。(暂歇 一作：渐歇)","别有幽愁暗恨生，此时无声胜有声。","银瓶乍破水浆迸，铁骑突出刀枪鸣。","曲终收拨当心画，四弦一声如裂帛。","东船西舫悄无言，唯见江心秋月白。","沉吟放拨插弦中，整顿衣裳起敛容。","自言本是京城女，家在虾蟆陵下住。","十三学得琵琶成，名属教坊第一部。","曲罢曾教善才服，妆成每被秋娘妒。","五陵年少争缠头，一曲红绡不知数。","钿头银篦击节碎，血色罗裙翻酒污。(银篦 一作：云)","今年欢笑复明年，秋月春风等闲度。","弟走从军阿姨死，暮去朝来颜色故。","门前冷落鞍马稀，老大嫁作商人妇。","商人重利轻别离，前月浮梁买茶去。","去来江口守空船，绕船月明江水寒。","夜深忽梦少年事，梦啼妆泪红阑干。","我闻琵琶已叹息，又闻此语重唧唧。","同是天涯沦落人，相逢何必曾相识！","我从去年辞帝京，谪居卧病浔阳城。","浔阳地僻无音乐，终岁不闻丝竹声。","住近湓江地低湿，黄芦苦竹绕宅生。","其间旦暮闻何物？杜鹃啼血猿哀鸣。","春江花朝秋月夜，往往取酒还独倾。","岂无山歌与村笛？呕哑嘲哳难为听。","今夜闻君琵琶语，如听仙乐耳暂明。","莫辞更坐弹一曲，为君翻作《琵琶行》。","感我此言良久立，却坐促弦弦转急。","凄凄不似向前声，满座重闻皆掩泣。","座中泣下谁最多？江州司马青衫湿。"],"s":"琵琶行 / 琵琶引"},{"c":"七言古诗","t":"走马川行奉送封大夫出师","a":"岑参","p":["君不见走马川行雪海边，平沙莽莽黄入天。","轮台九月风夜吼，一川碎石大如斗，随风满地石乱走。","匈奴草黄马正肥，金山西见烟尘飞，汉家大将西出师。","将军金甲夜不脱，半夜军行戈相拨，风头如刀面如割。","马毛带雪汗气蒸，五花连钱旋作冰，幕中草檄砚水凝。","虏骑闻之应胆慑，料知短兵不敢接，车师西门伫献捷。"],"s":"走马川行奉送出师西征 / 走马川行奉送封大夫出师西征"},{"c":"七言古诗","t":"轮台歌奉送封大夫出师","a":"岑参","p":["轮台城头夜吹角，轮台城北旄头落。","羽书昨夜过渠黎，单于已在金山西。","戍楼西望烟尘黑，汉军屯在轮台北。","上将拥旄西出征，平明吹笛大军行。","四边伐鼓雪海涌，三军大呼阴山动。","虏塞兵气连云屯，战场白骨缠草根。","剑河风急雪片阔，沙口石冻马蹄脱。(雪片阔 一作：云片阔)","亚相勤王甘苦辛，誓将报主静边尘。","古来青史谁不见，今见功名胜古人。"],"s":"轮台歌奉送封大夫出师西征"},{"c":"七言古诗","t":"白雪歌送武判官归京","a":"岑参","p":["北风卷地白草折，胡天八月即飞雪。","忽如一夜春风来，千树万树梨花开。","散入珠帘湿罗幕，狐裘不暖锦衾薄。","将军角弓不得控，都护铁衣冷难着。(难着 一作：犹著)","瀚海阑干百丈冰，愁云惨淡万里凝。","中军置酒饮归客，胡琴琵琶与羌笛。","纷纷暮雪下辕门，风掣红旗冻不翻。","轮台东门送君去，去时雪满天山路。","山回路转不见君，雪上空留马行处。"]},{"c":"七言古诗","t":"宣州谢脁楼饯别校书叔云","a":"李白","p":["弃我去者，昨日之日不可留；","乱我心者，今日之日多烦忧。","长风万里送秋雁，对此可以酣高楼。","蓬莱文章建安骨，中间小谢又清发。","俱怀逸兴壮思飞，欲上青天揽明月。(览 通：揽；明月 一作：日月)","抽刀断水水更流，举杯消愁愁更愁。","人生在世不称意，明朝散发弄扁舟。"]},{"c":"七言古诗","t":"庐山谣寄卢侍御虚舟","a":"李白","p":["我本楚狂人，凤歌笑孔丘。","手持绿玉杖，朝别黄鹤楼。","五岳寻仙不辞远，一生好入名山游。","庐山秀出南斗傍，屏风九叠云锦张。","影落明湖青黛光，金阙前开二峰长，银河倒挂三石梁。","香炉瀑布遥相望，回崖沓嶂凌苍苍。","翠影红霞映朝日，鸟飞不到吴天长。","登高壮观天地间，大江茫茫去不还。","黄云万里动风色，白波九道流雪山。","好为庐山谣，兴因庐山发。","闲窥石镜清我心，谢公行处苍苔没。","早服还丹无世情，琴心三叠道初成。","遥见仙人彩云里，手把芙蓉朝玉京。","先期汗漫九垓上，愿接卢敖游太清。"]},{"c":"七言古诗","t":"梦游天姥吟留别","a":"李白","p":["海客谈瀛洲，烟涛微茫信难求；","越人语天姥，云霞明灭或可睹。","天姥连天向天横，势拔五岳掩赤城。","天台四万八千丈，对此欲倒东南倾。(四万 一作：一万)","我欲因之梦吴越，一夜飞度镜湖月。(度 通：渡)","湖月照我影，送我至剡溪。","谢公宿处今尚在，渌水荡漾清猿啼。","脚著谢公屐，身登青云梯。","半壁见海日，空中闻天鸡。","千岩万转路不定，迷花倚石忽已暝。","熊咆龙吟殷岩泉，栗深林兮惊层巅。","云青青兮欲雨，水澹澹兮生烟。","列缺霹雳，丘峦崩摧。","洞天石扉，訇然中开。","青冥浩荡不见底，日月照耀金银台。","霓为衣兮风为马，云之君兮纷纷而来下。","虎鼓瑟兮鸾回车，仙之人兮列如麻。","忽魂悸以魄动，恍惊起而长嗟。","惟觉时之枕席，失向来之烟霞。","世间行乐亦如此，古来万事东流水。","别君去兮何时还？且放白鹿青崖间，须行即骑访名山。","安能摧眉折腰事权贵，使我不得开心颜!"],"s":"梦游天姥吟留别 / 梦游天姥山别东鲁诸公"},{"c":"七言古诗","t":"金陵酒肆留别","a":"李白","p":["风吹柳花满店香，吴姬压酒唤客尝。(劝客 一作：唤客)","金陵子弟来相送，欲行不行各尽觞。","请君试问东流水，别意与之谁短长。"]},{"c":"七言古诗","t":"韩碑","a":"李商隐","p":["元和天子神武姿，彼何人哉轩与羲。","誓将上雪列圣耻，坐法宫中朝四夷。","淮西有贼五十载，封狼生䝙䝙生罴。","不据山河据平地，长戈利矛日可麾。","帝得圣相相曰度，贼斫不死神扶持。","腰悬相印作都统，阴风惨澹天王旗。","愬武古通作牙爪，仪曹外郎载笔随。","行军司马智且勇，十四万众犹虎貔。","入蔡缚贼献太庙，功无与让恩不訾。","帝曰汝度功第一，汝从事愈宜为辞。","愈拜稽首蹈且舞，金石刻画臣能为。","古者世称大手笔，此事不系于职司。","当仁自古有不让，言讫屡颔天子颐。","公退斋戒坐小阁，濡染大笔何淋漓。","点窜尧典舜典字，涂改清庙生民诗。","文成破体书在纸，清晨再拜铺丹墀。","表曰臣愈昧死上，咏神圣功书之碑。","碑高三丈字如斗，负以灵鳌蟠以螭。","句奇语重喻者少，谗之天子言其私。","长绳百尺拽碑倒，粗砂大石相磨治。","公之斯文若元气，先时已入人肝脾。","汤盘孔鼎有述作，今无其器存其辞。","呜呼圣王及圣相，相与烜赫流淳熙。","公之斯文不示后，曷与三五相攀追。","愿书万本诵万遍，口角流沫右手胝。","传之七十有二代，以为封禅玉检明堂基。"]},{"c":"七言古诗","t":"听董大弹胡笳声兼寄语","a":"李颀","p":["蔡女昔造胡笳声，一弹一十有八拍。","胡人落泪沾边草，汉使断肠对归客。","古戍苍苍烽火寒，大荒沉沉飞雪白。","先拂商弦后角羽，四郊秋叶惊摵摵。","董夫子，通神明，深山窃听来妖精。","言迟更速皆应手，将往复旋如有情。","空山百鸟散还合，万里浮云阴且晴。","嘶酸雏雁失群夜，断绝胡儿恋母声。","川为静其波，鸟亦罢其鸣。","乌孙部落家乡远，逻娑沙尘哀怨生。","幽音变调忽飘洒，长风吹林雨堕瓦。","迸泉飒飒飞木末，野鹿呦呦走堂下。","长安城连东掖垣，凤凰池对青琐门。","高才脱略名与利，日夕望君抱琴至。"],"s":"听董大弹胡笳声兼寄语弄房给事"},{"c":"七言古诗","t":"听安万善吹觱篥歌","a":"李颀","p":["南山截竹为觱篥，此乐本自龟兹出。","流传汉地曲转奇，凉州胡人为我吹。","傍邻闻者多叹息，远客思乡皆泪垂。","世人解听不解赏，长飙风中自来往。","枯桑老柏寒飕飗，九雏鸣凤乱啾啾。","龙吟虎啸一时发，万籁百泉相与秋。","忽然更作渔阳掺，黄云萧条白日暗。","变调如闻杨柳春，上林繁花照眼新。","岁夜高堂列明烛，美酒一杯声一曲。"]},{"c":"七言古诗","t":"古意","a":"李颀","p":["男儿事长征，少小幽燕客。","赌胜马蹄下，由来轻七尺。","杀人莫敢前，须如猬毛磔。","黄云陇底白云飞，未得报恩不能归。","辽东小妇年十五，惯弹琵琶解歌舞。","今为羌笛出塞声，使我三军泪如雨。"]},{"c":"七言古诗","t":"送陈章甫","a":"李颀","p":["四月南风大麦黄，枣花未落桐阴长。","青山朝别暮还见，嘶马出门思旧乡。","陈侯立身何坦荡，虬须虎眉仍大颡。","腹中贮书一万卷，不肯低头在草莽。","东门酤酒饮我曹，心轻万事如鸿毛。","醉卧不知白日暮，有时空望孤云高。","长河浪头连天黑，津口停舟渡不得。","郑国游人未及家，洛阳行子空叹息。","闻道故林相识多，罢官昨日今如何。"]},{"c":"七言古诗","t":"琴歌","a":"李颀","p":["主人有酒欢今夕，请奏鸣琴广陵客。","月照城头乌半飞，霜凄万树风入衣。(万树 一作：万木)","铜炉华烛烛增辉，初弹渌水后楚妃。","一声已动物皆静，四座无言星欲稀。","清淮奉使千余里，敢告云山从此始。"]},{"c":"七言古诗","t":"古柏行","a":"杜甫","p":["孔明庙前有老柏，柯如青铜根如石。","霜皮溜雨四十围，黛色参天二千尺。","君臣已与时际会，树木犹为人爱惜。","云来气接巫峡长，月出寒通雪山白。","忆昨路绕锦亭东，先主武侯同閟宫。","崔嵬枝干郊原古，窈窕丹青户牖空。","落落盘踞虽得地，冥冥孤高多烈风。","扶持自是神明力，正直原因造化工。","大厦如倾要梁栋，万牛回首丘山重。","不露文章世已惊，未辞翦伐谁能送？","苦心岂免容蝼蚁，香叶终经宿鸾凤。","志士幽人莫怨嗟：古来材大难为用。"]},{"c":"七言古诗","t":"观公孙大娘弟子舞剑器行","a":"杜甫","p":["昔有佳人公孙氏，一舞剑器动四方。","观者如山色沮丧，天地为之久低昂。","霍如羿射九日落，矫如群帝骖龙翔。","来如雷霆收震怒，罢如江海凝清光。","绛唇珠袖两寂寞，晚有弟子传芬芳。","临颍美人在白帝，妙舞此曲神扬扬。","与余问答既有以，感时抚事增惋伤。","先帝侍女八千人，公孙剑器初第一。","五十年间似反掌，风尘澒洞昏王室。","梨园弟子散如烟，女乐余姿映寒日。","金粟堆南木已拱，瞿唐石城草萧瑟。","玳筵急管曲复终，乐极哀来月东出。","老夫不知其所往，足茧荒山转愁疾。"]},{"c":"七言古诗","t":"韦讽录事宅观曹将军画马","a":"杜甫","p":["国初已来画鞍马，神妙独数江都王。","将军得名三十载，人间又见真乘黄。","曾貌先帝照夜白，龙池十日飞霹雳。","内府殷红玛瑙盘，婕妤传诏才人索。","盘赐将军拜舞归，轻纨细绮相追飞。","贵戚权门得笔迹，始觉屏障生光辉。","昔日太宗拳毛䯄，近时郭家狮子花。","今之新图有二马，复令识者久叹嗟。","此皆骑战一敌万，缟素漠漠开风沙。","其余七匹亦殊绝，迥若寒空动烟雪。","霜蹄蹴踏长楸间，马官厮养森成列。","可怜九马争神骏，顾视清高气深稳。","借问苦心爱者谁，后有韦讽前支遁。","忆昔巡幸新丰宫，翠华拂天来向东。","腾骧磊落三万匹，皆与此图筋骨同。","自从献宝朝河宗，无复射蛟江水中。","君不见金粟堆前松柏里，龙媒去尽鸟呼风。"],"s":"韦讽录事宅观曹将军画马图"},{"c":"七言古诗","t":"丹青引赠曹霸将军","a":"杜甫","p":["将军魏武之子孙，于今为庶为清门。","英雄割据虽已矣，文采风流今尚存。","学书初学卫夫人，但恨无过王右军。","丹青不知老将至，富贵于我如浮云。","开元之中常引见，承恩数上南薰殿。","凌烟功臣少颜色，将军下笔开生面。","良相头上进贤冠，猛将腰间大羽箭。","褒公鄂公毛发动，英姿飒爽来酣战。","先帝御马五花骢，画工如山貌不同。","是日牵来赤墀下，迥立阊阖生长风。","诏谓将军拂绢素，意匠惨澹经营中。","斯须九重真龙出，一洗万古凡马空。","玉花却在御榻上，榻上庭前屹相向。","至尊含笑催赐金，圉人太仆皆惆怅。","弟子韩干早入室，亦能画马穷殊相。","干惟画肉不画骨，忍使骅骝气凋丧。","将军画善盖有神，必逢佳士亦写真。","即今漂泊干戈际，屡貌寻常行路人。","途穷反遭俗眼白，世上未有如公贫。","但看古来盛名下，终日坎壈缠其身。"],"s":"丹青引赠曹将军霸"},{"c":"七言古诗","t":"寄韩谏议","a":"杜甫","p":["今我不乐思岳阳，身欲奋飞病在床。","美人娟娟隔秋水，濯足洞庭望八荒。","鸿飞冥冥日月白，青枫叶赤天雨霜。","玉京群帝集北斗，或骑麒麟翳凤凰。","芙蓉旌旗烟雾落，影动倒景摇潇湘。","星宫之君醉琼浆，羽人稀少不在旁。","似闻昨者赤松子，恐是汉代韩张良。","昔随刘氏定长安，帷幄未改神惨伤。","国家成败吾岂敢，色难腥腐餐枫香。","周南留滞古所惜，南极老人应寿昌。","美人胡为隔秋水，焉得置之贡玉堂。"],"s":"寄韩谏议注"},{"c":"七言古诗","t":"夜归鹿门山歌","a":"孟浩然","p":["山寺钟鸣昼已昏，渔梁渡头争渡喧。","人随沙岸向江村，余亦乘舟归鹿门。","鹿门月照开烟树，忽到庞公栖隐处。","岩扉松径长寂寥，惟有幽人自来去。"],"s":"夜归鹿门山歌 / 夜归鹿门歌"},{"c":"七言古诗","t":"渔翁","a":"柳宗元","p":["渔翁夜傍西岩宿，晓汲清湘燃楚竹。","烟销日出不见人，欸乃一声山水绿。","回看天际下中流，岩上无心云相逐。"]},{"c":"七言古诗","t":"登幽州台歌","a":"陈子昂","p":["前不见古人，后不见来者。","念天地之悠悠，独怆然而涕下。"]},{"c":"七言古诗","t":"石鼓歌","a":"韩愈","p":["张生手持石鼓文，劝我试作石鼓歌。","少陵无人谪仙死，才薄将奈石鼓何。","周纲凌迟四海沸，宣王愤起挥天戈。","大开明堂受朝贺，诸侯剑佩鸣相磨。","搜于岐阳骋雄俊，万里禽兽皆遮罗。","镌功勒成告万世，凿石作鼓隳嵯峨。","从臣才艺咸第一，拣选撰刻留山阿。","雨淋日灸野火燎，鬼物守护烦㧑呵。","公从何处得纸本，毫发尽备无差讹。","辞严义密读难晓，字体不类隶与蝌。","年深岂免有缺画，快剑斫断生蛟鼍。","鸾翔凤翥众仙下，珊瑚碧树交枝柯。","金绳铁索锁钮壮，古鼎跃水龙腾梭。","陋儒编诗不收入，二雅褊迫无委蛇。","孔子西行不到秦，掎摭星宿遗羲娥。","嗟余好古生苦晚，对此涕泪双滂沱。","忆昔初蒙博士征，其年始改称元和。","故人从军在右辅，为我度量掘臼科。","濯冠沐浴告祭酒，如此至宝存岂多。","毡包席裹可立致，十鼓只载数骆驼。","荐诸太庙比郜鼎，光价岂止百倍过。","圣恩若许留太学，诸生讲解得切磋。","观经鸿都尚填咽，坐见举国来奔波。","剜苔剔藓露节角，安置妥帖平不颇。","大厦深檐与盖覆，经历久远期无佗。","中朝大官老于事，讵肯感激徒媕婀。","牧童敲火牛砺角，谁复著手为摩挲。","日销月铄就埋没，六年西顾空吟哦。","羲之俗书趁姿媚，数纸尚可博白鹅。","继周八代争战罢，无人收拾理则那。","方今太平日无事，柄任儒术崇丘轲。","安能以此尚论列，愿借辩口如悬河。","石鼓之歌止于此，呜呼吾意其蹉跎。"]},{"c":"七言古诗","t":"山石","a":"韩愈","p":["山石荦确行径微，黄昏到寺蝙蝠飞。","升堂坐阶新雨足，芭蕉叶大栀子肥。","僧言古壁佛画好，以火来照所见稀。","铺床拂席置羹饭，疏粝亦足饱我饥。","夜深静卧百虫绝，清月出岭光入扉。","天明独去无道路，出入高下穷烟霏。","山红涧碧纷烂漫，时见松枥皆十围。","当流赤足踏涧石，水声激激风吹衣。","人生如此自可乐，岂必局束为人鞿？(鞿 一作：靰)","嗟哉吾党二三子，安得至老不更归。"]},{"c":"七言古诗","t":"八月十五夜赠张功曹","a":"韩愈","p":["纤云四卷天无河，清风吹空月舒波。","沙平水息声影绝，一杯相属君当歌。","君歌声酸辞且苦，不能听终泪如雨。","洞庭连天九疑高，蛟龙出没猩鼯号。","十生九死到官所，幽居默默如藏逃。","下床畏蛇食畏药，海气湿蛰薰腥臊。","昨者州前捶大鼓，嗣皇继圣登夔皋。","赦书一日行万里，罪从大辟皆除死。","迁者追回流者还，涤瑕荡垢清朝班。","州家申名使家抑，坎轲只得移荆蛮。","判司卑官不堪说，未免捶楚尘埃间。","同时辈流多上道，天路幽险难追攀。","君歌且休听我歌，我歌今与君殊科。","一年明月今宵多，人生由命非由他。","有酒不饮奈明何。"]},{"c":"七言古诗","t":"谒衡岳庙遂宿岳寺题门楼","a":"韩愈","p":["五岳祭秩皆三公，四方环镇嵩当中。","火维地荒足妖怪，天假神柄专其雄。","喷云泄雾藏半腹，虽有绝顶谁能穷？","我来正逢秋雨节，阴气晦昧无清风。","潜心默祷若有应，岂非正直能感通！","须臾静扫众峰出，仰见突兀撑青空。","紫盖连延接天柱，石廪腾掷堆祝融。","森然魄动下马拜，松柏一径趋灵宫。","粉墙丹柱动光彩，鬼物图画填青红。","升阶伛偻荐脯酒，欲以菲薄明其衷。","庙令老人识神意，睢盱侦伺能鞠躬。","手持杯珓导我掷，云此最吉余难同。","窜逐蛮荒幸不死，衣食才足甘长终。","侯王将相望久绝，神纵欲福难为功。","夜投佛寺上高阁，星月掩映云曈昽。","猿鸣钟动不知曙，杲杲寒日生于东。"]},{"c":"乐府","t":"凉州词","a":"王之涣","p":["黄河远上白云间，一片孤城万仞山。","羌笛何须怨杨柳，春风不度玉门关。"],"s":"凉州词二首·其一"},{"c":"乐府","t":"出塞·秦时明月汉时关","a":"王昌龄","p":["秦时明月汉时关，万里长征人未还。","但使龙城飞将在，不教胡马度阴山。"],"s":"出塞二首·其一"},{"c":"乐府","t":"塞上曲·蝉鸣空桑林","a":"王昌龄","p":["蝉鸣空桑林，八月萧关道。","出塞入塞寒，处处黄芦草。","从来幽并客，皆共尘沙老。","莫学游侠儿，矜夸紫骝好。"],"s":"塞上曲·其一"},{"c":"乐府","t":"塞下曲·饮马渡秋水","a":"王昌龄","p":["饮马渡秋水，水寒风似刀。","平沙日未没，黯黯见临洮。","昔日长城战，咸言意气高。","黄尘足今古，白骨乱蓬蒿。"],"s":"塞下曲"},{"c":"乐府","t":"长信怨","a":"王昌龄","p":["金井梧桐秋叶黄，珠帘不卷夜来霜。","熏笼玉枕无颜色，卧听南宫清漏长。","高殿秋砧响夜阑，霜深犹忆御衣寒。","银灯青琐裁缝歇，还向金城明主看。","奉帚平明金殿开，暂将团扇共徘徊。","玉颜不及寒鸦色，犹带昭阳日影来。","真成薄命久寻思，梦见君王觉后疑。","火照西宫知夜饮，分明覆道奉恩时。","长信宫中秋月明，昭阳殿下捣衣声。","白露堂中细草迹，红罗帐里不胜情。"]},{"c":"乐府","t":"渭城曲","a":"王维","p":["渭城朝雨浥轻尘，客舍青青柳色新。(一作：客舍依依杨柳春)","劝君更尽一杯酒，西出阳关无故人。"],"s":"送元二使安西 / 渭城曲"},{"c":"乐府","t":"秋夜曲","a":"王维","p":["桂魄初生秋露微，轻罗已薄未更衣。","银筝夜久殷勤弄，心怯空房不忍归。"]},{"c":"乐府","t":"洛阳女儿行","a":"王维","p":["洛阳女儿对门居，才可颜容十五余。","良人玉勒乘骢马，侍女金盘脍鲤鱼。","画阁朱楼尽相望，红桃绿柳垂檐向。","罗帷送上七香车，宝扇迎归九华帐。","狂夫富贵在青春，意气骄奢剧季伦。","自怜碧玉亲教舞，不惜珊瑚持与人。","春窗曙灭九微火，九微片片飞花琐。","戏罢曾无理曲时，妆成祗是薰香坐。","城中相识尽繁华，日夜经过赵李家。","谁怜越女颜如玉，贫贱江头自浣纱。"]},{"c":"乐府","t":"老将行","a":"王维","p":["少年十五二十时，步行夺得胡马骑。","射杀山中白额虎，肯数邺下黄须儿！","一身转战三千里，一剑曾当百万师。","汉兵奋迅如霹雳，虏骑崩腾畏蒺藜。","卫青不败由天幸，李广无功缘数奇。","自从弃置便衰朽，世事蹉跎成白首。","昔时飞箭无全目，今日垂杨生左肘。","路旁时卖故侯瓜，门前学种先生柳。","苍茫古木连穷巷，寥落寒山对虚牖。","誓令疏勒出飞泉，不似颍川空使酒。","贺兰山下阵如云，羽檄交驰日夕闻。","节使三河募年少，诏书五道出将军。","试拂铁衣如雪色，聊持宝剑动星文。","愿得燕弓射大将，耻令越甲鸣吾君。","莫嫌旧日云中守，犹堪一战取功勋。"]},{"c":"乐府","t":"桃源行","a":"王维","p":["渔舟逐水爱山春，两岸桃花夹古津。","坐看红树不知远，行尽青溪不见人。","山口潜行始隈隩，山开旷望旋平陆。","遥看一处攒云树，近入千家散花竹。","樵客初传汉姓名，居人未改秦衣服。","居人共住武陵源，还从物外起田园。","月明松下房栊静，日出云中鸡犬喧。","惊闻俗客争来集，竞引还家问都邑。","平明闾巷扫花开，薄暮渔樵乘水入。","初因避地去人间，及至成仙遂不还。","峡里谁知有人事，世中遥望空云山。","不疑灵境难闻见，尘心未尽思乡县。","出洞无论隔山水，辞家终拟长游衍。","自谓经过旧不迷，安知峰壑今来变。","当时只记入山深，青溪几度到云林。","春来遍是桃花水，不辨仙源何处寻。"]},{"c":"乐府","t":"清平调·云想衣裳花想容","a":"李白","p":["云想衣裳花想容，春风拂槛露华浓。","若非群玉山头见，会向瑶台月下逢。"],"s":"清平调·其一"},{"c":"乐府","t":"清平调·一枝红艳露凝香","a":"李白","p":["一枝红艳露凝香，云雨巫山枉断肠。","借问汉宫谁得似，可怜飞燕倚新妆。"],"s":"清平调·其二"},{"c":"乐府","t":"清平调·名花倾国两相欢","a":"李白","p":["名花倾国两相欢，常得君王带笑看。","解释春风无限恨，沉香亭北倚栏杆。"]},{"c":"乐府","t":"行路难·金樽清酒斗十千","a":"李白","p":["金樽清酒斗十千，玉盘珍羞直万钱。(羞 通：馐；直 通 值)","停杯投箸不能食，拔剑四顾心茫然。","欲渡黄河冰塞川，将登太行雪满山。(雪满山 一作：雪暗天)","闲来垂钓碧溪上，忽复乘舟梦日边。","行路难！行路难！多歧路，今安在？","长风破浪会有时，直挂云帆济沧海。"],"s":"行路难·其一"},{"c":"乐府","t":"行路难·大道如青天","a":"李白","p":["大道如青天，我独不得出。","羞逐长安社中儿，赤鸡白雉赌梨栗。","弹剑作歌奏苦声，曳裾王门不称情。","淮阴市井笑韩信，汉朝公卿忌贾生。","君不见昔时燕家重郭隗，拥篲折节无嫌猜。","剧辛乐毅感恩分，输肝剖胆效英才。","昭王白骨萦蔓草，谁人更扫黄金台？","行路难，归去来！"],"s":"行路难·其二"},{"c":"乐府","t":"行路难·有耳莫洗颍川水","a":"李白","p":["有耳莫洗颍川水，有口莫食首阳蕨。","含光混世贵无名，何用孤高比云月？","吾观自古贤达人，功成不退皆殒身。","子胥既弃吴江上，屈原终投湘水滨。","陆机雄才岂自保？李斯税驾苦不早。","华亭鹤唳讵可闻？上蔡苍鹰何足道？","君不见吴中张翰称达生，秋风忽忆江东行。","且乐生前一杯酒，何须身后千载名？"],"s":"行路难·其三"},{"c":"乐府","t":"将进酒","a":"李白","p":["君不见，黄河之水天上来，奔流到海不复回。","君不见，高堂明镜悲白发，朝如青丝暮成雪。","人生得意须尽欢，莫使金樽空对月。","天生我材必有用，千金散尽还复来。","烹羊宰牛且为乐，会须一饮三百杯。","岑夫子，丹丘生，将进酒，杯莫停。","与君歌一曲，请君为我倾耳听。(倾耳听 一作：侧耳听)","钟鼓馔玉不足贵，但愿长醉不复醒。(不足贵 一作：何足贵；不复醒 一作：不愿醒/不用醒)","古来圣贤皆寂寞，惟有饮者留其名。(古来 一作：自古；惟 通：唯)","陈王昔时宴平乐，斗酒十千恣欢谑。","主人何为言少钱，径须沽取对君酌。","五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。"]},{"c":"乐府","t":"玉阶怨","a":"李白","p":["玉阶生白露，夜久侵罗袜。","却下水晶帘，玲珑望秋月。(水晶 一作 水精)"]},{"c":"乐府","t":"长相思·其一","a":"李白","p":["长相思，在长安。","络纬秋啼金井阑，微霜凄凄簟色寒。","孤灯不明思欲绝，卷帷望月空长叹。","美人如花隔云端！","上有青冥之长天，下有渌水之波澜。","天长路远魂飞苦，梦魂不到关山难。","长相思，摧心肝！"]},{"c":"乐府","t":"长相思·其二","a":"李白","p":["日色欲尽花含烟，月明欲素愁不眠。(欲素 一作：如素)","赵瑟初停凤凰柱，蜀琴欲奏鸳鸯弦。","此曲有意无人传，愿随春风寄燕然。","忆君迢迢隔青天，昔日横波目，今作流泪泉。","不信妾断肠，归来看取明镜前。(断肠 一作：肠断)"]},{"c":"乐府","t":"长干行·其一","a":"李白","p":["妾发初覆额，折花门前剧。","郎骑竹马来，绕床弄青梅。","同居长干里，两小无嫌猜，","十四为君妇，羞颜未尝开。","低头向暗壁，千唤不一回。","十五始展眉，愿同尘与灰。","常存抱柱信，岂上望夫台。","十六君远行，瞿塘滟滪堆。","五月不可触，猿声天上哀。(猿","一作：鸣)","门前迟行迹，一一生绿苔。","苔深不能扫，落叶秋风早。","八月蝴蝶来，双飞西园草。","感此伤妾心，坐愁红颜老。","早晚下三巴，预将书报家。","相迎不道远，直至长风沙。"]},{"c":"乐府","t":"蜀道难","a":"李白","p":["噫吁嚱，危乎高哉！","蜀道之难，难于上青天！","蚕丛及鱼凫，开国何茫然！","尔来四万八千岁，不与秦塞通人烟。","西当太白有鸟道，可以横绝峨眉巅。","地崩山摧壮士死，然后天梯石栈相钩连。","上有六龙回日之高标，下有冲波逆折之回川。","黄鹤之飞尚不得过，猿猱欲度愁攀援。(攀援 一作：攀缘)","青泥何盘盘，百步九折萦岩峦。","扪参历井仰胁息，以手抚膺坐长叹。","问君西游何时还？畏途巉岩不可攀。","但见悲鸟号古木，雄飞雌从绕林间。","又闻子规啼夜月，愁空山。","蜀道之难,难于上青天，使人听此凋朱颜！","连峰去天不盈尺，枯松倒挂倚绝壁。","飞湍瀑流争喧豗，砯崖转石万壑雷。","其险也如此，嗟尔远道之人胡为乎来哉！(也如此 一作：也若此)","剑阁峥嵘而崔嵬，一夫当关，万夫莫开。","所守或匪亲，化为狼与豺。","朝避猛虎，夕避长蛇；磨牙吮血，杀人如麻。","锦城虽云乐，不如早还家。","蜀道之难,难于上青天，侧身西望长咨嗟！"]},{"c":"乐府","t":"子夜吴歌·春歌","a":"李白","p":["秦地罗敷女，采桑绿水边。","素手青条上，红妆白日鲜。","蚕饥妾欲去，五马莫留连。"]},{"c":"乐府","t":"子夜吴歌·夏歌","a":"李白","p":["镜湖三百里，菡萏发荷花。","五月西施采，人看隘若耶。","回舟不待月，归去越王家。"]},{"c":"乐府","t":"子夜吴歌·秋歌","a":"李白","p":["长安一片月，万户捣衣声。","秋风吹不尽，总是玉关情。","何日平胡虏，良人罢远征。"]},{"c":"乐府","t":"子夜吴歌·冬歌","a":"李白","p":["明朝驿使发，一夜絮征袍。","素手抽针冷，那堪把剪刀。","裁缝寄远道，几日到临洮。"]},{"c":"乐府","t":"关山月","a":"李白","p":["明月出天山，苍茫云海间。","长风几万里，吹度玉门关。","汉下白登道，胡窥青海湾。","由来征战地，不见有人还。","戍客望边邑，思归多苦颜。(望边邑 一作：望边色)","高楼当此夜，叹息未应闲。"]},{"c":"乐府","t":"江南曲","a":"李益","p":["嫁得瞿塘贾，朝朝误妾期。","早知潮有信，嫁与弄潮儿。"]},{"c":"乐府","t":"古从军行","a":"李颀","p":["白日登山望烽火，黄昏饮马傍交河。","行人刁斗风沙暗，公主琵琶幽怨多。","野云万里无城郭，雨雪纷纷连大漠。","胡雁哀鸣夜夜飞，胡儿眼泪双双落。","闻道玉门犹被遮，应将性命逐轻车。","年年战骨埋荒外，空见蒲桃入汉家。"]},{"c":"乐府","t":"哀王孙","a":"杜甫","p":["长安城头头白乌，夜飞延秋门上呼。","又向人家啄大屋，屋底达官走避胡。","金鞭断折九马死，骨肉不得同驰驱。","腰下宝玦青珊瑚，可怜王孙泣路隅。","问之不肯道姓名，但道困苦乞为奴。","已经百日窜荆棘，身上无有完肌肤。","高帝子孙尽隆准，龙种自与常人殊。","豺狼在邑龙在野，王孙善保千金躯。","不敢长语临交衢，且为王孙立斯须。","昨夜东风吹血腥，东来橐驼满旧都。","朔方健儿好身手，昔何勇锐今何愚。","窃闻天子已传位，圣德北服南单于。","花门剺面请雪耻，慎勿出口他人狙。","哀哉王孙慎勿疏，五陵佳气无时无。"]},{"c":"乐府","t":"兵车行","a":"杜甫","p":["车辚辚，马萧萧，行人弓箭各在腰。","耶娘妻子走相送，尘埃不见咸阳桥。(","娘 一作：“爷”)","牵衣顿足拦道哭，哭声直上干云霄。","道旁过者问行人，行人但云点行频。","或从十五北防河，便至四十西营田。","去时里正与裹头，归来头白还戍边。","边庭流血成海水，武皇开边意未已。","君不闻，汉家山东二百州，千村万落生荆杞。","纵有健妇把锄犁，禾生陇亩无东西。","况复秦兵耐苦战，被驱不异犬与鸡。","长者虽有问，役夫敢申恨？","且如今年冬，未休关西卒。","县官急索租，租税从何出？","信知生男恶，反是生女好。","生女犹得嫁比邻，生男埋没随百草。","君不见，青海头，古来白骨无人收。","新鬼烦冤旧鬼哭，天阴雨湿声啾啾！"]},{"c":"乐府","t":"丽人行","a":"杜甫","p":["三月三日天气新，长安水边多丽人。","态浓意远淑且真，肌理细腻骨肉匀。","绣罗衣裳照暮春，蹙金孔雀银麒麟。","头上何所有？翠微盍叶垂鬓唇。","背后何所见？珠压腰衱稳称身。","就中云幕椒房亲，赐名大国虢与秦。","紫驼之峰出翠釜，水精之盘行素鳞。","犀箸厌饫久未下，鸾刀缕切空纷纶。","黄门飞鞚不动尘，御厨络绎送八珍。","箫鼓哀吟感鬼神，宾从杂遝实要津。","后来鞍马何逡巡，当轩下马入锦茵。","杨花雪落覆白苹，青鸟飞去衔红巾。","炙手可热势绝伦，慎莫近前丞相嗔！"]},{"c":"乐府","t":"哀江头","a":"杜甫","p":["少陵野老吞声哭，春日潜行曲江曲。","江头宫殿锁千门，细柳新蒲为谁绿？","忆昔霓旌下南苑，苑中万物生颜色。","昭阳殿里第一人，同辇随君侍君侧。","辇前才人带弓箭，白马嚼啮黄金勒。","翻身向天仰射云，一笑正坠双飞翼。","明眸皓齿今何在？血污游魂归不得。","清渭东流剑阁深，去住彼此无消息。","人生有情泪沾臆，江水江花岂终极！","黄昏胡骑尘满城，欲往城南望城北。"]},{"c":"乐府","t":"金缕衣","a":"佚名","p":["劝君莫惜金缕衣，劝君惜取少年时。(惜取 一作：须取)","花开堪折直须折，莫待无花空折枝。(花开 一作：有花)"]},{"c":"乐府","t":"独不见","a":"沈佺期","p":["卢家少妇郁金堂，海燕双栖玳瑁梁。","九月寒砧催木叶，十年征戍忆辽阳。","白狼河北音书断，丹凤城南秋夜长。","谁谓含愁独不见，更教明月照流黄。"],"s":"古意呈补阙乔知之 / 独不见"},{"c":"乐府","t":"烈女操","a":"孟郊","p":["梧桐相待老，鸳鸯会双死。","贞女贵殉夫，舍生亦如此。","波澜誓不起，妾心古井水。(古井水 一作：井中水)"]},{"c":"乐府","t":"游子吟","a":"孟郊","p":["慈母手中线，游子身上衣。","临行密密缝，意恐迟迟归。","谁言寸草心，报得三春晖。"]},{"c":"乐府","t":"燕歌行","a":"高适","p":["汉家烟尘在东北，汉将辞家破残贼。","男儿本自重横行，天子非常赐颜色。","摐金伐鼓下榆关，旌旆逶迤碣石间。","校尉羽书飞瀚海，单于猎火照狼山。","山川萧条极边土，胡骑凭陵杂风雨。","战士军前半死生，美人帐下犹歌舞。","大漠穷秋塞草腓，孤城落日斗兵稀。","身当恩遇恒轻敌，力尽关山未解围。","铁衣远戍辛勤久，玉箸应啼别离后。","少妇城南欲断肠，征人蓟北空回首。","边庭飘飖那可度，绝域苍茫更何有。","杀气三时作阵云，寒声一夜传刁斗。","相看白刃血纷纷，死节从来岂顾勋。","君不见沙场征战苦，至今犹忆李将军。"]},{"c":"乐府","t":"长干行·君家何处住","a":"崔颢","p":["君家何处住，妾住在横塘。","停船暂借问，或恐是同乡。"]},{"c":"乐府","t":"长干行·家临九江水","a":"崔颢","p":["家临九江水，来去九江侧。","同是长干人，生小不相识。"]},{"c":"乐府","t":"塞下曲·鹫翎金仆姑","a":"卢纶","p":["鹫翎金仆姑，燕尾绣蝥弧。","独立扬新令，千营共一呼。"],"s":"和张仆射塞下曲·其一"},{"c":"乐府","t":"塞下曲·林暗草惊风","a":"卢纶","p":["林暗草惊风，将军夜引弓。","平明寻白羽，没在石棱中。"],"s":"和张仆射塞下曲·其二"},{"c":"乐府","t":"塞下曲·月黑雁飞高","a":"卢纶","p":["月黑雁飞高，单于夜遁逃。","欲将轻骑逐，大雪满弓刀。"],"s":"和张仆射塞下曲·其三"},{"c":"乐府","t":"塞下曲·野幕敞琼筵","a":"卢纶","p":["野幕敞琼筵，羌戎贺劳旋。","醉和金甲舞，雷鼓动山川。"],"s":"和张仆射塞下曲·其四"}];
