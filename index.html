function stepJumper(S){
  S.frames++;
  const P=S.player;
  P.prevY=P.y;
  if(S.kL) P.vx=Math.max(-4,P.vx-0.5);
  if(S.kR) P.vx=Math.min(4,P.vx+0.5);
  if(!S.kL&&!S.kR) P.vx*=0.9;
  P.x+=P.vx;
  if(P.x<-12) P.x=492; if(P.x>492) P.x=-12;
  P.vy+=0.38; P.y+=P.vy;
  for(const pl of S.plats){
    if(P.vy>0 && P.prevY+11<=pl.y && P.y+11>=pl.y && P.x+10>pl.x && P.x-10<pl.x+pl.w){
      P.y=pl.y-11;
      if(pl.spring){ P.vy=-13.5; P.squash=10; sfx.win(); }
      else { P.vy=-9.4; P.squash=7; sfx.bonk(); }
    }
  }
  if(P.y<190){
    const dy=190-P.y;
    S.plats.forEach(pl=>{ pl.y+=dy; });
    P.y=190;
    S.score+=dy;
    if(S.score>S.best){ S.best=Math.floor(S.score); store.set('jumper.best',S.best); updateJumperHud(S); }
    while(Math.min.apply(null,S.plats.map(p=>p.y)) > -20){
      S.plats.push({x:10+Math.random()*(480-100),y:Math.min.apply(null,S.plats.map(p=>p.y))-(40+Math.random()*40),w:70+Math.random()*36,spring:Math.random()<0.16});
    }
    S.plats=S.plats.filter(pl=>pl.y<420);
  }
  if(P.y>380){ S.over=true; sfx.lose(); updateJumperHud(S);
    stageOverlay(S.mount,'掉下去了！','爬到 '+Math.floor(S.score/10)+' 米 · 最高 '+Math.floor(S.best/10)+' 米','再来一次',()=>{ S.over=false; S.score=0; S.plats=[{x:180,y:300,w:120,spring:false}]; S.player={x:240,y:150,vy:0,vx:0,prevY:150,squash:0}; for(let i=0;i<9;i++) S.plats.push({x:10+Math.random()*(480-100),y:260-i*44,w:70+Math.random()*36,spring:Math.random()<0.16}); S.mount.querySelectorAll('.overlay').forEach(o=>o.remove()); });
  }
  if(P.squash>0) P.squash--;
  updateJumperHud(S);
  drawJumper(S);
}
function drawJumper(S){
  const {ctx}=S;
  ctx.fillStyle='#101a3a'; ctx.fillRect(0,0,480,360);
  for(let i=0;i<24;i++){ const sx=(i*137+((S.player.y*0.2)%480))%480? (i*137)%(480):0, sy=(i*89+Math.floor(S.player.y*0.15))%(360); ctx.fillStyle='rgba(200,210,255,.35)'; ctx.fillRect(sx,sy,2,2); }
  for(const pl of S.plats){
    ctx.fillStyle=pl.spring?'#ff9f43':'#3ddc84'; ctx.fillRect(pl.x,pl.y,pl.w,8);
    ctx.fillStyle='#0b0c18'; ctx.fillRect(pl.x,pl.y,pl.w,2);
    if(pl.spring){ ctx.fillStyle='#0b0c18'; for(let dx=pl.x+8;dx<pl.x+pl.w-8;dx+=12) ctx.fillRect(dx,pl.y+8,4,4); }
  }
  const P=S.player;
  const sy=P.squash>0?1-P.squash/25:1, sx2=P.squash>0?1+P.squash/30:1;
  ctx.fillStyle='#ff8ac2';
  ctx.beginPath(); ctx.ellipse(P.x,P.y+11*sy/2+11*(1-sy)/2,11*sx2,11*sy,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#eef0ff'; ctx.fillRect(P.x-6,P.y+2,4,4); ctx.fillRect(P.x+2,P.y+2,4,4);
  ctx.fillStyle='#0b0c18'; ctx.fillRect(P.x-5,P.y+3,2,2); ctx.fillRect(P.x+3,P.y+3,2,2);
}
function updateJumperHud(S){ $('#jmpS').textContent=Math.floor(S.score/10)+'米'; $('#jmpB').textContent=Math.floor(S.best/10)+'米'; }

/* ---------------- 推箱子 ---------------- */
const SOKO_LEVELS=[
  ["######","#    #","#  . #","#  $ #","#  @ #","######"],
  ["########","#      #","# . $@ #","#      #","########"],
  ["########","#      #","# $ .  #","# $ .  #","# @    #","########"],
  ["#######","#@    #","# $   #","# .   #","#   $ #","#   . #","#######"],
  ["#########","#   @   #","#   $   #","#       #","##.    ##","#########"]
];
let sokobanG = null;
GAMES.sokoban = {
  title:'推箱子',
  mount(mountEl, statsEl){
    mountEl.classList.add('stage');
    const S = sokobanG = { mount:mountEl, raf:0, lvl:0, moves:0, steps:0, done:false, face:{x:0,y:1} };
    statsEl.innerHTML='<div class="stat">关卡<b id="sokL">1 / '+SOKO_LEVELS.length+'</b></div><div class="stat">步数<b id="sokM">0</b></div><button class="px-btn ghost" id="sokR" type="button">重开(R)</button>';
    $('#sokR').addEventListener('click', ()=>sokoLoad(S,S.lvl,true));
    const { cv, ctx } = makeCanvas(480,360);
    cv.className='pix-canvas'; mountEl.appendChild(cv);
    S.cv=cv; S.ctx=ctx;
    S.msg=document.createElement('div');
    S.msg.className='soko-msg'; S.msg.textContent='把箱子推进黄圈圈。R 键重开本关。';
    mountEl.appendChild(S.msg);
    stageOverlay(mountEl,'推箱子','方向键移动。把所有箱子推到黄点上。','开工',()=>sokoLoad(S,0));
    S.loop=()=>{ S.raf=requestAnimationFrame(S.loop); };
    S.raf=requestAnimationFrame(S.loop);
    sokoLoad(S,0);
  },
  onKey(e){
    const S=sokobanG; if(!S||S.done) return false;
    const k=e.key;
    if(k==='ArrowUp'||k==='w'||k==='W'){ sokoMove(S,0,-1); return true; }
    if(k==='ArrowDown'||k==='s'||k==='S'){ sokoMove(S,0,1); return true; }
    if(k==='ArrowLeft'||k==='a'||k==='A'){ sokoMove(S,-1,0); return true; }
    if(k==='ArrowRight'||k==='d'||k==='D'){ sokoMove(S,1,0); return true; }
    if(k==='r'||k==='R'){ sokoLoad(S,S.lvl,true); return true; }
    return false;
  },
  destroy(){ if(sokobanG){ cancelAnimationFrame(sokobanG.raf); sokobanG=null; } }
};
function sokoLoad(S,lvl,silent){
  const rows=SOKO_LEVELS[lvl];
  S.walls=rows.map(r=>[...r].map(c=>c==='#'));
  S.boxes=rows.map(r=>[...r].map(c=>c==='$'));
  S.goals=rows.map(r=>[...r].map(c=>c==='.'));
  S.w=rows[0].length; S.h=rows.length;
  S.worker=null;
  rows.forEach((row,y)=>[...row].forEach((c,x)=>{ if(c==='@') S.worker={x,y}; }));
  if(!S.worker) S.worker={x:1,y:1};
  S.lvl=lvl; S.moves=0; S.steps=0; S.face={x:0,y:1};
  S.cell=Math.max(20,Math.floor(Math.min(480/S.w? (480-16)/S.w : 480, 330/S.h)));
  S.ox=Math.floor((480-S.cell*S.w)/2); S.oy=Math.floor((330-S.cell*S.h)/2);
  $('#sokL').textContent=(lvl+1)+' / '+SOKO_LEVELS.length;
  $('#sokM').textContent='0';
  S.msg.textContent='第 '+(lvl+1)+' 关 · '+(lvl===0?'热身':lvl===SOKO_LEVELS.length-1?'终极试炼':'房间里藏着小机关');
  if(silent) S.mount.querySelectorAll('.overlay').forEach(o=>o.remove());
  sokoDraw(S); sfx.click();
}
function sokoMove(S,dx,dy){
  S.face={x:dx,y:dy};
  const wx=S.worker.x+dx, wy=S.worker.y+dy;
  if(S.walls[wy]&&S.walls[wy][wx]){ sfx.bonk(); return; }
  const ahead2x=wx+dx, ahead2y=wy+dy;
  if(S.boxes[wy]&&S.boxes[wy][wx]){
    if(S.walls[ahead2y][ahead2x]||(S.boxes[ahead2y]&&S.boxes[ahead2y][ahead2x])){ sfx.bonk(); return; }
    S.boxes[wy][wx]=false; S.boxes[ahead2y][ahead2x]=true; sfx.click();
  }
  S.worker={x:wx,y:wy};
  S.moves++; $('#sokM').textContent=S.moves;
  let all=true;
  for(let y=0;y<S.h;y++) for(let x=0;x<S.w;x++){ if(S.boxes[y][x]&&!S.goals[y][x]) all=false; }
  if(all){
    sfx.win();
    if(S.lvl+1<SOKO_LEVELS.length){
      S.msg.textContent='第 '+(S.lvl+1)+' 关完成！共 '+S.moves+" 步";
      stageOverlay(S.mount,'过关！','用了 '+S.moves+' 步','下一关',()=>sokoLoad(S,S.lvl+1));
    } else {
      S.done=true;
      stageOverlay(S.mount,'全部通关！','五个仓库全部摆平，共 '+S.moves+' 步','从头再来',()=>{ S.done=false; sokoLoad(S,0); });
    }
  }
  sokoDraw(S);
}
function sokoDraw(S){
  const {ctx}=S, c=S.cell;
  ctx.fillStyle='#0e0f1d'; ctx.fillRect(0,0,480,360);
  for(let y=0;y<S.h;y++) for(let x=0;x<S.w;x++){
    const px=S.ox+x*c, py=S.oy+y*c;
    if(S.walls[y][x]){ ctx.fillStyle='#34365f'; ctx.fillRect(px,py,c,c); ctx.fillStyle='#2c2d5c'; ctx.fillRect(px+3,py+3,c-6,c-6); }
    else { ctx.fillStyle='#1c1e3a'; ctx.fillRect(px,py,c,c); ctx.fillStyle='#191b38'; ctx.fillRect(px,py+c-2,c,2);
      if(S.goals[y][x]){ ctx.strokeStyle='#ffc53d'; ctx.lineWidth=2; ctx.strokeRect(px+c*0.28,py+c*0.28,c*0.44,c*0.44); } }
    if(S.boxes[y][x]){
      ctx.fillStyle=S.goals[y][x]?'#3ddc84':'#b18cff'; ctx.fillRect(px+3,py+3,c-6,c-6);
      ctx.fillStyle='#0b0c18'; ctx.fillRect(px+6,py+6,c-12,2); ctx.fillRect(px+6,py+c-8,c-12,2);
    }
  }
  if(S.worker){
    const px=S.ox+S.worker.x*c, py=S.oy+S.worker.y*c;
    ctx.fillStyle='#ff8ac2'; ctx.fillRect(px+4,py+4,c-8,c-8);
    ctx.fillStyle='#eef0ff';
    const ex=Math.max(2,c*0.16), off=S.face.x?S.face.x*3:0, offy=S.face.y*3;
    ctx.fillRect(px+c/2+off-ex*1.2,py+c*0.3+offy,ex,ex); ctx.fillRect(px+c/2+off+ex*0.4,py+c*0.3+offy,ex,ex);
  }
}

/* ---------------- 暗影迷宫 ---------------- */
function mazeGen(cols, rows){
  const walls=[], seen=[];
  for(let y=0;y<rows;y++){ walls.push(Array(cols).fill(15)); }
  const vis=[]; for(let y=0;y<rows;y++) vis.push(Array(cols).fill(false));
  const stack=[[0,0]]; vis[0][0]=true;
  const DIRS=[{dx:0,dy:-1,b:1,o:4},{dx:1,dy:0,b:2,o:8},{dx:0,dy:1,b:4,o:1},{dx:-1,dy:0,b:8,o:2}];
  while(stack.length){
    const [cx,cy]=stack[stack.length-1];
    const opts=DIRS.filter(d=>{ const nx=cx+d.dx, ny=cy+d.dy; return nx>=0&&ny>=0&&nx<cols&&ny<rows&&!vis[ny][nx]; });
    if(!opts.length){ stack.pop(); continue; }
    const d=opts[Math.floor(Math.random()*opts.length)];
    const nx=cx+d.dx, ny=cy+d.dy;
    walls[cy][cx]&=~d.b; walls[ny][nx]&=~d.o;
    vis[ny][nx]=true; stack.push([nx,ny]);
  }
  return walls;
}
let mazeG = null;
GAMES.maze = {
  title:'暗影迷宫',
  mount(mountEl, statsEl){
    mountEl.classList.add('stage');
    const S = mazeG = { mount:mountEl, raf:0, cols:15, rows:11, level:1, steps:0, best:store.get('maze.best',0) };
    statsEl.innerHTML='<div class="stat">暗层<b id="mazL">1</b></div><div class="stat">步数<b id="mazN">0</b></div><div class="stat">最深<b id="mazB">'+S.best+'</b></div>';
    const { cv, ctx } = makeCanvas(480,352);
    cv.className='pix-canvas'; mountEl.appendChild(cv);
    S.cv=cv; S.ctx=ctx;
    mazeLevel(S);
    stageOverlay(mountEl,'暗影迷宫','黑暗中只有身边亮着。方向键摸索，抵达右下角出口下潜一层。','潜入',()=>{S.mount.querySelectorAll('.overlay').forEach(o=>o.remove()); sfx.point();});
    S.loop=()=>{ S.raf=requestAnimationFrame(S.loop); };
    S.raf=requestAnimationFrame(S.loop);
  },
  onKey(e){
    const S=mazeG; if(!S) return false;
    const k=e.key;
    if(k==='ArrowUp'||k==='w'||k==='W') return mazeMove(S,0,-1,1), true;
    if(k==='ArrowDown'||k==='s'||k==='S') return mazeMove(S,0,1,4), true;
    if(k==='ArrowLeft'||k==='a'||k==='A') return mazeMove(S,-1,0,8), true;
    if(k==='ArrowRight'||k==='d'||k==='D') return mazeMove(S,1,0,2), true;
    return false;
  },
  destroy(){ if(mazeG){ cancelAnimationFrame(mazeG.raf); mazeG=null; } }
};
function mazeLevel(S){
  S.walls=mazeGen(S.cols,S.rows);
  S.px=0; S.py=0; S.steps=0; S.seen=[[0,0]];
  S.cell=Math.floor(Math.min(480/S.cols,352/S.rows)); S.ox=Math.floor((480-S.cell*S.cols)/2); S.oy=Math.floor((352-S.cell*S.rows)/2);
  S.seenSet=new Set(['0,0']);
  S.flash=null;
  mazeDraw(S);
  $('#mazL').textContent=S.level; $('#mazN').textContent='0';
}
function mazeMove(S,dx,dy,bit){
  if(!S.walls) return true;
  const outside = (dx<0&&S.px===0)||(dy<0&&S.py===0)||(dx>0&&S.px===S.cols-1)||(dy>0&&S.py===S.rows-1);
  if(S.walls[S.py][S.px]&bit || (outside && !(S.px===S.cols-1&&S.py===S.rows-1))){ return true; }
  S.px+=dx; S.py+=dy; S.steps++; $('#mazN').textContent=S.steps;
  const key=S.px+','+S.py;
  if(!S.seenSet.has(key)){ S.seenSet.add(key); if(S.seenSet.size>S.best){ S.best=S.seenSet.size; store.set('maze.best',S.best); $('#mazB').textContent=S.best; } }
  sfx.pop();
  if(S.px===S.cols-1&&S.py===S.rows-1){
    S.level++; sfx.win();
    stageOverlay(S.mount,'找到出口！','第 '+(S.level-1)+' 层用 '+S.steps+' 步','继续下潜',()=>{ S.mount.querySelectorAll('.overlay').forEach(o=>o.remove()); mazeLevel(S); });
  }
  mazeDraw(S);
  return true;
}
function mazeDraw(S){
  const {ctx}=S, c=S.cell;
  ctx.fillStyle='#0a0b16'; ctx.fillRect(0,0,480,352);
  for(let y=0;y<S.rows;y++) for(let x=0;x<S.cols;x++){
    const d=Math.max(Math.abs(x-S.px),Math.abs(y-S.py));
    const key=x+','+y, seen=S.seenSet.has(key);
    if(d<=1||seen){
      const px=S.ox+x*c, py=S.oy+y*c;
      if(d<=1){ ctx.fillStyle='#23244a'; ctx.fillRect(px,py,c-1,c-1); }
      else if(seen){ ctx.fillStyle='#14152b'; ctx.fillRect(px,py,c-1,c-1); }
      ctx.strokeStyle=d<=1?'rgba(154,160,216,.85)':'rgba(154,160,216,.18)';
      ctx.lineWidth=2;
      ctx.beginPath();
      if(S.walls[y][x]&1){ ctx.moveTo(px,py); ctx.lineTo(px+c,py); }
      if(S.walls[y][x]&2){ ctx.moveTo(px+c,py); ctx.lineTo(px+c,py+c); }
      if(S.walls[y][x]&4){ ctx.moveTo(px,py+c); ctx.lineTo(px+c,py+c); }
      if(S.walls[y][x]&8){ ctx.moveTo(px,py); ctx.lineTo(px,py+c); }
      ctx.stroke();
      if(x===S.cols-1&&y===S.rows-1&&d<=3){
        ctx.fillStyle='rgba(255,197,61,'+(0.6+0.4*Math.sin(S.steps+c))+')';
        ctx.fillRect(px+c*0.3,py+c*0.3,c*0.4,c*0.4);
      }
    }
  }
  ctx.fillStyle='#3ddc84';
  const px=S.ox+S.px*c+c/2, py=S.oy+S.py*c+c/2;
  ctx.fillRect(px-4,py-4,8,8);
  ctx.fillStyle='#eef0ff'; ctx.fillRect(px-1,py-2,3,2);
}

/* ---------------- 爆裂色块 ---------------- */
let collapseG = null;
const COL_COLS=['#ff3d5a','#ffc53d','#3ddc84','#4da6ff'];
GAMES.collapse = {
  title:'爆裂色块',
  mount(mountEl, statsEl){
    mountEl.classList.add('stage');
    const S = collapseG = { mount:mountEl, raf:0, frames:0, score:0, best:store.get('collapse.best',0), n:8, cell:42, ox:57, cols:4, flash:null };
    statsEl.innerHTML='<div class="stat">得分<b id="colS">0</b></div><div class="stat">最高<b id="colB">'+S.best+'</b></div><button class="px-btn ghost" id="colR" type="button">重洗</button>';
    const { cv, ctx } = makeCanvas(480,360);
    cv.className='pix-canvas'; mountEl.appendChild(cv);
    S.cv=cv; S.ctx=ctx;
    $('#colR').addEventListener('click', ()=>colShuffle(S,true));
    S.msg=document.createElement('div'); S.msg.className='soko-msg'; S.msg.textContent='点击 2 个以上相连的同色块引爆。';
    mountEl.appendChild(S.msg);
    cv.addEventListener('pointerdown', e=>{
      const r=cv.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width*480, y=(e.clientY-r.top)/r.height*360;
      colClick(S,Math.floor((x-S.ox+6)/S.cell),Math.floor((y+6)/S.cell));
    });
    colReset(S);
    stageOverlay(mountEl,'爆裂色块','点掉同色相连的一团。全部清空 +500！','引爆',()=>{S.mount.querySelectorAll('.overlay').forEach(o=>o.remove()); sfx.point();});
    S.loop=()=>{ S.frames++; stepCollapse(S); S.raf=requestAnimationFrame(S.loop); };
    S.raf=requestAnimationFrame(S.loop);
  },
  destroy(){ if(collapseG){ cancelAnimationFrame(collapseG.raf); collapseG=null; } }
};
function colReset(S){
  S.board=[];
  for(let y=0;y<S.n;y++) S.board.push(Array(S.n).fill(0).map(()=>Math.floor(Math.random()*S.cols)));
  S.score=0; updateColHud(S); colDraw(S);
}
function colShuffle(S,sound){
  const tiles=[];
  for(let y=0;y<S.n;y++) for(let x=0;x<S.n;x++) if(S.board[y]&&S.board[y][x]!=null) tiles.push(S.board[y][x]);
  if(tiles.length){ for(let i=tiles.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [tiles[i],tiles[j]]=[tiles[j],tiles[i]]; } }
  let k=0;
  for(let y=0;y<S.n;y++) for(let x=0;x<S.n;x++) if(S.board[y] !== undefined){ S.board[y][x]=tiles[k++] ?? null; }
  if(sound) sfx.click();
  S.msg.textContent='重洗完毕，继续！';
  colDraw(S);
}
function colClick(S,cx,cy){
  if(S.flash) return;
  if(cy<0||cy>=S.n||cx<0||cx>=S.n||S.board[cy][cx]==null) return;
  const target=S.board[cy][cx];
  const group=[];
  const used=new Set();
  const stack=[[cx,cy]];
  while(stack.length){
    const [x,y]=stack.pop();
    const k=x+','+y;
    if(used.has(k)||x<0||x>=S.n||y<0||y>=S.n) continue;
    if(S.board[y][x]!==target) continue;
    used.add(k); group.push([x,y]);
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  if(group.length<2){ sfx.bonk(); S.msg.textContent='至少两个同色块连在一起才行'; return; }
  const gain=group.length*group.length*5;
  S.score+=gain; updateColHud(S);
  S.msg.textContent='炸掉 '+group.length+' 块 +'+gain+'（连消更快拿更高分）';
  S.flash={cells:group,t:9};
  sfx.pop(); if(group.length>5) sfx.point();
}
function stepCollapse(S){
  if(S.flash){
    S.flash.t--;
    if(S.flash.t<=0){
      for(const [x,y] of S.flash.cells) S.board[y][x]=null;
      for(let x=0;x<S.n;x++){
        const stack=[];
        for(let y=S.n-1;y>=0;y--) if(S.board[y][x]!=null) stack.push(S.board[y][x]);
        for(let y=S.n-1;y>=0;y--) S.board[y][x]=stack.length?stack.shift():null;
      }
      S.flash=null;
      let empty=true, any=null;
      for(let y=0;y<S.n;y++){ if(any) break; for(let x=0;x<S.n;x++) if(S.board[y][x]!=null){ empty=false; any=true; break; } }
      if(empty){ S.score+=500; updateColHud(S); S.msg.textContent='完美清空！+500'; sfx.win(); colDraw(S); return; }
      let movable=false;
      for(let y=0;y<S.n&&!movable;y++) for(let x=0;x<S.n;x++){
        if(S.board[y][x]==null) continue;
        if(x+1<S.n&&S.board[y][x+1]===S.board[y][x]) movable=true;
        if(y+1<S.n&&S.board[y+1][x]===S.board[y][x]) movable=true;
      }
      if(!movable){ S.msg.textContent='没有可消除的组合了，点「重洗」继续'; sfx.bonk(); }
      colDraw(S);
    } else colDraw(S);
  }
}
function updateColHud(S){ $('#colS').textContent=S.score; if(S.score>S.best){ S.best=S.score; store.set('collapse.best',S.best); } $('#colB').textContent=S.best; }
function colDraw(S){
  const {ctx}=S;
  for(let y=0;y<S.n;y++) for(let x=0;x<S.n;x++){
    const px=S.ox+x*42, py=y*42;
    ctx.fillStyle='#12132a'; ctx.fillRect(px+2,py+2,38,38);
    const col=S.board[y]&&S.board[y][x];
    if(col!=null){
      if(S.flash&&S.flash.t%2===0&&S.flash.cells.some(c=>c[0]===x&&c[1]===y)){
        ctx.fillStyle='#eef0ff'; ctx.fillRect(px+3,py+3,36,36);
      } else {
        ctx.fillStyle=COL_COLS[col]; ctx.fillRect(px+3,py+3,36,36);
        ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(px+3,py+35,36,4);
        ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(px+3,py+3,36,4);
      }
    }
  }
  ctx.fillStyle='#23244a'; ctx.fillRect(0,0,S.ox-2,360); ctx.fillRect(S.ox+S.n*42+2,0,480,360);
}

let fishyG = null;
GAMES.fishy = {
  title:'大鱼吃小鱼',
  mount(mountEl, statsEl){
    mountEl.classList.add('stage');
    const S = fishyG = { mount:mountEl, raf:0, frames:0, score:0, best:store.get('fishy.best',0), lives:3, over:false,
      player:{x:240,y:180}, size:13, foes:[], sparks:[], tx:240, ty:180, kU:false,kD:false,kL:false,kR:false };
    statsEl.innerHTML='<div class="stat">得分<b id="fshS">0</b></div><div class="stat">生命<b id="fshL">❤❤❤</b></div><div class="stat">身长<b id="fshZ">13</b></div><div class="stat">最高<b id="fshB">'+S.best+'</b></div>';
    const { cv, ctx } = makeCanvas(480,360);
    cv.className='pix-canvas'; mountEl.appendChild(cv);
    S.cv=cv; S.ctx=ctx;
    cv.addEventListener('mousemove', e=>{
      const r=cv.getBoundingClientRect();
      S.tx=(e.clientX-r.left)/r.width*480; S.ty=(e.clientY-r.top)/r.height*360;
    });
    S.ku = e => {
      const k=e.key.toLowerCase();
      if(k==='arrowup'||k==='w') S.kU=false; if(k==='arrowdown'||k==='s') S.kD=false;
      if(k==='arrowleft'||k==='a') S.kL=false; if(k==='arrowright'||k==='d') S.kR=false;
    };
    document.addEventListener('keyup', S.ku);
    stageOverlay(mountEl,'大鱼吃小鱼','鼠标或 WASD 游动。吃掉小的长大，遇到大的快逃！','下海',()=>startFishy(S));
    S.loop=()=>{ stepFishy(S); S.raf=requestAnimationFrame(S.loop); };
    S.raf=requestAnimationFrame(S.loop);
  },
  onKey(e){
    const S=fishyG; if(!S) return false;
    const k=e.key.toLowerCase();
    let hit=false;
    if(k==='arrowup'||k==='w'){ S.kU=true; hit=true; }
    if(k==='arrowdown'||k==='s'){ S.kD=true; hit=true; }
    if(k==='arrowleft'||k==='a'){ S.kL=true; hit=true; }
    if(k==='arrowright'||k==='d'){ S.kR=true; hit=true; }
    if(k==='enter'&&S.over){ startFishy(S); return true; }
    return hit;
  },
  destroy(){ if(fishyG){ cancelAnimationFrame(fishyG.raf); if(fishyG.ku) document.removeEventListener('keyup',fishyG.ku); fishyG=null; } }
};
function startFishy(S){
  if(!S) return;
  S.mount.querySelectorAll('.overlay').forEach(o=>o.remove());
  S.over=false; S.score=0; S.lives=3; S.size=13; S.frames=0; S.foes=[];
  S.player={x:240,y:180}; updateFishyHud(S); sfx.point();
}
function stepFishy(S){
  S.frames++;
  const P=S.player;
  if(S.kU) S.ty-=6; if(S.kD) S.ty+=6; if(S.kL) S.tx-=6; if(S.kR) S.tx+=6;
  S.tx=Math.max(0,Math.min(480,S.tx)); S.ty=Math.max(0,Math.min(360,S.ty));
  P.x+=(S.tx-P.x)*0.1; P.y+=(S.ty-P.y)*0.1;
  if(!S.over){
    if(S.frames%34===0&&S.foes.length<14){
      const fromLeft=Math.random()<0.5;
      const r=Math.random();
      let size;
      if(r<0.72) size=5+Math.random()*(S.size*1.0);
      else size=S.size*(1.08+Math.random()*0.5);
      if(size<5) size=5;
      S.foes.push({x:fromLeft?-30:510, y:24+Math.random()*310, size, vx:(fromLeft?1:-1)*(0.9+Math.random()*1.4), col:Math.floor(Math.random()*4), wob:Math.random()*6, gold:Math.random()<0.06});
    }
    for(let i=S.foes.length-1;i>=0;i--){
      const f=S.foes[i];
      f.x+=f.vx;
      if(f.x<-60||f.x>540){ S.foes.splice(i,1); continue; }
      const dist=Math.hypot(f.x-P.x,f.y-P.y), danger=f.size>=S.size*1.02;
      if(dist<S.size*0.7+f.size*0.6){
        if(danger){
          S.foes.splice(i,1); S.lives--; S.size=Math.max(13,S.size-3); updateFishyHud(S); sfx.lose();
          for(let k=0;k<6;k++) S.sparks.push({x:P.x,y:P.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:1,col:'#ff8ac2'});
          if(S.lives<=0){
            S.over=true;
            if(S.score>S.best){ S.best=S.score; store.set('fishy.best',S.best); }
            updateFishyHud(S);
            stageOverlay(S.mount,'被吃掉了！','得分 '+S.score+' · 身长 '+Math.round(S.size)+' · 最高 '+S.best,'重整旗鼓',()=>startFishy(S));
            return;
          }
        } else {
          S.foes.splice(i,1);
          const pts=f.gold?Math.ceil(f.size*3):Math.ceil(f.size);
          S.score+=pts; S.size+=f.gold?1.2:0.5;
          updateFishyHud(S); sfx.eat();
          for(let k=0;k<4;k++) S.sparks.push({x:f.x,y:f.y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:1,col:f.gold?'#ffe95c':'#3ddc84'});
        }
      }
    }
  }
  for(let i=S.sparks.length-1;i>=0;i--){ const p=S.sparks[i]; p.x+=p.vx; p.y+=p.vy; p.life-=0.05; if(p.life<=0) S.sparks.splice(i,1); }
  drawFishy(S);
}
function drawFishy(S){
  const {ctx}=S;
  ctx.fillStyle='#0d2240'; ctx.fillRect(0,0,480,360);
  ctx.fillStyle='rgba(77,166,255,.12)';
  for(let i=0;i<5;i++) ctx.fillRect(0,60+i*60+Math.sin(S.frames/48+i)*3,480,10);
  const drawFish=function(x,y,size,col,dir,face,gold){
    ctx.save(); ctx.translate(x,y); ctx.scale(dir,1);
    ctx.fillStyle=gold?'#ffe95c':['#ff3d5a','#ffc53d','#4da6ff','#b18cff'][col]||'#b18cff';
    ctx.beginPath(); ctx.ellipse(0,0,size,size*0.64,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-size*0.85,0); ctx.lineTo(-size*1.5,-size*0.5); ctx.lineTo(-size*1.5,size*0.5); ctx.fill();
    ctx.fillStyle='#eef0ff'; ctx.beginPath(); ctx.arc(size*0.45,-size*0.16,size*0.18,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0b0c18'; ctx.beginPath(); ctx.arc(size*0.5,-size*0.16,size*0.09,0,Math.PI*2); ctx.fill();
    ctx.restore();
    if(face){ ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1; }
  };
  for(const f of S.foes){
    drawFish(f.x, f.y+Math.sin(S.frames/16+f.wob)*3, f.size, f.col, Math.sign(f.vx)||1, false, f.gold);
  }
  const P=S.player, dir=S? (S.tx>=P.x?1:-1):1;
  drawFish(P.x,P.y,S.size,0,dir,true,false);
  ctx.fillStyle='#3ddc84';
  for(let i=0;i<S.lives;i++) ctx.fillRect(8+i*14,8,8,8);
  for(const p of S.sparks){ ctx.fillStyle=p.col; ctx.globalAlpha=Math.max(0,p.life); ctx.fillRect(p.x-2,p.y-2,4,4); }
  ctx.globalAlpha=1;
}
function updateFishyHud(S){
  $('#fshS').textContent=S.score;
  $('#fshL').textContent='❤'.repeat(Math.max(0,S.lives))+'·'.repeat(Math.max(0,3-S.lives));
  $('#fshZ').textContent=Math.round(S.size);
  $('#fshB').textContent=S.best;
}

function rhythmTap(S){
  if(S.over) return;
  if(Math.abs(S.marker-240)<=S.zone/2){
    S.combo++; S.bestCombo=Math.max(S.bestCombo,S.combo);
    S.score+=15+Math.min(S.combo,40);

    S.speed=Math.min(9,4+S.combo*0.07);
    S.zone=Math.max(26,S.zone-3);
    S.rings.push({r:S.zone,a:1});
    tone(500+S.combo*16,0.07,'square',0.05); sfx.point();
  } else {
    S.combo=0; S.zone=120; sfx.bonk();
  }
  updateRhythmHud(S);
}
function stepRhythm(S){
  S.frames++;

    S.marker+=S.speed*S.dir;
    if(S.marker>448){ S.marker=448; S.dir=-1; }
    if(S.marker<32){ S.marker=32; S.dir=1; }
  }
  for(let i=S.rings.length-1;i>=0;i--){ const r=S.rings[i]; r.r+=2.2; r.a-=0.05; if(r.a<=0) S.rings.splice(i,1); }
  drawRhythm(S);
}
function drawRhythm(S){

  ctx.fillStyle='#23244a'; ctx.fillRect(20,150,440,16);

  for(let x=20;x<240-S.zone/2;x+=16) ctx.fillRect(x,154,6,8);

  ctx.fillStyle='#0b0c18'; ctx.fillRect(240-S.zone/2,148,3,20); ctx.fillRect(240+S.zone/2-3,148,3,20);

  ctx.beginPath(); ctx.moveTo(S.marker,146); ctx.lineTo(S.marker+9,158); ctx.lineTo(S.marker,170); ctx.lineTo(S.marker-9,158); ctx.fill();
  for(const r of S.rings){ ctx.strokeStyle='rgba(255,197,61,'+Math.max(0,r.a)+')'; ctx.lineWidth=3; ctx.strokeRect(240-r.r/2,158-r.r/2,r.r,r.r); }
  ctx.fillStyle='#eef0ff'; ctx.font='22px "Press Start 2P",DotGothic16,monospace'; ctx.textAlign='center';

function lunarTerrain(S){
  const pts=[];
  let y=140+Math.random()*160;
  for(let i=0;i<=20;i++){ pts.push(y); y=Math.max(70,Math.min(320,y+(Math.random()-0.5)*54)); }
  const pad=Math.floor(2+Math.random()*16);
  const padY=Math.max(95,Math.min(300,90+Math.random()*160));
  pts[pad]=padY; pts[pad+1]=padY;
  S.terrain={pts,pad,padX1:pad*24,padX2:(pad+1)*24};
}
function startLunar(S){
  if(!S) return;
  S.mount.querySelectorAll('.overlay').forEach(o=>o.remove());
  S.over=false; S.landed=false; S.fuel=100;
  S.ship={x:200+Math.random()*80,y:34,vx:(Math.random()<0.5?-1:1)*0.4,vy:0};
  lunarTerrain(S); updateLunarHud(S); sfx.point();
}
function stepLunar(S){
  S.frames++;
  if(!S.over){
    const sp=S.ship;
    if(S.kU&&S.fuel>0){ sp.vy-=0.085; S.fuel=Math.max(0,S.fuel-0.4); }
    if(S.kL&&S.fuel>0){ sp.vx-=0.05; S.fuel=Math.max(0,S.fuel-0.12); }
    if(S.kR&&S.fuel>0){ sp.vx+=0.05; S.fuel=Math.max(0,S.fuel-0.12); }
    sp.vy+=0.026; sp.vx*=0.999;
    sp.x+=sp.vx; sp.y+=sp.vy;
    if(sp.x<12){ sp.x=12; sp.vx=Math.abs(sp.vx)*0.5; }
    if(sp.x>468){ sp.x=468; sp.vx=-Math.abs(sp.vx)*0.5; }
    if(sp.y<14){ sp.y=14; sp.vy=0; }
    const j=Math.max(0,Math.min(19,Math.floor(sp.x/24)));
    const gy=S.terrain.pts[j];
    if(sp.y+11>=gy){
      const onPad=sp.x>=S.terrain.padX1&&sp.x<=S.terrain.padX2;
      const gentle=Math.abs(sp.vx)<=0.55&&sp.vy<=0.95;
      const px=sp.x,py=sp.y+11;
      if(onPad&&gentle){
        S.landed=true; S.over=true;
        const gain=Math.round(S.fuel)+S.level*50;
        S.score+=gain;
        if(S.score>S.best){ S.best=S.score; store.set('lunar.best',S.best); }
        updateLunarHud(S); sfx.win();
        for(let k=0;k<10;k++) S.parts.push({x:px,y:py,vx:(Math.random()-.5)*3,vy:-Math.random()*3,life:1,col:'#3ddc84'});
        stageOverlay(S.mount,'着陆成功！','+'+gain+' 分 · 燃料剩 '+Math.round(S.fuel)+'%','下一关（更快挑战）',()=>{ S.level++; updateLunarHud(S); S.mount.querySelectorAll('.overlay').forEach(o=>o.remove()); S.over=false; S.landed=false; S.fuel=100; S.ship={x:200+Math.random()*80,y:34,vx:(Math.random()<0.5?-1:1)*(0.4+S.level*0.08),vy:0}; lunarTerrain(S); sfx.point(); });
      } else {
        S.over=true; sfx.lose();
        for(let k=0;k<16;k++) S.parts.push({x:px,y:py,vx:(Math.random()-.5)*6,vy:-Math.random()*5,life:1,col:k%2?'#ff8ac2':'#ffc53d'});
        stageOverlay(S.mount,'坠毁了…',''+(onPad?'速度太快，':'')+'姿势不对。得分 '+S.score+' · 最高 '+S.best,'再来一次',()=>startLunar(S));
      }
      sp.y=gy-11; sp.vy=0; sp.vx=0;
    }
    updateLunarHud(S);
  }
  for(let i=S.parts.length-1;i>=0;i--){ const p=S.parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life-=0.03; if(p.life<=0) S.parts.splice(i,1); }
  drawLunar(S);
}
function drawLunar(S){
  const {ctx}=S;
  ctx.fillStyle='#0e1030'; ctx.fillRect(0,0,480,360);
  for(const st of S.stars){ ctx.fillStyle='rgba(200,210,255,.6)'; ctx.fillRect(st.x,st.y,st.s,st.s); }
  const t=S.terrain;
  ctx.fillStyle='#3a3c6e'; ctx.beginPath(); ctx.moveTo(0,360);
  for(let i=0;i<=20;i++) ctx.lineTo(i*24,t.pts[i]);
  ctx.lineTo(480,360); ctx.fill();
  ctx.strokeStyle='#5b5d92'; ctx.lineWidth=3; ctx.beginPath();
  for(let i=0;i<=20;i++){ if(i===0) ctx.moveTo(0,t.pts[i]); else ctx.lineTo(i*24,t.pts[i]); }
  ctx.stroke();
  const blink=t===undefined||Math.floor(S.frames/20)%2===0;
  ctx.fillStyle=blink?'#3ddc84':'#1e7c4f';
  ctx.fillRect(t.padX1,t.padY-2,48,4);
  ctx.fillRect(t.padX1+2,t.padY-14,3,12);
  ctx.beginPath(); ctx.moveTo(t.padX1+5,t.padY-14); ctx.lineTo(t.padX1+19,t.padY-10); ctx.lineTo(t.padX1+5,t.padY-6); ctx.fill();
  const sp=S.ship;
  ctx.fillStyle='#eef0ff';
  ctx.beginPath(); ctx.moveTo(sp.x,sp.y-10); ctx.lineTo(sp.x+9,sp.y+6); ctx.lineTo(sp.x-9,sp.y+6); ctx.fill();
  ctx.fillStyle='#9aa0d8';
  ctx.beginPath(); ctx.moveTo(sp.x-3,sp.y+6); ctx.lineTo(sp.x-7,sp.y+11); ctx.lineTo(sp.x-4,sp.y+6); ctx.fill();
  ctx.beginPath(); ctx.moveTo(sp.x+3,sp.y+6); ctx.lineTo(sp.x+7,sp.y+11); ctx.lineTo(sp.x+4,sp.y+6); ctx.fill();
  if(S.kU&&S.fuel>0&&!S.over){
    const r6=6+Math.random()*8;
    ctx.fillStyle='#ffc53d'; ctx.fillRect(sp.x-7,sp.y+7,3,r6*0.6); ctx.fillRect(sp.x-2,sp.y+8,3,r6); ctx.fillRect(sp.x+4,sp.y+7,3,r6*0.6);
  }
  for(const p of S.parts){ ctx.fillStyle=p.col; ctx.globalAlpha=Math.max(0,p.life); ctx.fillRect(p.x-2,p.y-2,4,4); }
  ctx.globalAlpha=1;
  ctx.fillStyle='#23244a'; ctx.fillRect(0,344,480,16);
  ctx.fillStyle='#ffc53d'; ctx.fillRect(0,344,480*S.fuel/100,5);
}

    if(c){ ctx.fillStyle = c; ctx.fillRect(x*scale, y*scale, scale, scale); }
  }
  ctx.strokeStyle = 'rgba(255,255,255,.06)';
  ctx.lineWidth = 1;
  for(let i=0;i<=size;i++){
    ctx.beginPath(); ctx.moveTo(i*scale + .5, 0); ctx.lineTo(i*scale + .5, cv.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*scale + .5); ctx.lineTo(cv.width, i*scale + .5); ctx.stroke();
  }
}
function paintDoodle(D, p){
  if(!p || p.x<0 || p.y<0 || p.x>=D.size || p.y>=D.size) return;
  D.pixels[p.y][p.x] = D.color;

function spawnBall(B, x, y){
  if(B.balls.length >= 60) return;
  const size = 14 + Math.random()*12;
  const col = BALL_COLORS[Math.floor(Math.random()*BALL_COLORS.length)];
  const d = document.createElement('div');

    el:d, x:x - size/2, y:y - size/2,
    vx:(Math.random()-.5)*7, vy:-2 - Math.random()*4,
    r:size/2, g:.25, damp:.78
  });

function stepBounce(B){
  const w = B.box.clientWidth, h = B.box.clientHeight;
  for(let i=B.balls.length-1;i>=0;i--){
    const b = B.balls[i];
    b.vy += b.g;
    b.x += b.vx; b.y += b.vy;
    if(b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx) * b.damp; }
    if(b.x + b.r > w){ b.x = w - b.r; b.vx = -Math.abs(b.vx) * b.damp; }
    if(b.y < b.r){ b.y = b.r; b.vy = Math.abs(b.vy) * b.damp; }
    if(b.y + b.r > h){ b.y = h - b.r; b.vy = -Math.abs(b.vy) * b.damp; }
    if(Math.abs(b.vx) < .08 && Math.abs(b.vy) < .08 && b.y + b.r >= h - .5){ b.vx = 0; b.vy = 0; }
    b.el.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px)';
  }
}

];
const SLIME_COLORS = { k:'#0b0c18', g:'#3ddc84', w:'#b8f5d4', d:'#0b0c18', m:'#0b0c18', p:'#ff8ac2' };
const EYE_CLOSED = 'kgkkggggggggkkgk';
const MOUTH_HAPPY = 'kggg.mmmmmm.gggk';

function slimeRowsFor(state){
  const rows = SLIME_ROWS.slice();
  if(state === 'blink' || state === 'sad'){
    rows[5] = EYE_CLOSED;
    rows[6] = EYE_CLOSED;
  }
  if(state === 'sad') rows[8] = MOUTH_SAD;
  if(state === 'happy') rows[8] = MOUTH_HAPPY;
  if(state === 'eat'){
    rows[8] = MOUTH_HAPPY;
    rows[9] = MOUTH_HAPPY;
  }
  return rows;
}
function slimeState(P, t){
  if(P.eatUntil && t < P.eatUntil) return 'eat';
  if(P.blinkUntil && t < P.blinkUntil) return 'blink';
  if(t - P.lastBlink > 3200 + Math.random()*1200){ P.lastBlink = t; P.blinkUntil = t + 190; return 'blink'; }
  if(P.hunger < 25) return 'sad';
  if(P.happyUntil && t < P.happyUntil) return 'happy';
  return 'idle';
}
function petFrame(P, t){
  const ctx = P.ctx;
  if(!ctx) return;
  const W = P.canvas.width, H = P.canvas.height;
  ctx.clearRect(0, 0, W, H);
  // 地面阴影
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(W/2 - 46, 140, 92, 10);
  // 呼吸晃动
  const wob = P.reduced ? 1 : 1 + 0.03 * Math.sin(t/260);
  ctx.save();
  ctx.translate(W/2, 42);
  ctx.scale(wob, 1);
  ctx.translate(-W/2, -42);
  const state = slimeState(P, t);
  const rows = slimeRowsFor(state);
  const scale = 8, ox = (W - 16*scale)/2, oy = 34;
  for(let y=0;y<rows.length;y++){
    for(let x=0;x<16;x++){
      const ch = rows[y][x];
      if(ch === '.') continue;
      ctx.fillStyle = SLIME_COLORS[ch] || '#3ddc84';
      ctx.fillRect(ox + x*scale, oy + y*scale, scale, scale);
    }
  }
  ctx.restore();
  // 状态与数值（每 15 帧刷新一次）
  P.frameN++;
  if(P.frameN % 15 === 0){
    P.hunger = Math.max(0, P.hunger - 1);
    P.mood = Math.max(0, P.mood - 1);
    updatePetUI(P);
  }
}
function updatePetUI(P){
  const h = $('#petHunger'), m = $('#petMood');
  if(h) h.style.width = P.hunger + '%';
  if(m) m.style.width = P.mood + '%';
  if(!P.status) return;
  if(P.hunger >= 100) P.status.textContent = '吃撑了，动不了';
  else if(P.hunger <= 20) P.status.textContent = '好饿……求投喂';
  else if(P.mood >= 75) P.status.textContent = '开心得冒泡泡';
  else if(P.mood <= 20) P.status.textContent = '有点低落，摸摸我';
  else P.status.textContent = '状态不错';
}
function feedPet(){
  const P = pet; if(!P) return;
  if(P.hunger >= 100){ P.status.textContent = '吃撑了！再喂要吐了'; sfx.bonk(); return; }
  P.hunger = Math.min(100, P.hunger + 25);
  P.mood = Math.min(100, P.mood + 5);

  updatePetUI(P);
}
function patPet(P, stage){

  P.mood = Math.min(100, P.mood + 15);

  sfx.point();
  spawnHearts(stage);

function launchRocket(F, x, y){
  F.rockets.push({ x:240, y:320, vx:(x-240)/55, vy:-((320-y)/55), targetY:y });
}
function burstFireworks(F, x, y){
  const cols = ['#ff3d5a','#ffc53d','#3ddc84','#4da6ff','#b18cff','#ff8ac2'];
  const col = cols[Math.floor(Math.random()*cols.length)];
  const n = 38 + Math.floor(Math.random()*20);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 1 + Math.random()*2.4;
    F.parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, col, size:2 + (Math.random()<.4?2:0) });
  }
  F.n++;
  $('#fwCount').textContent = F.n;
  sfx.pop();
}
function stepFireworks(F){
  const { ctx, cv } = F;
  ctx.fillStyle = 'rgba(12,13,26,.24)';
  ctx.fillRect(0, 0, 480, 320);
  for(let i=F.rockets.length-1;i>=0;i--){
    const r = F.rockets[i];
    r.x += r.vx; r.y += r.vy;
    ctx.fillStyle = '#ffc53d';
    ctx.fillRect(r.x - 1, r.y - 1, 3, 6);
    if(r.y <= r.targetY || r.y <= 28){ burstFireworks(F, r.x, r.y); F.rockets.splice(i, 1); }
  }
  for(let i=F.parts.length-1;i>=0;i--){
    const p = F.parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.vx *= 0.985; p.vy *= 0.985; p.life -= 0.012;
    if(p.life <= 0){ F.parts.splice(i, 1); continue; }
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function stepFish(F){
  const { ctx, cv } = F;
  ctx.fillStyle = '#10182e';
  ctx.fillRect(0, 0, 480, 300);
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.fillRect(0, 270, 480, 30);
  for(let i=F.bubbles.length-1;i>=0;i--){
    const b = F.bubbles[i];
    b.y += b.vy; b.life -= 0.02;
    ctx.fillStyle = 'rgba(180,200,255,' + Math.max(0, b.life) + ')';
    ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
    if(b.life <= 0 || b.y < 0) F.bubbles.splice(i, 1);
  }
  for(const f of F.fish){
    f.x += f.vx;
    if(f.x < 12){ f.x = 12; f.vx = Math.abs(f.vx); }
    if(f.x > 480 - 12){ f.x = 480 - 12; f.vx = -Math.abs(f.vx); }
    if(f.startled > 0) f.startled--;
    const dir = f.vx > 0 ? 1 : -1;
    ctx.fillStyle = f.col;
    ctx.fillRect(f.x - f.size, f.y - f.size/2, f.size*2, f.size);
    ctx.fillRect(f.x - dir*f.size, f.y - f.size/2 - 2, 3, f.size + 4);
    ctx.fillStyle = '#0b0c18';
    ctx.fillRect(f.x + dir*f.size*0.6, f.y - 2, 2, 2);
  }
}

function pourSand(S,p){
  if(S.grains.length>2000) return;
  for(let i=0;i<8;i++){ S.grains.push({x:p.x+(Math.random()-.5)*6, y:p.y, col:S.color}); }
  $('#sdC').textContent=Math.min(2000,S.grains.length);
}
function stepSand(S){
  const {ctx,cv}=S;
  ctx.fillStyle='#1a1b30'; ctx.fillRect(0,0,360,320);
  const cell=3, gx=Math.floor(360/cell), gy=Math.floor(320/cell);
  const occ=Array.from({length:gy},()=>Array(gx).fill(false));
  for(const g of S.grains){
    let xx=Math.max(0,Math.min(gx-1,Math.floor(g.x/cell)));
    let yy=Math.max(0,Math.min(gy-1,Math.floor(g.y/cell)));
    while(yy+1<gy && !occ[yy+1][xx]){ yy++; }
    if(yy+1<gy){
      if(xx>0 && !occ[yy+1][xx-1] && !occ[yy][xx-1]){ occ[yy+1][xx-1]=true; ctx.fillStyle=g.col; ctx.fillRect((xx-1)*cell,(yy+1)*cell,cell,cell); }
      else if(xx<gx-1 && !occ[yy+1][xx+1] && !occ[yy][xx+1]){ occ[yy+1][xx+1]=true; ctx.fillStyle=g.col; ctx.fillRect((xx+1)*cell,(yy+1)*cell,cell,cell); }
      else { occ[yy][xx]=true; ctx.fillStyle=g.col; ctx.fillRect(xx*cell,yy*cell,cell,cell); }
    } else { occ[yy][xx]=true; ctx.fillStyle=g.col; ctx.fillRect(xx*cell,yy*cell,cell,cell); }
  }
}

    cv.addEventListener('pointerdown', ()=>kaleidoSeed(K,true));
    kaleidoSeed(K,false);
    K.loop=()=>{ stepKaleido(K); K.raf=requestAnimationFrame(K.loop); };
    K.raf=requestAnimationFrame(K.loop);
  },
  destroy(){ if(kaleidoT){ cancelAnimationFrame(kaleidoT.raf); kaleidoT=null; } }
};
function kaleidoSeed(K,reseed){
  K.speckles=[];
  const n=7+Math.floor(Math.random()*4);
  for(let i=0;i<n;i++){
    K.speckles.push({
      a:Math.random()*Math.PI*2,
      r:25+Math.random()*130,
      spd:(Math.random()<0.5?-1:1)*(0.2+Math.random()*0.5),
      sz:3+Math.random()*5,
      col:Math.floor(Math.random()*K.PAL[K.palette].length)
    });
  }
  if(reseed){
    K.palette=(K.palette+1)%K.PAL.length;
    $('#kalP').textContent=['霓虹','糖果','神秘'][K.palette];
    sfx.pop();
  }
  K.ctx.fillStyle='#0e0f1d'; K.ctx.fillRect(0,0,480,360);
}
function stepKaleido(K){
  K.frames++; K.rot+=0.0012;
  const {ctx}=K;
  ctx.fillStyle='rgba(14,15,29,0.055)'; ctx.fillRect(0,0,480,360);
  ctx.save(); ctx.translate(240,180); ctx.rotate(K.rot);
  const cols=K.PAL[K.palette];
  for(let s=0;s<K.spokes;s++){
    ctx.save(); ctx.rotate(s*Math.PI*2/K.spokes);
    for(const sp of K.speckles){
      sp.a+=sp.spd*0.014;
      const rr=Math.sin(K.frames/210+sp.r)*0.15+1;
      const rad=sp.r*rr;
      for(const m of [sp.a,-sp.a]){
        const x=Math.cos(m)*rad, y=Math.sin(m)*rad;
        ctx.fillStyle=cols[sp.col];
        ctx.fillRect(x-sp.sz/2,y-sp.sz/2,sp.sz,sp.sz);
        ctx.fillStyle='rgba(238,240,255,.35)';
        ctx.fillRect(x-sp.sz/2,y-sp.sz/2,sp.sz/2,sp.sz/2);
      }
    }
    ctx.restore();
  }
  ctx.restore();
}

      }

    });

    SL.raf=requestAnimationFrame(SL.loop);
  },
  destroy(){ if(slimeT){ cancelAnimationFrame(slimeT.raf); slimeT=null; } }
};
function stepSlime(SL){
  SL.frames++;
  const tgt = SL.mouse.live? SL.mouse : {x:240+Math.sin(SL.frames/90)*60, y:160+Math.sin(SL.frames/63)*36};
  if(SL.blink>0) SL.blink--;
  if(SL.frames>SL.blinkAt){ SL.blink=6; SL.blinkAt=SL.frames+140+Math.random()*180; }
  for(const p of SL.pts){
    p.vx*=SL.d; p.vy*=SL.d;
    p.vy+=0.28;
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<16){ p.x=16; p.vx=Math.abs(p.vx)*0.6; } if(p.x>464){ p.x=464; p.vx=-Math.abs(p.vx)*0.6; }
    if(p.y<16){ p.y=16; p.vy=Math.abs(p.vy)*0.5; } if(p.y>304){ p.y=304; p.vy=-Math.abs(p.vy)*0.5; }
  }
  const N=SL.pts.length, cx=tgt.x, cy=tgt.y;
  for(let i=0;i<N;i++){
    const p=SL.pts[i];
    const ringA=i/N*Math.PI*2;
    const tx=cx+Math.cos(ringA)*62, ty=cy+Math.sin(ringA)*54;
    p.vx+=(tx-p.x)*SL.k; p.vy+=(ty-p.y)*SL.k*0.85;
    const nb=SL.pts[(i+1)%N], pb=SL.pts[(i-1+N)%N];
    for(const q of [nb,pb]){
      const dx=q.x-p.x, dy=q.y-p.y, dist=Math.hypot(dx,dy)||1;
      const rest=52;
      const f=(dist-rest)/dist*0.06;
      p.vx+=dx*f; p.vy+=dy*f; q.vx-=dx*f; q.vy-=dy*f;
    }
  }
  drawSlime(SL);
}
function drawSlime(SL){
  const {ctx}=SL;
  ctx.fillStyle='#0e0f1d'; ctx.fillRect(0,0,480,320);
  ctx.fillStyle='#23244a';
  ctx.beginPath(); ctx.ellipse(240,286,130,10,0,0,Math.PI*2); ctx.fill();
  const ps=SL.pts;
  ctx.beginPath();
  const mx=(a,b)=>(a.x+b.x)/2, my=(a,b)=>(a.y+b.y)/2;
  ctx.moveTo(mx(ps[N0()],ps[next(0)]), my(ps[N0()],ps[next(0)]));
  for(let i=0;i<ps.length;i++){
    const cur=ps[i], nx=ps[next(i)];
    ctx.quadraticCurveTo(cur.x,cur.y,mx(cur,nx),my(cur,nx));
  }
  ctx.closePath();
  ctx.fillStyle='#3ddc84'; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle='#0b0c18'; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.3)';
  ctx.beginPath(); ctx.ellipse(210,120,26,14,-0.5,0,Math.PI*2); ctx.fill();
  const c={x:0,y:0};
  for(const p of ps){ c.x+=p.x/ps.length; c.y+=p.y/ps.length; }
  const blink=SL.blink>0;
  ctx.fillStyle='#0b0c18';
  ctx.fillRect(c.x-26,c.y-6,9,blink?2:12);
  ctx.fillRect(c.x+17,c.y-6,9,blink?2:12);
  const sq=SL.frames%14<7?0:2;
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.fillRect(208+sq,130,4,4);
}
function N0(){ return 0; }
function next(i){ return (i+1)%18; }

const WAV_LAYERS=[[180,'#2b4f8a',9,1.1],[214,'#3a6ea8',12,0.8],[248,'#2b3f74',15,0.6],[282,'#20304a',18,0.42]];
function stepWaves(W){
  W.frames++;
  const {ctx}=W;
  const grad=ctx.createLinearGradient(0,0,0,320);
  grad.addColorStop(0,'#0b1030'); grad.addColorStop(1,'#14203e');
  ctx.fillStyle=grad; ctx.fillRect(0,0,480,320);
  for(const st of W.stars){
    ctx.fillStyle='rgba(230,235,255,'+(0.3+0.5*Math.abs(Math.sin(W.frames/50+st.tw)))+')';
    ctx.fillRect(st.x,st.y,st.s,st.s);
  }
  ctx.fillStyle='#ffe95c'; ctx.beginPath(); ctx.arc(390,64,26,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#14203e'; ctx.beginPath(); ctx.arc(381,58,22,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,233,92,.25)'; ctx.beginPath(); ctx.arc(390,64,34,0,Math.PI*2); ctx.fill();
  const t=W.frames;
  for(const [base,col,amp,spd] of WAV_LAYERS){
    ctx.beginPath(); ctx.moveTo(0,320);
    for(let x=0;x<=480;x+=8){
      const y=base + Math.sin(x*0.022 + t*0.02*spd + W.tilt*(1.2-spd)*2)*amp * Math.cos(x*0.004 + W.tilt*0.8);
      ctx.lineTo(x,y);
    }
    ctx.lineTo(480,320); ctx.closePath();
    ctx.fillStyle=col; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=2;
    ctx.beginPath();
    for(let x=0;x<=480;x+=8){
      const y=base + Math.sin(x*0.022 + t*0.02*spd + W.tilt*(1.2-spd)*2)*amp*Math.cos(x*0.004 + W.tilt*0.8);
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  for(let i=W.ripples.length-1;i>=0;i--){
    const r=W.ripples[i];
    r.r+=0.9; r.a-=0.012;
    if(r.a<=0){ W.ripples.splice(i,1); continue; }
    ctx.strokeStyle='rgba(180,210,255,'+r.a+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(r.x,r.y,r.r,r.r*0.34,0,0,Math.PI*2); ctx.stroke();
  }
}

const TREE_SEASONS=[
  ['#ff8ac2','#ffb3cf','#eef0ff'],
  ['#3ddc84','#2fa86b','#5eead4'],
  ['#ffc53d','#ff9f43','#ff8ac2'],
  ['#b18cff','#4da6ff','#eef0ff']
];
function treeGrow(T){
  T.mount.querySelectorAll('.overlay').forEach(o=>o.remove());
  T.segs=[]; T.growTo=0; T.leaves=[]; T.drops=[];
  T.season=Math.floor(Math.random()*4);
  $('#treL').textContent=['春樱','夏荫','秋实','冬梦'][T.season];
  $('#treC').textContent=++T.trees;
  T.count++;
  const cols=TREE_SEASONS[T.season];
  const build=(x,y,ang,len,depth)=>{
    const nx=x+Math.cos(ang)*len, ny=y+Math.sin(ang)*len;
    T.segs.push({x1:x,y1:y,x2:nx,y2:ny,d:depth});
    if(depth>=9||len<7){ T.leaves.push({x:nx,y:ny,col:cols[Math.floor(Math.random()*3)],s:2+Math.random()*3}); return; }
    const n=2+(Math.random()<0.25?1:0);
    for(let i=0;i<n;i++){
      const spread=0.38+Math.random()*0.45;
      const na=ang+(n===2?(i===0?spread:-spread):[-spread,0,spread][i]);
      build(nx,ny,na+(Math.random()-0.5)*0.18,len*(0.68+Math.random()*0.14),depth+1);
    }
  };
  build(240,345,-Math.PI/2+(Math.random()-0.5)*0.2,64+Math.random()*26,0);
  T.maxDepth=Math.max.apply(null,T.segs.map(s=>s.d));
  sfx.pop();
}
function stepTree(T){
  T.frames++;
  if(T.growTo<T.maxDepth){ T.growTo=Math.min(T.maxDepth,T.growTo+0.08); }
  if(T.growTo>=T.maxDepth&&T.frames%5===0&&T.leaves.length){
    const l=T.leaves[Math.floor(Math.random()*T.leaves.length)];
    T.drops.push({x:l.x,y:l.y,vy:0.4+Math.random()*0.6,sw:Math.random()*6,col:l.col,s:l.s});
    if(T.drops.length>90) T.drops.shift();
  }
  const {ctx}=T;
  ctx.fillStyle='#12132a'; ctx.fillRect(0,0,480,360);
  ctx.fillStyle='#1c1e3a'; ctx.fillRect(0,340,480,20);
  for(let d=0;d<=Math.floor(T.growTo);d++){
    const dd=d;
    for(const s of T.segs){
      if(s.d!==dd) continue;
      ctx.strokeStyle='#8a5a33';
      ctx.lineWidth=Math.max(1.4,5.2-dd*0.5);
      ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
    }
  }
  if(T.growTo>=T.maxDepth){
    for(const l of T.leaves){
      ctx.fillStyle=l.col;
      ctx.fillRect(l.x-l.s/2,l.y-l.s/2,l.s,l.s);
    }
  }
  for(let i=T.drops.length-1;i>=0;i--){
    const d=T.drops[i];
    d.y+=d.vy; d.x+=Math.sin(T.frames/22+d.sw)*0.5;
    if(d.y>356){ T.drops.splice(i,1); continue; }
    ctx.fillStyle=d.col;
    ctx.fillRect(d.x,d.y,d.s,d.s);
  }
}

function beatTick(B){
  if(!B.playing){ B.step=(B.step+1)%8; return; }
  const r=B.rows;
  if(r[0].cells[B.step]) { tone(140,0.18,'sine',0.16,42); }
  if(r[1].cells[B.step]) { tone(900,0.05,'square',0.08,620); setTimeout(()=>tone(220,0.1,'triangle',0.06,110),10); }
  if(r[2].cells[B.step]) { tone(6200,0.035,'square',0.045,3600); }
  if(r[2].cells[(B.step+3)%8]&&B.step%2===0) tone(5400,0.02,'square',0.03);
  B.step=(B.step+1)%8;
  paintBeat(B);
}

const WTH_SKY={sunny:'#2b5f8a',rain:'#1a2a4a',snow:'#2c3556',storm:'#12142e'};
function stepWeather(W){
  W.frames++;
  const {ctx}=W, windy=W.wind*W.wind;
  ctx.fillStyle=WTH_SKY[W.mode]; ctx.fillRect(0,0,480,320);
  if(W.mode==='sunny'){
    ctx.fillStyle='#ffe95c';
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4+W.frames*0.01;
      ctx.fillRect(70+Math.cos(a)*30-2,60+Math.sin(a)*30-2,4,4);
    }
    ctx.beginPath(); ctx.arc(70,60,20,0,Math.PI*2); ctx.fill();
  }
  if(W.mode==='storm'){
    ctx.fillStyle='rgba(200,205,240,.5)';
    ctx.fillRect(30,26,140,16); ctx.fillRect(60,14,90,14);
  }
  ctx.fillStyle='rgba(230,235,245,.85)';
  const cs=1+W.wind*0.15;
  W.cloudX+=0.3+cs*0.5;
  if(W.cloudX>560) W.cloudX=-120;
  const cy=W.mode==='sunny'?130:70;
  ctx.fillRect(W.cloudX,cy,70,14); ctx.fillRect(W.cloudX+18,cy-9,44,10);
  if(W.mode==='rain'||W.mode==='storm'){
    ctx.strokeStyle='rgba(154,200,255,.7)'; ctx.lineWidth=1.5;

    for(const d of W.drops){

      if(d.x<-12) d.x+=500;
      ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-W.wind*2.4,d.y-9);
    }
    ctx.stroke();
  }
  if(W.mode==='storm'){
    ctx.strokeStyle='rgba(170,180,255,.7)'; ctx.beginPath();
    for(const f of W.flakes){
      f.y+=f.sp; f.x+=Math.sin(W.frames/30+f.sw)*0.4-W.wind*0.8;
      if(f.y>320){ f.y=-6; f.x=Math.random()*480; }
      if(f.x<-6) f.x+=490;
      ctx.fillRect(f.x,f.y,f.s,f.s);

    ctx.stroke();
    W.nextBolt--;
    if(W.nextBolt<=0){ W.flash=7; W.nextBolt=100+Math.random()*160; sfx.bonk(); }
  }
  if(W.mode==='snow'){
    ctx.fillStyle='rgba(238,242,255,.9)';
    for(const f of W.flakes){
      f.y+=f.sp; f.x+=Math.sin(W.frames/30+f.sw)*0.5-W.wind*0.7;
      if(f.y>320){ f.y=-6; f.x=Math.random()*480; }
      if(f.x<-6) f.x+=490;
      ctx.fillRect(f.x,f.y,f.s,f.s);
    }
  }
  ctx.fillStyle='#14152b';
  ctx.beginPath(); ctx.moveTo(0,320); ctx.lineTo(0,270); ctx.lineTo(140,238); ctx.lineTo(300,268); ctx.lineTo(480,250); ctx.lineTo(480,320); ctx.fill();
  ctx.fillRect(200,196,90,72);
  ctx.fillStyle='#b8243a'; ctx.beginPath(); ctx.moveTo(192,196); ctx.lineTo(245,164); ctx.lineTo(298,196); ctx.fill();
  ctx.fillStyle=W.mode==='sunny'?'#5b5d92':'#ffe95c';
  ctx.fillRect(226,214,18,16);
  ctx.fillStyle='#0b0c18'; ctx.fillRect(258,232,14,36);
  ctx.fillStyle='#2c2d5c';
  ctx.fillRect(330,236,6,40); ctx.beginPath(); ctx.arc(333,234,13,0,Math.PI*2); ctx.fill();
  if(W.flash>0){
    ctx.fillStyle='rgba(238,242,255,'+(W.flash/10)+')'; ctx.fillRect(0,0,480,320);
    ctx.fillStyle='#ffe95c';
    ctx.beginPath(); ctx.moveTo(120,40); ctx.lineTo(150,40); ctx.lineTo(136,86); ctx.lineTo(174,80); ctx.lineTo(120,150); ctx.lineTo(138,102); ctx.lineTo(108,108); ctx.fill();

let breathT = null;
TOYS.breath = {
  title:'呼吸球',
  mount(mountEl, statsEl){
    mountEl.classList.add('stage');
    const B = breathT = { raf:0, t0:performance.now(), paused:false, cycle:0, pausedAt:0 };
    statsEl.innerHTML='<div class="stat">轮次<b id="brtC">0</b></div><button class="px-btn ghost" id="brtP" type="button">暂停</button>';
    $('#brtP').addEventListener('click',()=>{
      B.paused=!B.paused;
      if(B.paused){ B.pausedAt=performance.now(); $('#brtP').textContent='继续'; }
      else { B.t0+=performance.now()-B.pausedAt; $('#brtP').textContent='暂停'; }
      sfx.click();
    });
    const { cv, ctx } = makeCanvas(480,320);
    cv.className='pix-canvas'; mountEl.appendChild(cv);
    B.cv=cv; B.ctx=ctx;
    cv.addEventListener('pointerdown', ()=>{ $('#brtP').click(); });
    const PHASES=[
      {name:'吸气',d:4000,mode:'in',col:'#3ddc84'},
      {name:'屏息',d:7000,mode:'hold',col:'#ffc53d'},
      {name:'呼气',d:8000,mode:'out',col:'#ff8ac2'}
    ];
    B.PHASES=PHASES;
    B.loop=()=>{ stepBreath(B,performance.now()); B.raf=requestAnimationFrame(B.loop); };
    B.raf=requestAnimationFrame(B.loop);
  },
  destroy(){ if(breathT){ cancelAnimationFrame(breathT.raf); breathT=null; } }
};
function stepBreath(B,now){
  const {ctx}=B;
  let t=now-B.t0;
  const total=B.PHASES.reduce((s,p)=>s+p.d,0);
  const cyc=Math.floor(t/total);
  if(cyc>B.cycle){ B.cycle=cyc; $('#brtC').textContent=cyc+1; sfx.point(); }
  let tt=t%total, ph=B.PHASES[0], acc=0;
  acc=0; for(const p of B.PHASES){ if(tt<acc+p.d){ ph=p; break; } acc+=p.d; }
  const pt=tt-acc-0, prog=Math.min(1,Math.max(0,pt/ph.d));
  let scale;
  if(ph.mode==='in'){ scale=0.4+0.6*Math.sin(prog*Math.PI/2); }
  else if(ph.mode==='hold'){ scale=1+Math.sin(now/300)*0.03; }
  else { scale=1-0.6*Math.sin(prog*Math.PI/2); }
  scale=Math.max(0.35,Math.min(1.05,scale));
  ctx.fillStyle='#0e0f1d'; ctx.fillRect(0,0,480,320);
  ctx.fillStyle=ph.col+'26';
  ctx.beginPath(); ctx.arc(240,160,86*scale+26,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=ph.col;
  ctx.globalAlpha=0.32;
  ctx.beginPath(); ctx.arc(240,160,86*scale,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=0.85;
  ctx.beginPath(); ctx.arc(240,160,64*scale,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle='#eef0ff';
  ctx.font='20px "Press Start 2P",DotGothic16,monospace'; ctx.textAlign='center';
  ctx.fillText(ph.name,240,154);
  ctx.font='13px DotGothic16,monospace';
  ctx.fillText(Math.ceil((ph.d-pt)/1000)+' 秒',240,182);
  ctx.fillStyle='#9aa0d8';
  ctx.fillText(ph.mode==='in'?'用鼻子慢慢吸~~':ph.mode==='hold'?'轻轻停住不要动':'用嘴巴慢慢呼出~',240,262);
  ctx.textAlign='left';
}

let harpT = null;
TOYS.harp = {
  title:'彩虹竖琴',
  mount(mountEl, statsEl){
    mountEl.classList.add('stage');
    const H = harpT = { raf:0, frames:0, strings:[], prevX:null };
    const base=[261.63,293.66,329.63,392,440];
    const names=['C4','D4','E4','G4','A4','C5','D5','E5','G5','A5','C6','D6'];
    const mults=[1,2,3,4];

      H.strings.push({ mult:mults[Math.floor(i/5)]||4, idx:i%5, amp:0, ph:Math.random()*6, name:names[i] });
    }
    statsEl.innerHTML='<div class="stat">弹了<b id="hrpC">0</b> 下</div>';

    H.count=0;

      const r=cv.getBoundingClientRect(); H.prevX=(e.clientX-r.left)/r.width*480;
    });
    cv.addEventListener('pointermove', e=>{
      const r=cv.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width*480;
      if(H.prevX!=null){
        H.strings.forEach((s,i)=>{
          const sx=40+i*36.5;
          if((H.prevX-sx)*(x-sx)<0){ s.amp=9; tone(261.63*s.mult*[1,9/8,5/4,3/2,5/3][s.idx],0.5,'triangle',0.06); H.count++; $('#hrpC').textContent=H.count; }
        });
      }
      H.prevX=x;
    });
    cv.addEventListener('pointerleave', ()=>{ H.prevX=null; });
    cv.addEventListener('pointerup', ()=>{ H.prevX=null; });
    H.loop=()=>{ stepHarp(H); H.raf=requestAnimationFrame(H.loop); };
    H.raf=requestAnimationFrame(H.loop);
  },
  destroy(){ if(harpT){ cancelAnimationFrame(harpT.raf); harpT=null; } }
};
function stepHarp(H){
  H.frames++;
  const {ctx}=H;
  ctx.fillStyle='#0e0f1d'; ctx.fillRect(0,0,480,320);
  ctx.fillStyle='#8a5a33'; ctx.fillRect(16,26,8,268); ctx.fillRect(456,26,8,268); ctx.fillRect(16,26,448,6);
  const hcl=['#ff3d5a','#ff9f43','#ffc53d','#3ddc84','#4da6ff','#b18cff'];
  H.strings.forEach((s,i)=>{
    s.amp*=0.94; if(s.amp<0.1) s.amp=0;
    const sx=40+i*36.5;
    const hueBase=i/11;
    const col=hcl[i%6];
    ctx.strokeStyle=col; ctx.lineWidth=(s.amp>1?2.4:1.6);
    ctx.beginPath();
    for(let u=0;u<=1;u+=0.06){
      const y=32+u*256;
      const dx=Math.sin(u*Math.PI*2.5+s.ph+H.frames*0.25)*s.amp*Math.sin(u*Math.PI);
      if(u===0) ctx.moveTo(sx,y); else ctx.lineTo(sx+dx,y);
    }
    ctx.stroke();
    if(s.amp>1){ ctx.fillStyle=col+'55'; ctx.fillRect(sx-2,32,4,4); }
    ctx.fillStyle='rgba(154,160,216,.7)'; ctx.font='9px "Press Start 2P",monospace'; ctx.textAlign='center';
    ctx.fillText(s.name,sx,312);
  });
  ctx.textAlign='left';
}

let glowT = null;
TOYS.glow = {
  title:'光迹笔',
  mount(mountEl, statsEl){
    mountEl.classList.add('stage');
    const G = glowT = { raf:0, frames:0, strokes:[], cur:null, hue:40, count:0 };
    statsEl.innerHTML='<div class="stat">笔画<b id="glwC">0</b></div><button class="px-btn ghost" id="glwClr" type="button">清屏</button>';
    $('#glwClr').addEventListener('click', ()=>{ G.strokes=[]; G.count=0; $('#glwC').textContent='0'; G.ctx.fillStyle='#0a0b16'; G.ctx.fillRect(0,0,480,320); sfx.bonk(); });
    const { cv, ctx } = makeCanvas(480,320);
    cv.className='pix-canvas'; mountEl.appendChild(cv);
    G.cv=cv; G.ctx=ctx;
    ctx.fillStyle='#0a0b16'; ctx.fillRect(0,0,480,320);
    const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*480,y:(e.clientY-r.top)/r.height*320}; };
    cv.addEventListener('pointerdown', e=>{ G.cur={pts:[pos(e)],hue:(G.hue+=47)%360,done:false}; sfx.click(); });
    cv.addEventListener('pointermove', e=>{
      if(!G.cur) return;
      const p=pos(e), last=G.cur.pts[G.cur.pts.length-1];
      if(Math.hypot(p.x-last.x,p.y-last.y)>3){ G.cur.pts.push(p); G.count++; $('#glwC').textContent=G.count; }
    });
    const end=()=>{ if(G.cur){ G.cur.done=true; G.strokes.push(G.cur); if(G.strokes.length>36) G.strokes.shift(); G.cur=null; } };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointerleave', end);
    G.loop=()=>{ stepGlow(G); G.raf=requestAnimationFrame(G.loop); };
    G.raf=requestAnimationFrame(G.loop);
  },
  destroy(){ if(glowT){ cancelAnimationFrame(glowT.raf); glowT=null; } }
};
function stepGlow(G){
  G.frames++;
  const {ctx}=G;
  ctx.fillStyle='rgba(10,11,22,0.16)'; ctx.fillRect(0,0,480,320);
  const drawStroke=(st,glow)=>{
    const pts=st.pts;
    if(pts.length<2) return;
    const alpha=st.done?Math.max(0,1-st.age*0.02):1;
    if(alpha<=0) return;
    ctx.lineCap='round';
    if(glow){ ctx.strokeStyle='hsla('+st.hue+',95%,60%,'+(alpha*0.22)+')'; ctx.lineWidth=9; }
    else { ctx.strokeStyle='hsla('+st.hue+',95%,'+(58+Math.sin(G.frames/9)*6)+'%,'+alpha+')'; ctx.lineWidth=2.5; }
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
    ctx.stroke();
  };
  for(const st of G.strokes){
    if(st.done) st.age=(st.age||0)+1;
  }
  G.strokes=G.strokes.filter(st=>!st.done||(st.age||0)<70);
  for(const st of G.strokes) drawStroke(st,true);
  if(G.cur) drawStroke(G.cur,true);
  for(const st of G.strokes) drawStroke(st,false);
  if(G.cur) drawStroke(G.cur,false);
}

/* ---------- 大厅分页 ---------- */
function initPager(pagerSel, cardSel, perPage){
  const cards = $$(cardSel);
  const pager = $(pagerSel);
  if (!cards.length) return;
  let page = 0;
  const pages = Math.max(1, Math.ceil(cards.length / perPage));
  const show = () => {
    cards.forEach((c, i) => { c.style.display = Math.floor(i / perPage) === page ? '' : 'none'; });
    if (pages > 1) {
      pager.innerHTML = ''
        + '<button class="px-btn ghost pg-btn" data-pg="prev" type="button"' + (page === 0 ? ' disabled' : '') + '>◀</button>'
        + '<span class="pg-info">' + (page + 1) + ' / ' + pages + '</span>'
        + '<button class="px-btn ghost pg-btn" data-pg="next" type="button"' + (page === pages - 1 ? ' disabled' : '') + '>▶</button>';
    } else {
      pager.innerHTML = '';
    }
  };
  pager.addEventListener('click', e => {
    const b = e.target.closest('[data-pg]');
    if (!b) return;
    if (b.dataset.pg === 'prev' && page > 0) { page--; show(); sfx.click(); }
    if (b.dataset.pg === 'next' && page < pages - 1) { page++; show(); sfx.click(); }
  });
  show();
}
